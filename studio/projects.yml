schema: 1
output_root: ~/Downloads/pub5-studio
projects:
  dilla:
    status: source_preserved
    entrypoint: studio/dilla/dilla.rb
    data: [studio/dilla/data/dilla.json, studio/dilla/data/music_theory.json, studio/dilla/data/recovered_music.json, studio/dilla/data/showcase.json]
    execution: direct_ruby
  postpro:
    status: source_migration_pending
    entrypoint: studio/postpro/postpro.rb
    blockers: [dependency_audit, missing_style_registry_contract, missing_source_map_contract, core_http_adapter]
  replicate:
    status: source_migration_pending
    entrypoint: studio/replicate/client.rb
    blockers: [core_http_adapter, declared_secret_provider]
policy:
  generated_media_in_git: false
  models_and_checkpoints_in_git: false
  output_must_resolve_outside_checkout: true
