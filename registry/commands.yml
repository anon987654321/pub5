# Every bin/master command. bin/master is the one entrypoint for every
# surface (terminal, pipe, ssh, scripts; the web face and /fix arrive as
# commands, not as more binaries). Each command names the plugin that
# implements it, the contexts it runs in and its capability manifest: the
# World verbs it may use and what each may reach. bin/master boots core
# plus that one plugin and nothing else. exec names argv[0]'s basename, and
# RbConfig.ruby is ruby34 on the OpenBSD box, so a command that runs Ruby
# declares both.
commands:
  check:
    summary: The gate every push passes - parse, enforced Laws, tests.
    plugin: master/commands/check.rb
    class: Commands::Check
    contexts: [tty, pipe, remote]
    verbs:
      read: ["**/*"]
      exec: [ruby, ruby34]
      git: [ls-files, diff, show]
  lint:
    summary: The parse gate and the enforced Laws, without tests (bin/lint).
    plugin: master/commands/check.rb
    class: Commands::Lint
    contexts: [tty, pipe, remote]
    verbs:
      read: ["**/*"]
      git: [ls-files, diff, show]
  test:
    summary: The minitest suites under test/ (bin/test).
    plugin: master/commands/check.rb
    class: Commands::Test
    contexts: [tty, pipe, remote]
    verbs:
      exec: [ruby, ruby34]
      git: [ls-files, diff]
  setup:
    summary: Point git at .githooks so the gate and the commit format run on every commit.
    plugin: master/commands/setup.rb
    class: Commands::Setup
    contexts: [tty, pipe, remote]
    verbs:
      git: [config, rev-parse]
  generate:
    summary: Rewrite every generated file from its registry sources.
    plugin: master/commands/generate.rb
    class: Commands::Generate
    contexts: [tty, pipe, remote]
    verbs:
      write: [AGENTS.md, CLAUDE.md]
  laws:
    summary: List Laws, census the tree, or review a semantic Law against supplied evidence.
    plugin: master/commands/laws.rb
    class: Commands::Laws
    contexts: [tty, pipe, remote]
    verbs:
      read: ["**/*"]
      exec: [claude, grok, codex, agy]
      llm: [anthropic, openai, openrouter, deepseek, xai, mistral]
      git: [ls-files, rev-parse]
  scan:
    summary: Scan the tree with every deterministic Law and report it as a boot (scan [tree|path] [--dry-run]).
    plugin: master/commands/scan.rb
    class: Commands::Scan
    contexts: [tty, pipe, remote]
    verbs:
      read: ["**/*"]
      write: ["tmp/fix/**"]
      git: [ls-files, diff, rev-parse]
  knobs:
    summary: List the declared environment knobs and the budget.
    plugin: master/commands/knobs.rb
    class: Commands::Knobs
    contexts: [tty, pipe, remote]
    verbs: {}
  gate:
    summary: Judge each new commit on main with its own bin/check and merge green in-tree inbox branches (gate --status).
    plugin: master/commands/gate.rb
    class: Commands::Gate
    contexts: [tty, pipe, remote]
    verbs:
      read: ["log/gate/*"]
      write: ["log/gate/*"]
      # git runs through exec so the hook environment can be withheld
      # (master/gate/repo.rb).
      exec: [git, ruby, ruby34, rm]
  port-laws:
    summary: Import every pub4 Law into laws/pub4/ and registry/laws.yml (port-laws PUB4 [--ref REF] [--agent-rules FILE]).
    plugin: master/commands/port_laws.rb
    class: Commands::PortLaws
    contexts: [tty, pipe, remote]
    verbs:
      read: ["**/*"]
      write: ["laws/pub4/**/*", registry/laws.yml]
      exec: [git, ruby, ruby34]
  repl:
    summary: The conversation REPL; bin/master with no command on a terminal. In a pipe, one turn per line.
    plugin: master/cli/repl.rb
    class: Cli::Repl
    contexts: [tty, pipe, remote]
    verbs:
      read: ["log/master/*"]
      write: ["log/master/*"]
      exec: [claude, grok, codex, agy]
      llm: [anthropic, openai, openrouter, deepseek, xai, mistral]
  ask:
    summary: Ask once and print the answer (ask [-q] [--json] "question", or the question on stdin).
    plugin: master/cli/ask.rb
    class: Cli::Ask
    contexts: [tty, pipe, remote]
    verbs:
      read: ["log/master/*"]
      write: ["log/master/*"]
      exec: [claude, grok, codex, agy]
      llm: [anthropic, openai, openrouter, deepseek, xai, mistral]
  lanes:
    summary: The model lanes that are not answering, and until when.
    plugin: master/cli/ask.rb
    class: Cli::Lanes
    contexts: [tty, pipe, remote]
    verbs:
      read: ["log/master/*"]
  fix:
    summary: Repair Law findings with a model, one verified commit a repair (fix [tree|path] [--dry-run] [--focus LAW] [--visual]).
    plugin: master/fix/command.rb
    class: Commands::Fix
    contexts: [tty, pipe, remote]
    verbs:
      read: ["**/*"]
      write: ["**/*"]
      exec: [ruby, ruby34, claude, grok, codex, agy, sysctl, kill, Google Chrome, chromium, chrome]
      git: [rev-parse, ls-files, diff, show, add, commit, reset, blame]
      net: [127.0.0.1]
      llm: [anthropic, openai, openrouter, deepseek, xai, mistral]
