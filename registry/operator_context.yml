- key: operator_directive_memory_lands_in_master
  name: operator directive - memory, rules, logic land in MASTER first
  description: Durable session knowledge is written to MASTER/data/project_context.yml,
    not left in sidecar memory
  type: feedback
  body: 'Operator directive, 2026-10-03: ALWAYS write memory, rules, logic and harvested
    findings directly into MASTER - it is the primary surface for external LLMs (Claude,
    Grok, Codex et al.), so a lesson that exists only in one harness''s private memory
    is invisible to the other sessions and to the runtime. Session memory files remain
    a per-agent convenience; MASTER is the shared source of truth. Concretely: research
    harvests, learned constraints and standing directives get an entries: row here
    (or an edit to the owning data file), with the date in the key.'
- key: operator_master_resembles_openbsd
  name: MASTER resembles OpenBSD
  description: Operator directive 2026-11-06 - MASTER's laws, logic, behaviour and style follow OpenBSD as closely as possible
  type: feedback
  body: |-
    Correctness by default through restriction, continuous auditing, small
    trusted cores, least privilege, one canonical implementation per operation,
    and never reporting an unmeasured result as a pass (INCONCLUSIVE or
    BLOCKED instead). Prefer fewer, stricter Laws with real fixtures over more
    guidance; delete contradictory or dead machinery; terse dmesg-style output.
    The operator's earlier decisions stand where they differ: renders stay
    replaceable, work lands straight on main.
- key: operator_every_pixel_earns_its_place
  name: every pixel earns its place
  description: Operator directive 2026-11-06 - bare-minimum UI; navigation and chrome hidden by default and slid in on movement
  type: project
  body: |-
    No unnecessary elements. Header, tab rail, mobile bottom bar and secondary
    controls hide while the reader reads and slide in on scroll-up or an edge
    swipe on touch, and on pointer movement toward an edge on desktop. They are
    always shown at the page top, while a control inside has keyboard focus,
    when the page cannot scroll, and to assistive tech (hidden by transform,
    never display:none on the reveal path); under prefers-reduced-motion they
    appear without sliding. Each page keeps its one primary action visible.
    Supersedes the always-visible bottom bar from the 2026-11-06 x.com review.
- key: operator_design_decisions_2026_11_06
  name: RAILS design decisions 2026-11-06
  description: Operator answers to the screenshot review's open questions
  type: project
  body: |-
    Contrast at least 4.5:1, 7:1 for body text. Page h1 uses the shared_chrome
    scale in tokens.yml. Small labels or kickers above headings are banned
    (NO_EYEBROW_LABEL). amber's pastels become amber's own colour scheme as
    tokens. The header band is light everywhere except in dark mode. The TV
    accent moves away from the danger red. brgen's AI entry shows "1" in the
    nav counter pill, as if a message were waiting, instead of "new!".
    Reference products for principles only, never their look: x.com and
    reddit for the feed, bol.com for the marketplace, whyp.it for radio.
    BPLANS/ may use classic serif typography such as Garamond.
- key: operator_fix_mobile_first_and_simplify
  name: /fix captures mobile first and simplifies by subtraction
  description: Operator directives 2026-11-06 for /fix's visual lane
  type: project
  body: |-
    When /fix takes screenshots it captures and judges 390, 360 and 320 wide
    first; desktop widths come only after every mobile capture of the pass, and
    a capped pass drops desktop captures first. /fix has a simplify stage
    modelled on Claude Code's /simplify (reuse, simplification, efficiency,
    altitude): it only removes or merges, a count must fall (selectors,
    distinct values per property, DOM depth, variants, SCSS lines), and the
    pixel diff plus the computed-value audit must show no visible change or a
    change toward the Laws; each count becomes a ratchet. Visual work is held
    to measured values, state matrices, boundary widths, per-component specs,
    an independent reviewer and a guard for every fixed defect.
- key: operator_agents_token_efficient
  name: agents work token-efficiently
  description: Operator directive 2026-11-05 - terse reports, batched checks, no narration of routine events
  type: feedback
  body: |-
    Report results and blockers only; batch checks into one command; do not
    narrate routine monitor heartbeats; filter watchers to commits, failures
    and exits; do not re-read what is already in context. Judge another model's
    work by what its commits change, not by its report: patches from GLM and
    Fable on 2026-11-06 ran no tests and most did not hold against the code.
- key: operator_typography_web_ascii_terminal
  name: proper typography in copy and docs, ASCII in the terminal
  description: Operator decision 2026-11-06 - ASCII_PUNCTUATION is withdrawn; ASCII only in terminal output
  type: feedback
  body: |-
    ASCII marks (a hyphen, three dots, straight quotes, ->) belong to the CLI,
    the shell and REPL prompt, the terminal face and dmesg or log lines; that
    was the ban's only purpose. Web copy, locale files, views, Markdown and TeX
    documents, root documents and BPLANS use proper typography: the ellipsis
    (U+2026), an en dash (U+2013) in a numeric range (EN_DASH_RANGE), curly
    quotes, and for an aside a spaced en dash, "word - aside - word" set with
    U+2013. Norwegian copy quotes with guillemets (U+00AB, U+00BB) and single
    curly quotes inside; English keeps curly double quotes. EN_DASH_RANGE and
    TYPOGRAPHIC_EXCELLENCE skip Law::TERMINAL_OUTPUT_PATH (law/definition.rb)
    and printing lines; PARENTHETICAL_DASH and QUOTES_BY_LOCALE
    (law/typesetting.rb) hold the aside and the quotes. The face glyph ramp
    stays as it is. Text written before 2026-11-05 keeps its original marks.
- key: operator_read_the_manual_before_editing
  name: read the governing manual before editing RAILS or OPENBSD
  description: Operator directive 2026-11-06 - agents read the current Rails guides, and OpenBSD's man pages, before they edit
  type: feedback
  body: |-
    Before editing anything under RAILS/ (or MASTER/web), an agent has read the
    latest Rails style guide (rubocop's rails-style-guide) and the current Rails
    edge guides (edgeguides.rubyonrails.org) for every API the change touches,
    because the apps run on Rails edge. Before editing anything under OPENBSD/,
    an agent has read man(1) for every tool, daemon or configuration file the
    change touches (for example relayd.conf(5), rcctl(8), pf.conf(5), doas.conf(5),
    newsyslog(8)), on the box or at man.openbsd.org for the running release. A
    change whose commit cannot name the guide section or man page it followed
    is not ready.
