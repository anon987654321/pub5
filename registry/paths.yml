# Top-level ownership plus the narrow set of production-data and secret paths
# that remain protected from automated writes. Trusted main-tier work is
# otherwise governed by bin/check and the gatekeeper.
owners:
  core: { owner: kernel, purpose: "World verbs, capability checker, registry loader, atomic write, ledger, HTTP/LLM client, knobs, parse gate" }
  laws: { owner: laws, purpose: "The Law engine and one file per Law" }
  registry: { owner: registry, purpose: "One registry per concern, each with a schema" }
  master: { owner: master, purpose: "Agent runtime as plugins, each with manifest.yml" }
  rails: { owner: rails, purpose: "Shared engine, brgen and its engines, amber, bsdports, mrdamascy" }
  openbsd: { owner: openbsd, purpose: "rc.d, relayd, pf, deploy, rehearse; generated from registry/apps.yml" }
  studio: { owner: studio, purpose: "dilla, postpro, replicate" }
  bplans: { owner: bplans, purpose: "Business plans" }
  test: { owner: kernel, purpose: "Tests for core, laws and registries" }
  bin: { owner: kernel, purpose: "check, setup, generate" }
  tools: { owner: kernel, purpose: "Generators and one-off ports" }
protected:
  - "**/config/credentials*"
  - "**/config/credentials/**"
  - "**/config/master.key"
  - "**/config/environments/production.rb"
  - "**/.env*"
  - "**/db/migrate/**"
  - "**/db/schema.rb"
  - log/ledger.jsonl
ported:
  "laws/pub4/**/*": { from: [pub4 MASTER/law, MASTER/data/laws.yml, MASTER/checks, MASTER/lib/operator/ratchets.rb], by: port-laws }
  registry/laws.yml: { from: [pub4 MASTER/data/laws.yml, MASTER/data/project_context.yml], by: port-laws }
generated:
  AGENTS.md: { from: [registry/writers.yml, registry/laws.yml], by: generate }
  CLAUDE.md: { from: [], by: generate }
