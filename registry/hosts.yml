schema: 1
hosts:
  vm23:
    operating_system: OpenBSD
    release: 7.8
    role: production
    cpus: 1
    ram_mb: 1024
    network_interface: vio0
    services: [master, brgen, amber, bsdports, mrdamascy]
    secrets_location: /etc
    deployment_status: BLOCKED
    required_observations: [release_and_kernel, cpu_and_load, memory_and_swap, disk, service_health, public_routes_and_tls, off_host_backup, restore_drill]
    evidence_status: NOT_RUN
    cutover_allowed: false
