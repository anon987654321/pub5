type: object
required: [owners, protected, generated]
additional: false
properties:
  owners:
    type: object
    additional:
      type: object
      required: [owner, purpose]
      additional: false
      properties:
        owner: { type: string }
        purpose: { type: string }
  protected:
    type: array
    min_items: 1
    items: { type: string }
  generated:
    type: object
    additional:
      type: object
      required: [from, by]
      additional: false
      properties:
        from: { type: array, items: { type: string } }
        by: { type: string }
