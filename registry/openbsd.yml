      - kind: comment
        line: "# a lock that does not describe what is installed here."
      - kind: comment
        line: "# rc.d cannot source the repo, so pick whichever Ruby the package manager"
      - kind: comment
        line: "# installed (OpenBSD ships it by version; none is named here)."
      - kind: code
        line: for _bundle in /usr/local/bin/bundle4.0 /usr/local/bin/bundle40 /usr/local/bin/bundle3.4
          /usr/local/bin/bundle34 /usr/local/bin/bundle3.3 /usr/local/bin/bundle33
          /usr/local/bin/bundle; do
      - kind: code
        line: '  if [ -x "$_bundle" ]; then break; fi'
      - kind: code
        line: done
      - kind: code
        line: for _ruby in /usr/local/bin/ruby4.0 /usr/local/bin/ruby40 /usr/local/bin/ruby3.4
          /usr/local/bin/ruby34 /usr/local/bin/ruby3.3 /usr/local/bin/ruby33 /usr/local/bin/ruby;
          do
      - kind: code
        line: '  if [ -x "$_ruby" ]; then break; fi'
      - kind: code
        line: done
      - kind: code
        line: daemon_flags="-c 'cd /home/dev/pub4/MASTER/web && set -a && . /etc/master.env
          && set +a && export PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8
          RAILS_ENV=production CACHE_VERSION=${CACHE_VERSION} SECRET_KEY_BASE_DUMMY=1
          BUNDLE_FROZEN=true && export BUNDLE_VERSION=system && exec ${_bundle} exec
          falcon serve -n ${FALCON_WORKERS:-1} --health-check-timeout 300 --bind http://127.0.0.1:${PORT}'"
      - kind: comment
        line: "# Prod safety flags (MASTER_SAFE_MODE etc.) live in /etc/master.env
