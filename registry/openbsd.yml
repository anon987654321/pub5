      - kind: code
        line: CACHE_VERSION="${CACHE_VERSION:-v2}"
      - kind: code
        line: daemon="/bin/ksh"
      - kind: comment
        line: "# Falcon workers: keep at 1 on 1GB VPS so amber/bsdports can boot alongside
