      - kind: code
        line: '  pkill -f "ruby[0-9.]*.*${PORT}" 2>/dev/null || true'
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  PORT_OWNER=brgen"
      - kind: code
        line: "  free_port || { rm -f /home/dev/pub4/.deploying-brgen 2>/dev/null;
          return 1; }"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: code
        line: rc_cmd $1
      - kind: code
        line: rc=$?
      - kind: code
        line: if [[ "$1" = "start" ]] || [[ "$1" = "restart" ]]; then
      - kind: code
        line: '  if [[ "$rc" = "0" ]]; then'
      - kind: code
        line: "    # relayd can keep routing to the old (now-dead) backend connection
