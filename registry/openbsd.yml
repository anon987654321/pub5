      - kind: comment
        line: '# daemon_user="master" reached the box, and the stack trace named File.utime'
      - kind: comment
        line: "# rather than anything about permissions or users."
      - kind: comment
        line: "#"
      - kind: comment
        line: "# Frozen makes the daemon a reader. It also turns the repo's structural
