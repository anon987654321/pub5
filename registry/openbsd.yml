      - kind: code
        line: "  for _p in $(port_holders); do"
      - kind: code
        line: '    kill "-$1" "$_p" 2>/dev/null'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
