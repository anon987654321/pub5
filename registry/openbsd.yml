        line: '    if [[ "$_ping_ok" = "0" ]]; then'
      - kind: code
        line: '      logger -t master "container warmup: face page not ready after
          120 tries"'
      - kind: code
        line: "    fi"
      - kind: code
        line: "    # Warm TTS with MASTER Gemfile only — never inherit Falcon web/vendor/bundle
          env."
      - kind: code
        line: "    _tts_warm_ok=0"
      - kind: code
        line: '    if su -m dev -c ''export HOME=/home/dev; unset BUNDLE_PATH GEM_HOME
          GEM_PATH BUNDLE_BIN_PATH BUNDLE_WITHOUT BUNDLE_DEPLOYMENT RUBYOPT; cd /home/dev/pub4/MASTER
          && BUNDLE_GEMFILE=/home/dev/pub4/MASTER/Gemfile MASTER_TTS_TIMEOUT=45 ''"$_bundle"''
          exec ruby -Ilib -e "require \"master\"; exit(Master::Voice::TtsSupervisor.ensure_daemon!
          ? 0 : 1)"'' 2>>/var/log/daemon; then'
      - kind: code
        line: "      _l=0"
      - kind: code
        line: '      while [[ "$_l" -lt 30 ]]; do'
      - kind: code
        line: "        [[ -S /home/dev/pub4/MASTER/.master/tts-0.sock ]] && { _tts_warm_ok=1;
          break; }"
      - kind: code
        line: "        sleep 1"
      - kind: code
        line: "        _l=$((_l + 1))"
      - kind: code
        line: "      done"
      - kind: code
        line: "    fi"
      - kind: code
        line: '    if [[ "$_tts_warm_ok" = "0" ]]; then'
      - kind: code
        line: '      logger -t master "CRITICAL: TTS sockets missing after ensure_daemon
          (check .master/tts-worker-*.log)"'
      - kind: code
        line: "    fi"
      - kind: code
        line: '    "$_ruby" /home/dev/pub4/MASTER/web/script/probe_http 2>/dev/null
          || logger -t master "probe_http failed after restart"'
      - kind: code
        line: "  fi"
      - kind: code
        line: fi
      - kind: comment
        line: "# rc_pre touched the deploy flag; it comes off here, after the /up,
          ping and TTS"
      - kind: comment
        line: "# warmup, so bundle, the Falcon bind and the cold boot are all inside
          the window"
      - kind: comment
        line: "# resource_guard reads it for."
      - kind: code
        line: if [[ "$1" = "start" ]] || [[ "$1" = "restart" ]]; then
      - kind: code
        line: "  rm -f /home/dev/pub4/.deploying 2>/dev/null || true"
      - kind: code
        line: fi
      - kind: code
        line: exit "$rc"
    mrdamascy:
      shape: puma
      rows:
      - kind: comment
        line: "#!/bin/ksh"
      - kind: comment
        line: "# mrdamascy — the Mr. Damascy ordering PWA, served as the mrd.brgen.no
          demo."
      - kind: comment
        line: "# One Puma process (single mode, no cluster), three threads, nothing
          else resident:"
      - kind: comment
        line: "# the app enqueues no jobs, so there is no mrdamascy_jobs and no Solid
          Queue"
      - kind: comment
        line: "# supervisor in this process. Vipps, Stripe and Wolt run in their mock
          modes"
      - kind: comment
        line: '# (each client is mock unless its *_MOCK variable is "0"), so no payment
          key is'
      - kind: comment
        line: '# needed or read. To take the demo down see OPENBSD/RUNBOOK.md, "Mr.
          Damascy demo".'
      - kind: comment
        line: "#"
      - kind: comment
        line: "# Same PATH reason as rc.d/bsdports: rc_pre and the post-start block
          run curl"
      - kind: comment
        line: "# from /usr/local/bin, which root cron does not have."
      - kind: code
        line: export PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      - kind: code
        line: PORT=47314
      - kind: code
        line: APP_DIR=/home/mrdamascy/app
      - kind: comment
        line: "# /etc/mrdamascy.env (root:mrdamascy 640) holds SECRET_KEY_BASE; pub4-admin"
      - kind: comment
        line: "# ensure-secret writes it on the first deploy. It is sourced inside
          the exec by"
      - kind: comment
        line: "# the app user, never interpolated into daemon_flags, so the secret
          stays out"
      - kind: comment
        line: "# of ps argv."
      - kind: code
        line: "[[ -r /etc/mrdamascy.env ]] && . /etc/mrdamascy.env"
      - kind: code
        line: ': "${SECRET_KEY_BASE:?missing SECRET_KEY_BASE in /etc/mrdamascy.env}"'
      - kind: code
        line: daemon="/bin/ksh"
      - kind: code
        line: for _bundle in /usr/local/bin/bundle4.0 /usr/local/bin/bundle40 /usr/local/bin/bundle3.4
          \
      - kind: code
        line: "    /usr/local/bin/bundle34 /usr/local/bin/bundle3.3 /usr/local/bin/bundle33
          /usr/local/bin/bundle; do"
      - kind: code
        line: "  if [[ -x $_bundle ]]; then break; fi"
      - kind: code
        line: done
      - kind: comment
        line: "# The -b bind replaces the one config/puma.rb takes from PORT, so the
          listener is"
      - kind: comment
        line: "# loopback only and relayd is the one public door. RAILS_MAX_THREADS
          sizes both"
      - kind: comment
        line: "# Puma and the SQLite pool. WEB_CONCURRENCY=0, not 1: Puma 8 reads
          it as its"
      - kind: comment
        line: "# worker count, and 1 starts a cluster parent plus one worker, two
          processes."
      - kind: code
        line: _env="RUBY_YJIT_ENABLE=0 RAILS_ENV=production HOME=/home/mrdamascy PORT=${PORT}
          WEB_CONCURRENCY=0"
      - kind: code
        line: _env="${_env} RAILS_MAX_THREADS=3 RAILS_MIN_THREADS=1 MRDAMASCY_HOST=mrd.brgen.no
          BUNDLE_VERSION=system"
      - kind: code
        line: _exec="exec ${_bundle} exec puma -b tcp://127.0.0.1:${PORT}"
      - kind: code
        line: daemon_flags="-c 'cd ${APP_DIR} && set -a && . /etc/mrdamascy.env &&
          set +a && export ${_env} && ${_exec}'"
      - kind: code
        line: daemon_user="mrdamascy"
      - kind: code
        line: daemon_execdir="/home/mrdamascy/app"
      - kind: code
        line: daemon_logger="daemon.notice"
      - kind: code
        line: daemon_timeout="120"
      - kind: code
        line: ". /etc/rc.d/rc.subr"
      - kind: comment
        line: "# rc.subr matches pexp with pgrep -xf, the whole argv, which reads"
      - kind: comment
        line: '# "ruby34 .../bundle34 exec puma -b ..." while booting and Puma''s
          retitled'
      - kind: comment
        line: '# "ruby34: puma 8.x (tcp://127.0.0.1:47314) [app]" after; both end
          past the port.'
      - kind: code
        line: pexp="ruby[0-9.]*.*puma.*${PORT}.*"
      - kind: code
        line: rc_bg=YES
      - kind: code
        line: rc_reload=NO
      - kind: blank
        line: ''
      - kind: comment
        line: "# port holders: begin"
      - kind: comment
        line: "# The pkills match falcon by its argv, so a process bound to the port
          under any"
      - kind: comment
        line: "# other name (a worker that retitled itself, a hand-started server,
          a test run)"
      - kind: comment
        line: "# survives them, the next falcon dies on EADDRINUSE, and rc reports
          a start that"
      - kind: comment
        line: "# never serves. fstat(1) names every process with a socket on the port
          whatever"
      - kind: comment
        line: "# its argv. Its socket lines read USER CMD PID FD internet stream tcp
          ADDR"
      - kind: comment
        line: "# LOCAL [ARROW PEER]; a listener is the line with no peer, which leaves
          relayd's"
      - kind: comment
        line: "# connections to the port and the app's accepted ones alone."
      - kind: code
        line: port_holders() {
      - kind: code
        line: "  fstat 2>/dev/null | while read -r _u _c _pid _fd _kind _type _proto
          _addr _local _rest; do"
      - kind: code
        line: "    [[ $_kind == internet || $_kind == internet6 ]] || continue"
      - kind: code
        line: "    [[ $_proto == tcp && -z $_rest ]] || continue"
      - kind: code
        line: '    [[ $_local == *:"$PORT" ]] && print -n -- "$_pid "'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: comment
        line: "# Sends signal $1 to every holder, one pid at a time."
      - kind: code
        line: signal_holders() {
      - kind: code
        line: "  for _p in $(port_holders); do"
      - kind: code
        line: '    kill "-$1" "$_p" 2>/dev/null'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: comment
        line: "# TERM whatever still holds the port, KILL it after the grace period,
          and fail"
      - kind: comment
        line: "# when the port is still held, so the start is refused with the reason
          logged."
      - kind: code
        line: free_port() {
      - kind: code
        line: "  _holders=$(port_holders)"
      - kind: code
        line: "  [[ -n $_holders ]] || return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "stale :${PORT} holder(s) ${_holders% } before
          start, TERM"'
      - kind: code
        line: "  signal_holders TERM"
      - kind: code
        line: "  _w=0"
      - kind: code
        line: "  while [[ -n $(port_holders) ]] && (( _w < ${PORT_GRACE:-20} )); do"
      - kind: code
        line: "    sleep 1"
      - kind: code
        line: "    _w=$((_w + 1))"
      - kind: code
        line: "  done"
      - kind: code
        line: "  _holders=$(port_holders)"
      - kind: code
        line: "  [[ -n $_holders ]] || return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "stale :${PORT} holder(s) ${_holders% } survived
          TERM, KILL"'
      - kind: code
        line: "  signal_holders KILL"
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  [[ -z $(port_holders) ]] && return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "CRITICAL: :${PORT} still held after TERM
          and KILL, refusing to start"'
      - kind: code
        line: "  return 1"
      - kind: code
        line: "}"
      - kind: comment
        line: "# port holders: end"
      - kind: blank
        line: ''
      - kind: code
        line: rc_pre() {
      - kind: code
        line: "  touch /home/dev/pub4/.deploying-mrdamascy 2>/dev/null || true"
      - kind: code
        line: '  pkill -f "puma.*${PORT}" 2>/dev/null || true'
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  PORT_OWNER=mrdamascy"
      - kind: code
        line: "  free_port || { rm -f /home/dev/pub4/.deploying-mrdamascy 2>/dev/null;
          return 1; }"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: code
        line: rc_cmd $1
      - kind: code
        line: rc=$?
      - kind: code
        line: if [[ "$1" = "start" ]] || [[ "$1" = "restart" ]]; then
      - kind: code
        line: '  if [[ "$rc" = "0" ]]; then'
      - kind: code
        line: "    # relayd can keep routing to the old (now-dead) backend connection
          after a"
      - kind: code
        line: "    # restart until it's kicked — same fix already used by MASTER's
          rc.d script."
      - kind: code
        line: "    _i=0"
      - kind: code
        line: "    _up_ok=0"
      - kind: code
        line: '    while [[ "$_i" -lt 300 ]]; do'
      - kind: code
        line: '      curl -fsS -m 5 "http://127.0.0.1:${PORT}/up" >/dev/null 2>&1
          && { _up_ok=1; break; }'
      - kind: code
        line: "      sleep 1"
      - kind: code
        line: "      _i=$((_i + 1))"
      - kind: code
        line: "    done"
      - kind: code
        line: '    if [[ "$_up_ok" = "1" ]]; then'
      - kind: code
        line: "      rcctl restart relayd 2>/dev/null || true"
      - kind: code
        line: "    else"
      - kind: code
        line: '      logger -t mrdamascy "relayd skipped: /up not ready after restart"'
      - kind: code
        line: "    fi"
      - kind: code
        line: "  fi"
      - kind: code
        line: fi
      - kind: comment
        line: "# rc_pre touched the deploy flag; it comes off here, after the /up
          wait, so the"
      - kind: comment
        line: "# cold boot is inside the window resource_guard reads it for."
      - kind: code
        line: if [[ "$1" = "start" ]] || [[ "$1" = "restart" ]]; then
      - kind: code
        line: "  rm -f /home/dev/pub4/.deploying-mrdamascy 2>/dev/null || true"
      - kind: code
        line: fi
      - kind: code
        line: exit $rc
