      - kind: code
        line: daemon_logger="daemon.notice"
      - kind: code
        line: daemon_timeout="300"
      - kind: code
        line: ". /etc/rc.d/rc.subr"
      - kind: code
        line: pexp="ruby[0-9.]*.*${PORT}"
      - kind: code
        line: rc_bg=YES
      - kind: code
        line: rc_reload=NO
      - kind: blank
        line: ''
      - kind: comment
        line: "# --- stop path: tolerate a process that is already gone, then prove
          the port is free ---"
      - kind: comment
        line: "#"
      - kind: comment
        line: "# `rcctl restart master` once printed `kill: 87387: No such process`.
