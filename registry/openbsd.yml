          && export BUNDLE_VERSION=system && exec ${_bundle} exec ruby bin/irc-gateway'"
      - kind: code
        line: daemon_user="brgen"
      - kind: code
        line: daemon_execdir="/home/brgen/app"
      - kind: code
        line: daemon_logger="daemon.notice"
      - kind: blank
        line: ''
      - kind: code
        line: ". /etc/rc.d/rc.subr"
      - kind: blank
        line: ''
      - kind: code
        line: pexp=".*ruby[0-9.]*.*bin/irc-gateway.*"
      - kind: code
        line: rc_bg=YES
      - kind: code
        line: rc_reload=NO
      - kind: blank
        line: ''
      - kind: code
        line: rc_cmd $1
    master:
      shape: master
      rows:
      - kind: comment
        line: "#!/bin/ksh"
      - kind: comment
        line: "# rc_pre and the post-start block below run bundle, ruby and curl —
