      - kind: comment
        line: "# header before enabling it, because vm23 has 1 GB."
      - kind: comment
        line: "# rc.d cannot source the repo, so pick whichever bundler the package
          manager"
      - kind: comment
        line: "# installed (OpenBSD ships Ruby by version; none is named here)."
      - kind: code
        line: for _bundle in /usr/local/bin/bundle4.0 /usr/local/bin/bundle40 /usr/local/bin/bundle3.4
          /usr/local/bin/bundle34 /usr/local/bin/bundle3.3 /usr/local/bin/bundle33
          /usr/local/bin/bundle; do
      - kind: code
        line: '  if [ -x "$_bundle" ]; then break; fi'
      - kind: code
        line: done
      - kind: code
        line: daemon_flags="-c 'cd ${APP_DIR} && set -a && . /etc/bsdports.env &&
          set +a && export RUBY_YJIT_ENABLE=0 RAILS_ENV=production HOME=/home/bsdports
          && export BUNDLE_VERSION=system && exec ${_bundle} exec falcon serve -n
          ${FALCON_WORKERS:-1} --health-check-timeout 300 --bind http://127.0.0.1:${PORT}'"
      - kind: code
        line: daemon_user="bsdports"
      - kind: code
        line: daemon_execdir="/home/bsdports/app"
      - kind: code
        line: daemon_logger="daemon.notice"
      - kind: code
        line: daemon_timeout="120"
      - kind: code
        line: ". /etc/rc.d/rc.subr"
      - kind: code
        line: pexp="ruby[0-9.]*.*${PORT}"
      - kind: code
        line: rc_bg=YES
      - kind: code
        line: rc_reload=NO
      - kind: blank
        line: ''
      - kind: comment
        line: "# port holders: begin"
      - kind: comment
        line: "# The pkills match falcon by its argv, so a process bound to the port
          under any"
      - kind: comment
        line: "# other name (a worker that retitled itself, a hand-started server,
          a test run)"
      - kind: comment
        line: "# survives them, the next falcon dies on EADDRINUSE, and rc reports
          a start that"
      - kind: comment
        line: "# never serves. fstat(1) names every process with a socket on the port
          whatever"
      - kind: comment
        line: "# its argv. Its socket lines read USER CMD PID FD internet stream tcp
          ADDR"
      - kind: comment
        line: "# LOCAL [ARROW PEER]; a listener is the line with no peer, which leaves
          relayd's"
      - kind: comment
        line: "# connections to the port and the app's accepted ones alone."
      - kind: code
        line: port_holders() {
      - kind: code
        line: "  fstat 2>/dev/null | while read -r _u _c _pid _fd _kind _type _proto
          _addr _local _rest; do"
      - kind: code
        line: "    [[ $_kind == internet || $_kind == internet6 ]] || continue"
      - kind: code
        line: "    [[ $_proto == tcp && -z $_rest ]] || continue"
      - kind: code
        line: '    [[ $_local == *:"$PORT" ]] && print -n -- "$_pid "'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: comment
        line: "# Sends signal $1 to every holder, one pid at a time."
      - kind: code
        line: signal_holders() {
      - kind: code
        line: "  for _p in $(port_holders); do"
      - kind: code
        line: '    kill "-$1" "$_p" 2>/dev/null'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: comment
        line: "# TERM whatever still holds the port, KILL it after the grace period,
          and fail"
      - kind: comment
        line: "# when the port is still held, so the start is refused with the reason
          logged."
      - kind: code
        line: free_port() {
      - kind: code
        line: "  _holders=$(port_holders)"
      - kind: code
        line: "  [[ -n $_holders ]] || return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "stale :${PORT} holder(s) ${_holders% } before
          start, TERM"'
      - kind: code
        line: "  signal_holders TERM"
      - kind: code
        line: "  _w=0"
      - kind: code
        line: "  while [[ -n $(port_holders) ]] && (( _w < ${PORT_GRACE:-20} )); do"
      - kind: code
        line: "    sleep 1"
      - kind: code
        line: "    _w=$((_w + 1))"
      - kind: code
        line: "  done"
      - kind: code
        line: "  _holders=$(port_holders)"
      - kind: code
        line: "  [[ -n $_holders ]] || return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "stale :${PORT} holder(s) ${_holders% } survived
          TERM, KILL"'
      - kind: code
        line: "  signal_holders KILL"
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  [[ -z $(port_holders) ]] && return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "CRITICAL: :${PORT} still held after TERM
          and KILL, refusing to start"'
      - kind: code
        line: "  return 1"
      - kind: code
        line: "}"
      - kind: comment
        line: "# port holders: end"
      - kind: blank
        line: ''
      - kind: code
        line: rc_pre() {
      - kind: code
        line: "  touch /home/dev/pub4/.deploying-bsdports 2>/dev/null || true"
      - kind: code
        line: '  pkill -f "falcon.*${PORT}" 2>/dev/null || true'
      - kind: code
        line: '  pkill -f "ruby[0-9.]*.*${PORT}" 2>/dev/null || true'
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  PORT_OWNER=bsdports"
      - kind: code
        line: "  free_port || { rm -f /home/dev/pub4/.deploying-bsdports 2>/dev/null;
          return 1; }"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: code
        line: rc_cmd $1
      - kind: code
        line: rc=$?
      - kind: code
        line: if [[ "$1" = "start" ]] || [[ "$1" = "restart" ]]; then
      - kind: code
        line: '  if [[ "$rc" = "0" ]]; then'
      - kind: code
        line: "    # relayd can keep routing to the old (now-dead) backend connection
          after a"
      - kind: code
        line: "    # restart until it's kicked — same fix already used by MASTER's
          rc.d script."
      - kind: code
        line: "    _i=0"
      - kind: code
        line: "    _up_ok=0"
      - kind: code
        line: '    while [[ "$_i" -lt 300 ]]; do'
      - kind: code
        line: '      curl -fsS -m 5 "http://127.0.0.1:${PORT}/up" >/dev/null 2>&1
          && { _up_ok=1; break; }'
      - kind: code
        line: "      sleep 1"
      - kind: code
        line: "      _i=$((_i + 1))"
      - kind: code
        line: "    done"
      - kind: code
        line: '    if [[ "$_up_ok" = "1" ]]; then'
      - kind: code
        line: "      rcctl restart relayd 2>/dev/null || true"
      - kind: code
        line: "    else"
      - kind: code
        line: '      logger -t bsdports "relayd skipped: /up not ready after restart"'
      - kind: code
        line: "    fi"
      - kind: code
        line: "  fi"
      - kind: code
        line: fi
      - kind: comment
        line: "# rc_pre touched the deploy flag; it comes off here, after the /up
          wait, so the"
      - kind: comment
        line: "# cold boot is inside the window resource_guard reads it for."
      - kind: code
        line: if [ "$1" = "start" ] || [ "$1" = "restart" ]; then
      - kind: code
        line: "  rm -f /home/dev/pub4/.deploying-bsdports 2>/dev/null || true"
      - kind: code
        line: fi
      - kind: code
        line: exit $rc
    bsdports_jobs:
      shape: jobs
      rows:
      - kind: comment
        line: "#!/bin/ksh"
      - kind: comment
        line: "# Solid Queue worker for bsdports. NOT enabled by default: vm23 is
          1 GB, and a"
      - kind: comment
        line: "# worker is another resident Ruby process with the whole app loaded
          in it."
      - kind: comment
        line: "#"
      - kind: comment
        line: "# Falcon runs no Solid Queue supervisor, so a worker is its own service,
          one"
      - kind: comment
        line: "# rc.d file per app. Without one, drain-jobs.sh runs the queue for
          a few"
      - kind: comment
        line: "# minutes each hour. To enable one:"
      - kind: comment
        line: "#"
      - kind: comment
        line: "#   doas rcctl enable APP_jobs && doas rcctl start APP_jobs"
      - kind: comment
        line: "#   sqlite3 -readonly /home/APP/app/storage/production_queue.sqlite3
          'select count(*) from solid_queue_processes;'"
      - kind: comment
        line: "#"
      - kind: comment
        line: "# A registered process is the only proof it took. Add the service to"
      - kind: comment
        line: "# pkg_scripts in etc/rc.conf.local in the same change, because boot
          reads that"
      - kind: comment
        line: "# line. health_check.rb fails when a queue has due work and no registered
          process."
      - kind: code
        line: export PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      - kind: code
        line: APP_DIR=/home/bsdports/app
      - kind: comment
        line: "# /etc/bsdports.env is the one env file: daemon_flags sources nothing
          else."
      - kind: code
        line: "[[ -r /etc/bsdports.env ]] && . /etc/bsdports.env"
      - kind: code
        line: ': "${SECRET_KEY_BASE:?missing SECRET_KEY_BASE in /etc/bsdports.env}"'
      - kind: blank
        line: ''
      - kind: code
        line: daemon="/bin/ksh"
      - kind: comment
        line: "# Sourced inside the app user's shell rather than interpolated here,
          where the"
      - kind: comment
        line: "# secret would sit in ps(1) argv; under set -a because `.` sets a bare"
      - kind: comment
        line: "# KEY=value unexported, and the job classes need every key in the file."
      - kind: comment
        line: "# rc.d cannot source the repo, so pick whichever bundler the package
          manager"
      - kind: comment
        line: "# installed (OpenBSD ships Ruby by version; none is named here)."
      - kind: code
        line: for _bundle in /usr/local/bin/bundle4.0 /usr/local/bin/bundle40 /usr/local/bin/bundle3.4
          /usr/local/bin/bundle34 /usr/local/bin/bundle3.3 /usr/local/bin/bundle33
          /usr/local/bin/bundle; do
      - kind: code
        line: '  if [ -x "$_bundle" ]; then break; fi'
      - kind: code
        line: done
      - kind: comment
        line: "# SOLID_QUEUE_SUPERVISOR_MODE=async runs the dispatcher and workers
          as threads"
      - kind: comment
        line: "# in one process, not four forked ones. vm23 has 1 GB: with the five
          web apps up,"
      - kind: comment
        line: "# the three forked supervisors took swap to zero on 2026-11-05. Solid
          Queue"
      - kind: comment
        line: "# 1.4.0 reads the variable; 1.2.4 ignores it and forks as before."
      - kind: code
        line: daemon_flags="-c 'cd ${APP_DIR} && set -a && . /etc/bsdports.env &&
          set +a && export RAILS_ENV=production SOLID_QUEUE_SUPERVISOR_MODE=async
          HOME=/home/bsdports PUB4_ROOT=/home/dev/pub4 PUB4_RAILS_ROOT=/home/dev/pub4/RAILS
          && export BUNDLE_VERSION=system && exec ${_bundle} exec rake solid_queue:start'"
      - kind: code
        line: daemon_user="bsdports"
      - kind: code
        line: daemon_execdir="/home/bsdports/app"
      - kind: code
        line: daemon_logger="daemon.notice"
      - kind: code
        line: daemon_timeout="120"
      - kind: blank
        line: ''
      - kind: code
        line: ". /etc/rc.d/rc.subr"
      - kind: comment
        line: '# The process renames itself to "ruby<version>: solid-queue-supervisor(1.2.4):
          ...",'
      - kind: comment
        line: '# hence both - and _. rc.subr checks with `pgrep -q -xf "${pexp}"`,
          and -x'
      - kind: comment
        line: "# anchors the whole argv, which continues past the name: the trailing
          .* is"
      - kind: comment
        line: "# what lets rcctl check and stop see a running worker at all."
      - kind: code
        line: pexp="ruby[0-9.]*.*solid[-_]queue.*"
      - kind: code
        line: rc_bg=YES
      - kind: code
        line: rc_reload=NO
      - kind: blank
        line: ''
      - kind: code
        line: rc_cmd $1
    irc_gateway:
      shape: irc
