---
schema: 1
concern: openbsd
note: 'The OPENBSD serving policy: relayd and pf generated from these rows, byte-checked
  against openbsd/proven/*.conf. Each entry''s notes are the proven config''s own
  comments, moved verbatim.'
relayd:
  prelude:
  - log connection errors
  - interval 120
  - timeout 90000
  tables:
  - brgen
  - amber
  - master
  - bsdports
  - mrdamascy
  protocol:
    header: http protocol "https_proxy" {
    entries:
    - kind: keypair
      line: tls keypair "brgen.no"
      notes: []
    - kind: keypair
      line: tls keypair "ai.brgen.no"
      notes:
      - "# ai.brgen.no is a SAN on the brgen.no certificate, so its .crt and .key
        are"
      - "# symlinks to it. relayd loads /etc/ssl/name.crt and /etc/ssl/private/name.key"
      - "# per keypair and matches by SNI; a name with no files here is not served,"
      - "# whatever the certificate covers."
    - kind: keypair
      line: tls keypair "amberapp.art"
      notes:
      - "# amberapp.art is amber's one name, and nothing else routes to <amber>."
    - kind: keypair
      line: tls keypair "bsdports.org"
      notes: []
    - kind: keypair
      line: tls keypair "mrd.brgen.no"
      notes:
      - "# mrd.brgen.no: the Mr. Damascy demo, a brgen.no SAN symlinked like ai.brgen.no."
    - kind: keypair
      line: tls keypair "oshlo.no"
      notes:
      - "# A city apex needs a keypair here and nothing else: there is no Host match
        for"
      - "# oshlo.no below, and it does not need one -- unmatched hosts fall through
        the"
      - "# final `pass` to the relay's first backend, which is <brgen>. So this list
        is"
      - '# the whole answer to "which city domains are live", which is what'
      - "# Brgen::DomainRegistry::LIVE_DOMAINS has to agree with and what"
      - "# domain_alignment now compares it against. This line was live on vm23 from
        the"
      - "# day oshlo.no got its certificate and missing here until 2026-08-12, so
        the"
      - "# repo said one city was live and the box served two."
      - "#"
      - "# Only live cities belong here. The ones holding a zone and waiting on"
      - '# delegation are listed in RUNBOOK.md, "Bringing a city domain up", and are
        the'
      - "# difference between render_dns.rb's ALL_DOMAINS and these lines, so a typed"
      - "# list of them here is one more place for the names to disagree."
    - kind: keypair
      line: tls keypair "stvanger.no"
      notes:
      - "# Five cities that had a valid certificate on disk and no line here."
      - "#"
      - "# acme-client had been issuing for stvanger.no, trndheim.no, cardff.uk,"
      - "# edinbrgh.uk and frankfrt.de for months — the certificates were in /etc/ssl,"
      - "# renewed, and covering ten names apiece. All five resolve to this box. The"
      - "# only thing between them and serving was a keypair line, so from outside
        they"
      - "# looked like the 33 domains that are NXDOMAIN and are not: they completed
        the"
      - "# TCP connection on 443 and then refused the handshake, which a browser reports"
      - "# as a security failure rather than as a domain that does not exist."
    - kind: keypair
      line: tls keypair "trndheim.no"
      notes: []
    - kind: keypair
      line: tls keypair "cardff.uk"
      notes: []
    - kind: keypair
      line: tls keypair "edinbrgh.uk"
      notes: []
    - kind: keypair
      line: tls keypair "frankfrt.de"
      notes: []
    - kind: match
      line: match request header set "X-Forwarded-Proto" value "https"
      notes: []
    - kind: match
      line: match request header set "X-Forwarded-For" value "$REMOTE_ADDR"
      notes: []
    - kind: match
      line: match response header set "Strict-Transport-Security" value "max-age=31536000;
        includeSubDomains; preload"
      notes: []
    - kind: match
      line: match response header set "Referrer-Policy" value "strict-origin"
      notes: []
    - kind: match
      line: match response header set "X-Content-Type-Options" value "nosniff"
      notes: []
    - kind: match
      line: match response header set "X-XSS-Protection" value "0"
      notes: []
    - kind: match
      line: match response header set "Permissions-Policy" value "accelerometer=(self),
        browsing-topics=(), camera=(), geolocation=(self), gyroscope=(self), microphone=(self),
        payment=(), usb=()"
      notes:
      - "# One header for every backend, and `set` overwrites whatever the app sent
        --"
      - "# so this line is the only Permissions-Policy any browser ever sees. It has
        to"
      - "# be the union of what each backend needs, not one app's view:"
      - "#   microphone/gyroscope/accelerometer=(self) -- MASTER's face (voice mode)."
      - "#   geolocation=(self) -- brgen's nearby chat room and the dating radius."
      - "# geolocation was () here while RAILS/__shared/config/initializers/"
      - "# security_headers.rb set (self) and explained why. relayd won, so"
      - "# navigator.geolocation was blocked on every brgen page: #nearby could never"
      - "# open and the corner chat silently fell back to the #brgen lobby forever."
      - "# (self) is not a grant -- the browser still prompts the visitor."
      - "# browsing-topics=() -- no page asks for ad topics, so embeds get none."
    - kind: match
      line: match response header remove "X-Frame-Options"
      notes: []
    - kind: match
      line: match response header remove "Server"
      notes: []
    - kind: directive
      line: http websockets
      notes: []
    - kind: match
      line: match request header "Host" value "brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "www.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "tv.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "dating.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "radio.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "takeaway.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "markedsplass.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "maps.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "messenger.brgen.no" forward to <brgen>
      notes: []
    - kind: match
      line: match request header "Host" value "amberapp.art" forward to <amber>
      notes: []
    - kind: match
      line: match request header "Host" value "www.amberapp.art" forward to <amber>
      notes: []
    - kind: match
      line: match request header "Host" value "ai.brgen.no" forward to <master>
      notes: []
    - kind: match
      line: match request header "Host" value "bsdports.org" forward to <bsdports>
      notes: []
    - kind: match
      line: match request header "Host" value "mrd.brgen.no" forward to <mrdamascy>
      notes: []
    - kind: directive
      line: pass
      notes: []
  relay:
    header: relay "https_in" {
    notes:
    - "# ——— Static brand exports (RAILS/__other) — RETIRED 2026-10-28 ———"
    - "# Sommerseth Eiendom (thor.brgen.no) and Alfa Bergen (alfa.brgen.no) were"
    - "# retired with RAILS/__other. The httpd vhosts, relayd tables, SAN keypairs,"
    - "# forward matches, DNS A records and vps-deploy-static were removed with them;"
    - "# the design decisions they carried live on in MASTER/law/brand.rb and"
    - "# docs/visual/bergen_brand_systems.md."
    inner_notes:
    - "# The listen backlog stays at relayd.conf(5)'s default of 10. Apps take 30–40"
    - "# seconds to boot cold behind it and restarts show delay, not refusals; a longer"
    - "# queue does not make a booting app answer sooner. Raise it (up to 512 and"
    - "# kern.somaxconn) the day a restart shows refused connections."
    listen: listen on 0.0.0.0 port 443 tls
    protocol: protocol "https_proxy"
    forwards:
    - app: brgen
      port: 38182
      path: "/up"
      code: 200
    - app: amber
      port: 61352
      path: "/up"
      code: 200
    - app: master
      port: 53187
      path: "/up"
      code: 200
    - app: bsdports
      port: 47312
      path: "/up"
      code: 200
    - app: mrdamascy
      port: 47314
      path: "/up"
      code: 200
pf:
  vars:
    ext_if:
      value: vio0
      notes: []
      raw:
      - ext_if = "vio0"
    brgen_ip:
      value: 46.23.89.226
      notes: []
      raw:
      - brgen_ip = "46.23.89.226"
    hyp_ip:
      value: 194.63.248.53
      notes: []
      raw:
      - hyp_ip = "194.63.248.53"
  rules:
  - kind: blank
  - kind: table
    line: table <bruteforce> persist
    notes: []
    raw:
    - table <bruteforce> persist
  - kind: blank
  - kind: rule
    line: set skip on lo
    notes: []
    raw:
    - set skip on lo
  - kind: rule
    line: set block-policy drop
    notes: []
    raw:
    - set block-policy drop
  - kind: blank
  - kind: rule
    line: match in all scrub (no-df random-id max-mss 1440)
    notes: []
    raw:
    - match in all scrub (no-df random-id max-mss 1440)
  - kind: blank
  - kind: rule
    line: antispoof quick for $ext_if
    notes: []
    raw:
    - antispoof quick for $ext_if
  - kind: blank
  - kind: rule
    line: block log all
    notes:
    - "# Public ingress is the pass rules below: ssh, DNS, HTTP, HTTPS and SMTP. App
      ports"
    - "# stay on loopback behind relayd, so a daemon listening on any other port is"
    - "# unreachable from outside and needs no listener audit; health_check.rb reads
      the"
    - "# loaded rules for this block on every run."
    raw:
    - block log all
  - kind: blank
  - kind: rule
    line: pass in quick on $ext_if inet proto tcp to $brgen_ip port 22 keep state
    notes:
    - "# SSH: always pass, before bruteforce block — dev reconnects must never be
      locked out."
    raw:
    - pass in quick on $ext_if inet proto tcp to $brgen_ip port 22 keep state
  - kind: blank
  - kind: rule
    line: block quick from <bruteforce>
    notes:
    - "# Bruteforce table blocks HTTP/HTTPS abusers; SSH is exempt (rule above takes
      quick precedence)."
    raw:
    - block quick from <bruteforce>
  - kind: blank
  - kind: rule
    line: pass out on $ext_if all keep state
    notes: []
    raw:
    - pass out on $ext_if all keep state
  - kind: blank
  - kind: rule
    line: pass in on $ext_if inet proto { tcp, udp } to $brgen_ip port 53 keep state
    notes:
    - "# DNS (authoritative NSD)"
    raw:
    - pass in on $ext_if inet proto { tcp, udp } to $brgen_ip port 53 keep state
  - kind: rule
    line: pass in on $ext_if inet proto udp to $hyp_ip port 53 keep state
    notes: []
    raw:
    - pass in on $ext_if inet proto udp to $hyp_ip port 53 keep state
  - kind: blank
  - kind: rule
    line: pass in on $ext_if inet proto tcp to $brgen_ip port 80 keep state (max-src-conn-rate
      200/10, overload <bruteforce> flush global)
    notes:
    - "# HTTP/HTTPS: rate-limit new connections"
    raw:
    - pass in on $ext_if inet proto tcp to $brgen_ip port 80 \
    - "  keep state (max-src-conn-rate 200/10, overload <bruteforce> flush global)"
  - kind: rule
    line: pass in on $ext_if inet proto tcp to $brgen_ip port 443 keep state (max-src-conn-rate
      500/10, overload <bruteforce> flush global)
    notes: []
    raw:
    - pass in on $ext_if inet proto tcp to $brgen_ip port 443 \
    - "  keep state (max-src-conn-rate 500/10, overload <bruteforce> flush global)"
  - kind: blank
  - kind: rule
    line: pass inet proto icmp all icmp-type { echoreq, unreach, timex }
    notes: []
    raw:
    - pass inet proto icmp all icmp-type { echoreq, unreach, timex }
  - kind: blank
  - kind: rule
    line: anchor "relayd/*"
    notes: []
    raw:
    - anchor "relayd/*"
  - kind: blank
  - kind: rule
    line: pass in on $ext_if inet proto tcp to $brgen_ip port 25 keep state (max-src-conn-rate
      100/10, overload <bruteforce> flush global)
    notes:
    - "# SMTP: the MX for brgen.no points here, and until now every delivery attempt"
    - "# hit the default block, so the record advertised a port nothing could reach."
    - "# Rate-limited like HTTP; port 25 attracts the same brute force and"
    - "# <bruteforce> is already the shared table."
    raw:
    - pass in on $ext_if inet proto tcp to $brgen_ip port 25 keep state (max-src-conn-rate
      100/10, overload <bruteforce> flush global)
rc:
  note: 'rc.d scripts moved row for row (comments included). The renderer checks:
    bytes against proven, serving facts against the app registry ports, and one shared
    tokenized code skeleton per shape - the scripts are generated, not maintained,
    in four copies.'
  scripts:
    amber:
      shape: falcon
      rows:
      - kind: comment
        line: "#!/bin/ksh"
      - kind: comment
        line: "# rc_pre and the post-start block run curl (a package, /usr/local/bin/curl)."
      - kind: comment
        line: "# rcctl inherits its caller PATH and root cron has no /usr/local/bin,
          so from"
      - kind: comment
        line: "# a cron restart the /up wait always timed out and the relayd restart
          behind"
      - kind: comment
        line: "# it was skipped — the app came up with an empty relayd backend table.
          Same"
      - kind: comment
        line: "# gap that refused to start master outright (see rc.d/master)."
      - kind: code
        line: export PATH=/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      - kind: code
        line: PORT=61352
      - kind: code
        line: APP_DIR=/home/amber/app
      - kind: comment
        line: "# /etc/amber.env is the one env file: daemon_flags sources nothing
          else, so a"
      - kind: comment
        line: "# key anywhere else never reaches the app."
      - kind: code
        line: "[[ -r /etc/amber.env ]] && . /etc/amber.env"
      - kind: code
        line: ': "${SECRET_KEY_BASE:?missing SECRET_KEY_BASE in /etc/amber.env}"'
      - kind: code
        line: daemon="/bin/ksh"
      - kind: comment
        line: "# --health-check-timeout: Falcon defaults to 30s, and on 1 vCPU with
          master and"
      - kind: comment
        line: "# brgen already resident this app has never booted that fast — the
          container"
      - kind: comment
        line: "# declared startup failed and SIGKILLed its own worker on every restart,
          which"
      - kind: comment
        line: '# is a large part of why this service kept reading as "shed but never'
      - kind: comment
        line: '# restored". master and brgen have carried 300 since the same discovery.'
      - kind: comment
        line: "# SECRET_KEY_BASE is sourced from /etc/amber.env at runtime by the
          app user and"
      - kind: comment
        line: "# re-exported (the file holds a bare KEY=value, which `.` sets un-exported)
          —"
      - kind: comment
        line: "# NOT interpolated into daemon_flags, where it landed in falcon's ps(1)
          argv for"
      - kind: comment
        line: "# any local account to read (secrets in process argv). The env file
          is"
      - kind: comment
        line: "# root:amber 640, so only amber and root can read it (not dev-via-wheel,
          not"
      - kind: comment
        line: "# another app user). Proven on bsdports first."
      - kind: comment
        line: "# SOLID_QUEUE_IN_PUMA=true was here and is gone. In-Puma mode is a
          Puma plugin;"
      - kind: comment
        line: "# this app runs under Falcon and has no config/puma.rb, so no plugin
          ever loaded"
      - kind: comment
        line: "# and the variable was read by nothing. It was the only thing that
          looked like a"
      - kind: comment
        line: "# job worker and it had never started one — 1670 jobs enqueued on brgen
          and 0"
      - kind: comment
        line: "# finished, measured 2026-08-12. rc.d/<app>_jobs is the real worker;
          read its"
      - kind: comment
        line: "# header before enabling it, because vm23 has 1 GB."
      - kind: comment
        line: "# rc.d cannot source the repo, so pick whichever bundler the package
          manager"
      - kind: comment
        line: "# installed (OpenBSD ships Ruby by version; none is named here)."
      - kind: code
        line: for _bundle in /usr/local/bin/bundle4.0 /usr/local/bin/bundle40 /usr/local/bin/bundle3.4
          /usr/local/bin/bundle34 /usr/local/bin/bundle3.3 /usr/local/bin/bundle33
          /usr/local/bin/bundle; do
      - kind: code
        line: '  if [ -x "$_bundle" ]; then break; fi'
      - kind: code
        line: done
      - kind: code
        line: daemon_flags="-c 'cd ${APP_DIR} && set -a && . /etc/amber.env && set
          +a && export RUBY_YJIT_ENABLE=0 RAILS_ENV=production HOME=/home/amber &&
          export BUNDLE_VERSION=system && exec ${_bundle} exec falcon serve -n ${FALCON_WORKERS:-1}
          --health-check-timeout 300 --bind http://127.0.0.1:${PORT}'"
      - kind: code
        line: daemon_user="amber"
      - kind: code
        line: daemon_execdir="/home/amber/app"
      - kind: code
        line: daemon_logger="daemon.notice"
      - kind: code
        line: daemon_timeout="120"
      - kind: code
        line: ". /etc/rc.d/rc.subr"
      - kind: code
        line: pexp="ruby[0-9.]*.*${PORT}"
      - kind: code
        line: rc_bg=YES
      - kind: code
        line: rc_reload=NO
      - kind: blank
        line: ''
      - kind: comment
        line: "# port holders: begin"
      - kind: comment
        line: "# The pkills match falcon by its argv, so a process bound to the port
          under any"
      - kind: comment
        line: "# other name (a worker that retitled itself, a hand-started server,
          a test run)"
      - kind: comment
        line: "# survives them, the next falcon dies on EADDRINUSE, and rc reports
          a start that"
      - kind: comment
        line: "# never serves. fstat(1) names every process with a socket on the port
          whatever"
      - kind: comment
        line: "# its argv. Its socket lines read USER CMD PID FD internet stream tcp
          ADDR"
      - kind: comment
        line: "# LOCAL [ARROW PEER]; a listener is the line with no peer, which leaves
          relayd's"
      - kind: comment
        line: "# connections to the port and the app's accepted ones alone."
      - kind: code
        line: port_holders() {
      - kind: code
        line: "  fstat 2>/dev/null | while read -r _u _c _pid _fd _kind _type _proto
          _addr _local _rest; do"
      - kind: code
        line: "    [[ $_kind == internet || $_kind == internet6 ]] || continue"
      - kind: code
        line: "    [[ $_proto == tcp && -z $_rest ]] || continue"
      - kind: code
        line: '    [[ $_local == *:"$PORT" ]] && print -n -- "$_pid "'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: comment
        line: "# Sends signal $1 to every holder, one pid at a time."
      - kind: code
        line: signal_holders() {
      - kind: code
        line: "  for _p in $(port_holders); do"
      - kind: code
        line: '    kill "-$1" "$_p" 2>/dev/null'
      - kind: code
        line: "  done"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: comment
        line: "# TERM whatever still holds the port, KILL it after the grace period,
          and fail"
      - kind: comment
        line: "# when the port is still held, so the start is refused with the reason
          logged."
      - kind: code
        line: free_port() {
      - kind: code
        line: "  _holders=$(port_holders)"
      - kind: code
        line: "  [[ -n $_holders ]] || return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "stale :${PORT} holder(s) ${_holders% } before
          start, TERM"'
      - kind: code
        line: "  signal_holders TERM"
      - kind: code
        line: "  _w=0"
      - kind: code
        line: "  while [[ -n $(port_holders) ]] && (( _w < ${PORT_GRACE:-20} )); do"
      - kind: code
        line: "    sleep 1"
      - kind: code
        line: "    _w=$((_w + 1))"
      - kind: code
        line: "  done"
      - kind: code
        line: "  _holders=$(port_holders)"
      - kind: code
        line: "  [[ -n $_holders ]] || return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "stale :${PORT} holder(s) ${_holders% } survived
          TERM, KILL"'
      - kind: code
        line: "  signal_holders KILL"
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  [[ -z $(port_holders) ]] && return 0"
      - kind: code
        line: '  logger -t "$PORT_OWNER" "CRITICAL: :${PORT} still held after TERM
          and KILL, refusing to start"'
      - kind: code
        line: "  return 1"
      - kind: code
        line: "}"
      - kind: comment
        line: "# port holders: end"
      - kind: blank
        line: ''
      - kind: code
        line: rc_pre() {
      - kind: code
        line: "  touch /home/dev/pub4/.deploying-amber 2>/dev/null || true"
      - kind: code
        line: '  pkill -f "falcon.*${PORT}" 2>/dev/null || true'
      - kind: code
        line: '  pkill -f "ruby[0-9.]*.*${PORT}" 2>/dev/null || true'
      - kind: code
        line: "  sleep 1"
      - kind: code
        line: "  PORT_OWNER=amber"
      - kind: code
        line: "  free_port || { rm -f /home/dev/pub4/.deploying-amber 2>/dev/null;
          return 1; }"
      - kind: code
        line: "}"
      - kind: blank
        line: ''
      - kind: code
        line: rc_cmd $1
      - kind: code
        line: rc=$?
      - kind: code
        line: if [[ "$1" = "start" ]] || [[ "$1" = "restart" ]]; then
      - kind: code
        line: '  if [[ "$rc" = "0" ]]; then'
      - kind: code
        line: "    # relayd can keep routing to the old (now-dead) backend connection
          after a"
      - kind: code
        line: "    # restart until it's kicked — same fix already used by MASTER's
          rc.d script."
      - kind: code
        line: "    _i=0"
      - kind: code
        line: "    _up_ok=0"
      - kind: code
        line: '    while [[ "$_i" -lt 300 ]]; do'
      - kind: code
        line: '      curl -fsS -m 5 "http://127.0.0.1:${PORT}/up" >/dev/null 2>&1
          && { _up_ok=1; break; }'
      - kind: code
        line: "      sleep 1"
      - kind: code
        line: "      _i=$((_i + 1))"
      - kind: code
        line: "    done"
      - kind: code
        line: '    if [[ "$_up_ok" = "1" ]]; then'
      - kind: code
        line: "      rcctl restart relayd 2>/dev/null || true"
      - kind: code
        line: "    else"
      - kind: code
        line: '      logger -t amber "relayd skipped: /up not ready after restart"'
      - kind: code
        line: "    fi"
      - kind: code
        line: "  fi"
      - kind: code
        line: fi
      - kind: comment
        line: "# rc_pre touched the deploy flag; it comes off here, after the /up
          wait, so the"
      - kind: comment
        line: "# cold boot is inside the window resource_guard reads it for."
      - kind: code
        line: if [ "$1" = "start" ] || [ "$1" = "restart" ]; then
      - kind: code
        line: "  rm -f /home/dev/pub4/.deploying-amber 2>/dev/null || true"
      - kind: code
        line: fi
      - kind: code
        line: exit $rc
    amber_jobs:
      shape: jobs
      rows:
      - kind: comment
        line: "#!/bin/ksh"
      - kind: comment
        line: "# Solid Queue worker for amber. NOT enabled by default: vm23 is 1 GB,
          and a"
      - kind: comment
