      - kind: code
        line: "      sleep 1"
      - kind: code
        line: "      _i=$((_i + 1))"
      - kind: code
        line: "    done"
      - kind: code
        line: '    if [[ "$_up_ok" = "1" ]]; then'
      - kind: code
        line: "      rcctl restart relayd 2>/dev/null || true"
      - kind: code
        line: "    else"
      - kind: code
        line: '      logger -t brgen "relayd skipped: /up not ready after restart"'
      - kind: code
        line: "    fi"
      - kind: code
        line: "  fi"
      - kind: code
        line: fi
      - kind: comment
        line: "# rc_pre touched the deploy flag; it comes off here, after the /up
          wait, so the"
      - kind: comment
        line: "# cold boot is inside the window resource_guard reads it for."
      - kind: code
        line: if [ "$1" = "start" ] || [ "$1" = "restart" ]; then
      - kind: code
        line: "  rm -f /home/dev/pub4/.deploying-brgen 2>/dev/null || true"
      - kind: code
        line: fi
      - kind: code
        line: exit $rc
