schema: 1
description: Only declared runtime controls; plugins may not read undeclared ENV values.
knobs:
  scan:
    max_files: { type: integer, default: 5000, min: 1, max: 20000 }
    max_seconds: { type: integer, default: 60, min: 1, max: 300 }
  writer:
    max_files_per_repair: { type: integer, default: 20, min: 1, max: 20 }
    require_independent_review: { type: boolean, default: true }
  lanes:
    handshake_seconds: { type: integer, default: 30, min: 1, max: 900 }
    read_idle_seconds: { type: integer, default: 60, min: 1, max: 900 }
    retry_ladder_seconds: { type: array, default: [30, 60, 300, 900] }
  ledger:
    max_event_bytes: { type: integer, default: 16384, min: 256, max: 65536 }
