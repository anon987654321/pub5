        const row = rows[i];
        const prevRow = i > 0 ? rows[i - 1] : null;
        const center = centers[i];
        // Mouse parallax or gentle recenter (stable easing)
        if (mouseActive) {
          center.x = ((w / 2) - mouseX) * ((row[0].z - FOV) / 500) + w / 2;
          center.y = ((h / 2) - mouseY) * ((row[0].z - FOV) / 500) + h / 2;
        } else {
          center.x += ((w / 2) - center.x) * 0.015;
          center.y += ((h / 2) - center.y) * 0.015;
        }
        // Three-color gradient for this ring
        const depth = i / R;
        const [cr, cg, cb] = colorFor(depth, audio.average || 0);
        const ca = WIRE_ALPHA;
        for (let j = 0, k = row.length; j < k; j++) {
          const p = row[j];
          // Parametric ring radius
          const theta = p.idx * (TAU / p.segs) + time * twist;
          const rShape = ringShapeFn(theta, i, p, audio) || 0;
          p.radius = BASE_RADIUS + rShape;
          p.radiusAudio = p.radius + (audio ? (audio.average * 6) : 0);
          const rx = Math.cos(theta) * p.radiusAudio;
          const ry = Math.sin(theta) * p.radiusAudio;
          // Projection
          const scaleRaw = FOV / (FOV + p.z);
          const scale = Math.max(0.001, Math.min(10, scaleRaw));
          p.x2d = (rx * scale) + center.x;
          p.y2d = (ry * scale) + center.y;
          // Motion with smooth wrap
          if (mouseDown) { p.z += SPEED; if (p.z > FOV) { p.z -= (FOV * 2); sortNeeded = true; } }
          else { p.z -= SPEED; if (p.z < -FOV) { p.z += (FOV * 2); sortNeeded = true; } }
          // Connect along ring (wrap)
          const prevIdx = (j - 1 + k) % k;
          const prev = row[prevIdx];
          drawLine(p.x2d, p.y2d, prev.x2d, prev.y2d, cr, cg, cb, ca);
          // Connect to previous row at cadence
          if (prevRow && (i % diagEvery === 0)) {
            const prevInPrev = prevRow[prevIdx];
            drawLine(p.x2d, p.y2d, prevInPrev.x2d, prevInPrev.y2d, cr, cg, cb, ca);
          }
        }
      }
      if (sortNeeded) {
        // Pair rows with centers to avoid micro-glitches after sort
        const pairs = rows.map((row, idx) => ({ row, center: centers[idx] }));
        pairs.sort((a, b) => b.row[0].z - a.row[0].z);
        rows = pairs.map(p => p.row);
        centers = pairs.map(p => p.center);
      }
      time += mouseDown ? -0.005 : 0.005;
    }
    // ------------------ Input + app wiring ------------------
    const overlay = document.getElementById("overlay");
    const audio = new AudioEngine();
    // Prevent overlay click leaking to canvas
    overlay.addEventListener("mousedown", (e) => { e.stopPropagation(); e.preventDefault(); }, { capture: true });
    overlay.addEventListener("click", (e) => { e.stopPropagation(); e.preventDefault(); startApp(); });
    overlay.addEventListener("keydown", (e) => { if (e.code === "Enter" || e.code === "Space") { e.preventDefault(); startApp(); } });
    // Canvas mouse
    canvas.addEventListener("mousedown", () => { mouseDown = true; });
    canvas.addEventListener("mouseup", () => { mouseDown = false; });
    canvas.addEventListener("mouseenter",() => { mouseActive = true; });
    canvas.addEventListener("mouseleave",() => { mouseActive = false; mouseDown = false; mouseX = w/2; mouseY = h/2; });
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      lastMouseX = mouseX; lastMouseY = mouseY;
      mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
    }, { passive: true });
    // Mobile sensors for parallax
    let orientationActive = false;
    let alpha = 0, beta = 0, gamma = 0;
    if (window.DeviceOrientationEvent) {
      window.addEventListener("deviceorientation", (e) => {
        alpha = e.alpha || 0; beta = e.beta || 0; gamma = e.gamma || 0;
        orientationActive = true;
      }, { passive: true });
    }
    // Keys
    addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); if (audio.started) audio.next(); return; }
      if (e.key?.toLowerCase() === "m") { e.preventDefault(); if (audio.started) audio.toggleMute(); return; }
      if (e.code === "ArrowRight") { e.preventDefault(); currentMode = (currentMode + 1) % Modes.length; UI.text(audio.trackLabel() + " • " + modeLabel()); return; }
      if (e.code === "ArrowLeft") { e.preventDefault(); currentMode = (currentMode - 1 + Modes.length) % Modes.length; UI.text(audio.trackLabel() + " • " + modeLabel()); return; }
    });
    function startApp() {
      if (!audio.started) {
        audio.start();
        UI.text(audio.trackLabel() + " • " + modeLabel());
        overlay.hidden = true;
      }
    }
    // Main loop
    let lastTs = performance.now();
    function animate(ts) {
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      fadeImageData(0.85); // subtle trails for transparency
      const a = audio.data();
      const m = Modes[currentMode];
      const mouseDx = mouseX - lastMouseX, mouseDy = mouseY - lastMouseY;
      // Mobile parallax override
      if (orientationActive) {
        mouseX = w / 2 + gamma * (w / 90);
        mouseY = h / 2 + beta * (h / 90);
        mouseActive = true;
      }
      projectAndAdvance(a, m.ring, m.diagEvery, m.twist, dt, mouseDx, mouseDy);
      ctx.putImageData(imageData, 0, 0);
      requestAnimationFrame(animate);
    }
    // Boot
    function boot() { resize(); initField(); UI.text("Ready · click to start • " + modeLabel()); requestAnimationFrame(animate); }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
    else boot();
  </script>
</body>
</html>
