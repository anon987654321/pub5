# Registered standing reds, one entry per file the suite may legitimately
# leave red. The runner fails a red file that has no entry here, and fails
# an entry whose file is green: the ledger holds exactly the debt the tree
# has accepted, no more and no less. Entries without envs: apply in every
# environment; a stripped checkout marks its environment-only reds with
# envs: [sandbox] and runs with PUB5_SUITE_ENV=sandbox. PUB5_LEDGER=off
# escapes for an exploratory run. A red registered here is still red —
# register it, then fix it; the reason line is the work order.
# Purged 2026-11-16 to the tree's own law: green files leave the ledger.
# One row remains: the operator-identity check a stripped sandbox cannot run.
---
test/integrity_locale_test.rb:
  reason: "the integrity chain runs OPENBSD/checks/verify_deploy_identity.rb, which verifies the operator deploy identity; a stripped sandbox holds none, so the chain exits on deploy_identity fail before the locale assertion can pass. Green where the operator identity exists."
  registered: "2026-11-16"
  envs: [sandbox]
