# Operator privilege policy for vm23.
#
# dev is the operator account and belongs to wheel. The tracked policy therefore
# follows the host's normal OpenBSD administration group rather than naming one
# login account. Keep the environment allowlist narrow: keepenv on this rule
# would carry RUBYOPT/RUBYLIB/BUNDLE_* across the root boundary.
#
# OPERATOR.sh installs this file only through validate_doas.ksh, which verifies
# both the dev -> root path and the explicitly allowed operator variables and
# restores the previous file if either check fails. Never install it by cron.
#
# Review the live policy on vm23 after a deliberate apply:
#   doas -C /etc/doas.conf id
#   I_UNDERSTAND_DNS_WIPE=1 doas printenv I_UNDERSTAND_DNS_WIPE
#
# The root -> root rule is retained for existing nested deployment entrypoints.
# It does not grant dev additional authority; dev already reaches root via wheel.
# It should be narrowed only after every nested call is removed and verified.
permit nopass setenv { I_UNDERSTAND_DNS_WIPE I_UNDERSTAND_CONSOLE_RISK I_UNDERSTAND_FAST_DEPLOY RUN_PRODUCTION_SEEDS SKIP_MASTER_SCAN MAIL_IMG_FMT } :wheel as root

permit nopass keepenv root as root
