# httpd(8): HTTP-01 challenge files for acme-client(1), and a 301 to HTTPS for
# everything else. TLS and every application request are served by relayd(8)
# on port 443. The redirect is what the HSTS preload list requires of a host
# listening on port 80 (brgen.no, operator decision 2026-11-26); httpd serves
# no content of its own.

server "*" {
  listen on 0.0.0.0 port 80

  location "/.well-known/acme-challenge/*" {
    root "/acme"
    request strip 2
  }

  location * {
    block return 301 "https://$HTTP_HOST$REQUEST_URI"
  }
}
