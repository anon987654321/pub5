schema: 1
# Prompt ingredients are intentionally explicit. Keep each look distinct and
# photographic; never add an effect merely because it sounds cinematic.
looks:
  natural_selfie:
    camera: "modern phone main camera, approximately 26-30 mm full-frame equivalent, held at a realistic arm's length; preserve natural perspective and avoid exaggerated near-camera facial proportions"
    framing: "vertical 4:5 or 3:4 environmental selfie, slightly imperfect hand-held framing, eye-level or just above eye-level, eyes in crisp focus, background legible but secondary"
    lighting: "motivated available light; soft open-sky or window key, subtle ambient fill, retain natural shadow shape and a small catchlight; do not flatten the face"
    color: "neutral daylight white balance, restrained saturation, accurate skin hue, gentle highlight shoulder, natural separation between warm skin and cool ambient shadows"
    finish: "credible contemporary phone photograph with fine detail, mild sensor texture, natural skin pores and realistic local contrast; no artificial skin smoothing"
    vfx: "all reflections, background perspective, depth of field and contact shadows must agree with the camera position; no invented elements or compositing seams"
    avoid: "ultra-wide face stretch, oversharpening, computational portrait cutout, fake bokeh, beauty filter, orange-and-teal cliché, clipped forehead highlights"
  window_light_portrait:
    camera: "50 mm full-frame equivalent spherical prime, camera at eye height, natural subject distance, moderate depth of field"
    framing: "intimate chest-up portrait with deliberate negative space, three-quarter face angle, eyes sharply resolved and ears falling gently outside the focus plane"
    lighting: "large soft window as a directional key at roughly 45 degrees; negative fill on the far side, restrained white bounce near camera, optional subtle background separation"
    color: "quiet neutral balance with a slight daylight warmth, skin remains believable, cool shadow detail retained, highlights roll off smoothly"
    finish: "fine-grained editorial still, restrained micro-contrast, authentic skin texture, no visible retouching"
    vfx: "window reflections, shadow direction and background falloff remain physically consistent; no edge halos or pasted-on subject"
    avoid: "ring-light catchlights, flat frontal fill, crushed shadows, porcelain skin, excessive clarity, fake lens flare"
  overcast_nordic_candid:
    camera: "40 mm full-frame equivalent spherical lens, documentary camera distance, natural perspective and moderate depth of field"
    framing: "unposed environmental portrait with breathing room, a moment between actions, natural asymmetry and an unobtrusive background"
    lighting: "soft overcast sky as a broad key, subtle negative fill from the shadow side, reflected ground light, preserve the shape of the face"
    color: "cool-neutral ambient palette with warm but accurate skin, soft highlight contrast, nuanced greens and restrained blues"
    finish: "documentary realism, delicate fine grain, slightly imperfect hand-held timing, natural tonal variation"
    vfx: "atmospheric depth and wet-surface reflections follow the real environment; keep hair edges and background integration natural"
    avoid: "teal shadows, orange skin, fake fog, HDR halos, excessive desaturation, artificially perfect symmetry"
  golden_hour_35mm:
    camera: "35 mm full-frame equivalent spherical prime, subject at a natural conversational distance, realistic perspective"
    framing: "medium close portrait with environmental context, late-afternoon sun just outside frame, readable eyes and controlled highlights"
    lighting: "low warm sun as a motivated back or three-quarter key, soft sky fill on the face, negative fill where needed, subtle bounce only to recover essential detail"
    color: "warm highlights without turning skin orange, cooler open-shade shadows, gentle contrast, distinct but harmonious color separation"
    finish: "35 mm color-negative-inspired rendering, fine organic grain, restrained highlight bloom only around true bright sources"
    vfx: "flare only if the light source and lens angle justify it; believable hair translucency, contact shadows and atmospheric perspective"
    avoid: "uniform golden filter, clipped sun, heavy orange-teal grade, giant anamorphic streaks, fake dust or light leaks"
  night_practicals_500t:
    camera: "40 mm full-frame equivalent fast spherical prime, around f/1.8 to f/2.8 look, natural camera-to-subject distance"
    framing: "hand-held night portrait with a motivated practical light visible or implied, face readable without making the night look like daylight"
    lighting: "tungsten or warm practical key, controlled cool ambient fill, preserve dark negative space; add only enough soft fill to keep facial identity readable"
    color: "VISION3 500T-inspired tungsten balance, warm practicals, controlled mixed-color shadows, protected highlights and believable skin under mixed sources"
    finish: "subtle fine-to-medium motion-picture negative grain, organic highlight halation around bright practicals only, gentle contrast"
    vfx: "reflections and flare geometry follow actual practical sources; maintain plausible exposure, depth and shadow continuity"
    avoid: "blue-everything night, neon oversaturation, fake bloom on all highlights, lifted grey blacks, excessive noise, smeared eyes"
  studio_editorial:
    camera: "85 mm full-frame equivalent portrait lens, camera at eye height and enough distance for natural perspective, moderate depth of field"
    framing: "considered head-and-shoulders composition, precise eye focus, clean background separation and deliberate negative space"
    lighting: "large soft key slightly above and to one side, negative fill opposite, controlled low-level bounce, optional restrained rim or background light"
    color: "neutral reference-balanced skin, controlled saturation, smooth highlight shoulder and deliberate but subtle background hue"
    finish: "high-end editorial clarity without plastic retouching; preserve pores, fine hair and natural facial asymmetry"
    vfx: "seamless backdrop, believable hair detail and contact shadow; no artificial edge sharpening or background blur cutout"
    avoid: "flat beauty dish look, excessive skin blur, eye enlargement, facial reshaping, over-whitened teeth, synthetic catchlights"
  daylight_250d_negative:
    camera: "50 mm full-frame equivalent spherical lens, classic still-photo portrait distance, natural perspective"
    framing: "candid 35 mm film still with environmental context, balanced highlights and readable shadow detail"
    lighting: "daylight-balanced soft key, controlled negative fill and gentle ambient bounce; expose skin naturally while retaining bright sky detail"
    color: "Kodak VISION3 250D-inspired daylight-negative palette, nuanced skin tones, calm greens, dense but not crushed blacks, graceful highlight latitude"
    finish: "fine, restrained film grain with organic structure, soft highlight shoulder and no uniform digital noise overlay"
    vfx: "optical softness and halation only where motivated by bright sources; grain scale remains consistent with image resolution"
    avoid: "one-click vintage filter, faded blacks by default, fake scratches, light leaks, heavy vignette, oversaturated reds"
  tungsten_500t_negative:
    camera: "40 mm full-frame equivalent spherical lens, documentary subject distance, moderate depth of field"
    framing: "low-light motion-picture still with a motivated practical source and layered foreground, subject and background"
    lighting: "tungsten-balanced key with controlled mixed ambient sources, negative fill to preserve shape, a measured bounce for eye detail"
    color: "Kodak VISION3 500T-inspired tungsten-negative palette, believable warm interiors, restrained cool ambient contrast, stable skin hue"
    finish: "organic fine-to-medium grain, restrained highlight halation, natural contrast and a soft but not milky toe"
    vfx: "practical-light bloom is local and intensity-dependent; reflections and shadows remain consistent with the set"
    avoid: "global orange cast, generic teal-orange grade, random gate weave on a still, fake scratches, crushed faces"
  monochrome_double_x:
    camera: "50 mm full-frame equivalent classic spherical prime, considered portrait distance"
    framing: "expressive black-and-white documentary portrait, strong but readable tonal separation and precise eye focus"
    lighting: "directional window or hard daylight key, negative fill, subtle bounce only where essential; preserve sculptural shadow shape"
    color: "monochrome tonal translation with rich blacks, distinct midtone texture, protected highlights and no channel clipping"
    finish: "Eastman Double-X-inspired monochrome grain, natural silver-rich texture, controlled local contrast"
    vfx: "grain density follows image tone; no simulated damage unless explicitly requested"
    avoid: "flat grey conversion, crushed facial shadows, clipped forehead highlights, faux scratches, digital edge halos"
  soft_diffusion:
    camera: "65 mm full-frame equivalent portrait lens at a natural distance, eyes on the critical focus plane"
    framing: "close editorial portrait with soft background separation and preserved facial geometry"
    lighting: "soft directional key and negative fill, small controlled highlights, no frontal beauty wash"
    color: "clean skin color with gentle warmth, controlled saturation and delicate highlight separation"
    finish: "very subtle black diffusion character, restrained bright-source halation, eyes and eyelashes remain crisp while fine skin contrast is gently softened"
    vfx: "optical diffusion is even and physically plausible; do not add digital blur to the face or cutout edges"
    avoid: "strong bloom, fogged contrast, blurred eyes, waxy skin, excessive glow, heavy-handed beauty retouch"
