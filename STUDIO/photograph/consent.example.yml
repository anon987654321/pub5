# Likeness consent record. Copy to STUDIO/lora/<subject>/consent.yml, which
# .gitignore keeps private, then fill in every field.
#
# This is an operator attestation, not proof that source rights exist.
# Dataset preparation, training and provider processing stay blocked until
# each field is filled and the named evidence exists as a local record.
schema: 1
subject: REPLACE_WITH_SUBJECT_SLUG

subject_consent:
  likeness_generation: false
  provider_processing: false

# Who granted what. A page being reachable is not permission to train on it.
source_rights:
  generation_use: false
  provider_processing: false
  # One entry per source set: who granted it, when, scope, and evidence path.
  # stored_at is relative to this subject directory. Evidence files must be
  # owner-only (0600); nested evidence directories must be owner-only (0700).
  # No component of an evidence path may be a symlink.
  evidence: {}
  # me2_archive:
  #   granted_by: "..."
  #   granted_on: "YYYY-MM-DD"
  #   covers: "generation_use, provider_processing"
  #   stored_at: "..."
