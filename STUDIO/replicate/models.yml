# STUDIO/replicate/models.yml
#
# What Replicate can do, refit from its public catalogue (github.com/replicate/
# all-the-public-replicate-models and the /v1/collections API) so STUDIO can
# choose a current model rather than the one it happened to learn first.
#
# The image catalogue rows were refit from Replicate on 2026-11-13. The new
# MiniMax H3 Lite and H3 Highspeed video entries were verified on 2026-11-17.
# Image-model run counts are a popularity hint, not a quality claim.
#
# `likeness` is the field that matters for a selfie of a real person:
#   reference  the model takes the subject's own photographs as input and keeps
#              the face from them — no training run, and the strongest likeness
#              route Replicate offers now.
#   lora       the model runs a trained LoRA (what STUDIO/lora trains).
#   text       the prompt alone; a likeness has to be described, so it drifts.
#
# Studio::Replicate::Models.load reads this; `--engine` on photograph.rb selects
# from it. Keep this list to models worth reaching for, not every row Replicate
# has ever published.

verified_on: "2026-11-24"
# The 2026-11-14 rows (the fofr/kontext edits, the levelsio film looks and
# the kontext trainer) carry their schema as read from each model's own
# Replicate page: the declared inputs plus the pinned API example.

# The engine the pipeline reaches for first, and the order it falls back
# through when one fails. The primary is the strongest current likeness model;
# the chain ends in Replicate's free tier, so a render never dies for want of
# credit. "$subject_lora" is the subject's own trained model (lora/<subject>),
# the one engine that is about this person rather than people in general.
default_engine: google/nano-banana-2.1
fallback_chain:
  - google/nano-banana-pro
  - bytedance/seedream-5-pro
  - minimax/image-01
  - bytedance/seedream-5-lite
  - black-forest-labs/flux-kontext-max
  - bytedance/seedream-4.5
  - black-forest-labs/flux-2-max
  - black-forest-labs/flux-2-flex
  - black-forest-labs/flux-2-pro
  - black-forest-labs/flux-2-klein-9b
  - black-forest-labs/flux-2-klein-4b
  - "$subject_lora"
  - black-forest-labs/flux-dev
  - black-forest-labs/flux-schnell

# Free to run on Replicate (its "try for free" tier). A fallback, never the
# first choice: they do not keep a likeness, but they keep a series alive. Only
# the two that render from a prompt alone are in the chain; flux-kontext-pro is
# free too but needs an input_image, so it belongs to image_to_image, not here.
free_models:
  - black-forest-labs/flux-dev
  - black-forest-labs/flux-schnell

# Still photographs of a person. The selfie pipeline picks from here.
text_to_image:
  google/nano-banana-2.1:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, resolution, output_format]
    note: "Current Google reference-image model; accepts up to 14 images and 1K/2K/4K output. Use 2K for face review; 1K for economical drafts."
  google/nano-banana-pro:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, output_format, resolution]
    note: "Google's premium reference model. $0.035, $0.15 or $0.30 per image by output resolution, so 1K drafts and 2K finals. Strongest face retention; use it when the likeness matters more than the price."
  bytedance/seedream-5-pro:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, output_format]
    note: "Seedream's pro tier: $0.0225, $0.045 or $0.09 per image by resolution. Holds a reference face and a plausible lens."
  minimax/image-01:
    likeness: reference
    inputs: [prompt, aspect_ratio, number_of_images, prompt_optimizer, subject_reference]
    note: "Single-face subject_reference input; current schema lists $0.01 per output image. Provider README says inputs are sent to MiniMax, so use only with approved provider-processing consent."
  bytedance/seedream-5-lite:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, size, max_images, output_format, sequential_image_generation]
    note: "Current ByteDance reference-image model; example-based editing and reasoning; accepts a list of reference images and 2K/4K output. Verified 2026-11-24."
  black-forest-labs/flux-kontext-max:
    likeness: reference
    inputs: [prompt, input_image, aspect_ratio, output_format, prompt_upsampling, safety_tolerance, seed]
    note: "FLUX Kontext Max editing model; one input_image. Strong prompt following for turning a real reference photograph into the scene. Verified 2026-11-24."
  black-forest-labs/flux-2-flex:
    likeness: reference
    inputs: [prompt, input_images, aspect_ratio, resolution, steps, guidance, seed, output_format, output_quality]
    note: "Up to ten reference images and 4 MP editing; reference coherence is not a face-identity guarantee."
  google/nano-banana:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, output_format]
    note: >-
      Gemini image model. Takes up to several reference photographs and holds a
      face across a new scene better than a prompt or a light LoRA does; the
      strongest likeness route in the catalogue (123M+ runs). aspect_ratio may
      be match_input_image to inherit the reference's crop.
  bytedance/seedream-4.5:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, size, max_images, sequential_image_generation]
    note: "Reference-photo generation up to 2K/4K; image_input is a list."
  black-forest-labs/flux-2-max:
    likeness: text
    inputs: [prompt, aspect_ratio, width, height, resolution, output_format, output_quality, safety_tolerance, seed]
    note: "FLUX 2 Max, prompt-only: $0.03 per megapixel, half the price of flex and the newer model. No reference input, so it cannot hold a likeness; it is a texture and light model, not a portrait one."
  black-forest-labs/flux-2-pro:
    likeness: text
    inputs: [prompt, aspect_ratio, width, height, resolution, output_format, output_quality, safety_tolerance, seed]
    note: "FLUX 2 Pro: $0.015 per megapixel, prompt-only. The economical text tier when a frame only needs to be plausible."
  black-forest-labs/flux-2-klein-9b:
    likeness: text
    inputs: [prompt, aspect_ratio, megapixels, output_format, output_quality, go_fast, seed]
    note: "Klein 9B: $0.015 per output megapixel, prompt-only, larger than the 4B row it supersedes."
  black-forest-labs/flux-2-klein-4b:
    likeness: reference
    inputs: [prompt, images, aspect_ratio, seed, output_format, output_megapixels, output_quality]
    note: "FLUX 2, small and fast; `images` carries reference frames."
  black-forest-labs/flux-dev-lora:
    likeness: lora
    inputs: [prompt, aspect_ratio, guidance, num_inference_steps, lora_scale, extra_lora, seed, go_fast, output_format, output_quality]
    note: "The LoRA route STUDIO already trains against (ragnhild-flux, johann-flux)."
  openai/gpt-image-2:
    likeness: reference
    inputs: [prompt, input_images, aspect_ratio, quality, output_format]
  bytedance/seedream-4:
    likeness: reference
    inputs: [prompt, image_input, aspect_ratio, size]
  black-forest-labs/flux-dev:
    likeness: text
    free: true
    inputs: [prompt, aspect_ratio, guidance, num_inference_steps, seed, go_fast, output_format, output_quality, num_outputs, image]
    note: "Free tier. The base a face LoRA is trained against; strong prompt fidelity, no likeness memory."
  black-forest-labs/flux-schnell:
    likeness: text
    free: true
    inputs: [prompt, aspect_ratio, num_inference_steps, seed, go_fast, output_format, output_quality, num_outputs]
    note: "Free tier and the fastest FLUX (701M runs); the last resort that still renders."
  prunaai/flux-fast:
    likeness: text
    inputs: [prompt, aspect_ratio, seed]
    note: "Cheap and fast; useful for comps before a real render."
  prunaai/z-image-turbo:
    likeness: text
    inputs: [prompt, aspect_ratio, seed]
    note: "Fast text-to-image (59M runs)."

# Take one photograph and make a better or different one.
image_to_image:
  black-forest-labs/flux-kontext-max:
    inputs: [prompt, input_image, aspect_ratio, output_format, seed]
    note: "Instruction editing that keeps the subject; the max tier of the Kontext family."
  black-forest-labs/flux-kontext-pro:
    inputs: [prompt, input_image, aspect_ratio, output_format, seed]
  google/nano-banana:
    inputs: [prompt, image_input, aspect_ratio]
    note: "Earlier Gemini reference-image model; retain for compatibility tests, prefer nano-banana-2.1 for new work."
  google/nano-banana-2.1:
    inputs: [prompt, image_input, aspect_ratio, resolution, output_format]
    note: "Current 2.1 model; up to 14 references, 1K/2K/4K output."
  minimax/image-01:
    inputs: [prompt, subject_reference, aspect_ratio, number_of_images, prompt_optimizer]
    note: "Single-face reference image for subject-centric image generation."
  fofr/color-matcher:
    inputs: [image, reference]
    note: "Match one frame's grade to another; a deterministic grade without a look roll."
  fofr/kontext-make-person-real:
    inputs: [prompt, input_image, aspect_ratio, guidance, num_inference_steps, seed, output_format, output_quality, lora_strength]
    note: "Kontext edit that trades the plastic AI face for skin texture and pores; the realism pass after a selfie render."
  fofr/kontext-old-and-damaged:
    inputs: [prompt, input_image, aspect_ratio, guidance, num_inference_steps, seed, output_format, output_quality, lora_strength]
    note: "Kontext edit: scratches, fade and age on a photograph; the damaged-print look postpro can grade toward."
  fofr/kontext-ps1:
    inputs: [prompt, input_image, aspect_ratio, guidance, num_inference_steps, seed, output_format, output_quality, lora_strength]
    note: "Kontext edit to a PS1 game render without UI; a look, not a likeness route."
  levelsio/disposable-camera:
    inputs: [prompt, image, mask, aspect_ratio, prompt_strength, num_outputs, guidance_scale, seed, output_format, output_quality, go_fast, lora_scale, extra_lora, extra_lora_scale, model, megapixels, width, height, disable_safety_checker, replicate_weights]
    note: "Disposable-camera film look, trigger word STL in the prompt; extra_lora carries the subject's own adapter, so a styled selfie keeps the face."
  levelsio/analog-film:
    inputs: [prompt, image, mask, aspect_ratio, prompt_strength, num_outputs, guidance_scale, seed, output_format, output_quality, go_fast, lora_scale, extra_lora, extra_lora_scale]
    note: "Analog film look, trigger word ANLG in the prompt; the same extra_lora route as disposable-camera."

# Likeness from a face alone, when there is one photograph and no training set.
identity:
  grandlineai/instant-id-photorealistic:
    inputs: [image, prompt, negative_prompt, width, height, num_inference_steps, guidance_scale]
    note: "InstantID: one face photograph, no training run. Weaker than a reference model across many frames."

# Make a small render usable.
upscale_and_restore:
  philz1337x/clarity-pro-upscaler:
    inputs: [image, scale_factor, creativity, output_format]
    note: "Face-aware upscaler; the usual last step before delivery."
  recraft-ai/recraft-crisp-upscale:
    inputs: [image]
  zsxkib/bsrgan:
    inputs: [image, scale]
  lucataco/codeformer:
    inputs: [image, upscale, face_upsample, background_enhance]
    note: "Restores faces in a soft or damaged frame."
  flux-kontext-apps/restore-image:
    inputs: [input_image, output_format, safety_tolerance, seed]
  topazlabs/dust-and-scratch-v2:
    inputs: [image]

# MiniMax H3 video calls use a separate bounded STUDIO spend pool. Estimates
# include output seconds and the documented maximum 15 seconds of reference
# video input whenever references are supplied. The temporary 50% promotion
# expires after 2026-12-31; list rates remain in the catalogue.
video_budget:
  run_usd: 5.0
  call_usd: 1.0

# Motion from a still — the selfie series' short film.
image_to_video:
  minimax/h3-lite:
    inputs: [prompt, first_frame_image, last_frame_image, reference_image_urls, reference_video_urls, reference_audio_urls, duration, resolution, ratio]
    pricing:
      usd_per_second: { "480P": 0.025, "768P": 0.04 }
      promotional_usd_per_second: { "480P": 0.0125, "768P": 0.02 }
      promotion_until: "2026-12-31"
      max_reference_videos: 3
      max_reference_video_seconds: 15
    note: "MiniMax H3 Lite: first/last-frame image-to-video, 4-15s, 480P or 768P. Image-to-video ignores ratio and uses the input image's aspect ratio."
  minimax/h3-highspeed:
    inputs: [prompt, first_frame_image, last_frame_image, reference_image_urls, reference_video_urls, reference_audio_urls, duration, ratio]
    pricing:
      usd_per_second: 0.06
      promotional_usd_per_second: 0.03
      promotion_until: "2026-12-31"
      max_reference_videos: 3
      max_reference_video_seconds: 15
    note: "MiniMax H3 Highspeed: 768P, 4-15s. The default for everyday short films."
  kwaivgi/kling-v4-flash:
    inputs: [image, prompt, duration, aspect_ratio, mode]
    note: "Kling v4 flash: fast image-to-video with a short prompt."
  kwaivgi/kling-v3-omni-video:
    inputs: [prompt, start_image, end_image, duration, mode, aspect_ratio, generate_audio, multi_prompt, reference_images, reference_video, keep_original_sound, video_reference_type]
    note: "Kling v3 Omni: unified multimodal video with a first frame (start_image), 3-15s, standard/pro/4k. Select with --film-engine. generate_audio stays off; STUDIO lays the dilla bed under the cut itself."
  wan-video/wan-2.7-i2v:
    inputs: [image, prompt, resolution, num_frames, seed, go_fast]
  wan-video/wan-2.2-i2v-a14b:
    inputs: [image, prompt, resolution, num_frames, seed]
  google/gemini-omni-1.2-flash:
    inputs: [prompt, image]
  pixverse/pixverse-v4:
    inputs: [image, prompt, duration, quality]

# Sound, which STUDIO also needs (dilla) — the same catalogue carries it.
text_to_speech:
  minimax/voice-cloning:
    inputs: [text, voice_file, speed, volume]
    note: "Clone a voice from a sample; consent applies exactly as for a face."
  resemble-ai/chatterbox-pro:
    inputs: [text, audio_prompt, exaggeration, cfg_weight]
  google/gemini-3.8-flash-tts:
    inputs: [text, voice, prompt]
  x-lance/f5-tts:
    inputs: [gen_text, ref_audio, ref_text]

music:
  google/lyria-3.5:
    inputs: [prompt, duration]
  stability-ai/stable-audio-2.5:
    inputs: [prompt, duration, seed]
  elevenlabs/music:
    inputs: [prompt, music_length_ms]
  minimax/music-1.5:
    inputs: [prompt, lyrics, duration]
  lucataco/ace-step:
    inputs: [prompt, lyrics, duration, seed]

lipsync:
  sync/lipsync-2-pro:
    inputs: [video, audio]
  heygen/lipsync-speed:
    inputs: [video, audio]
  pixverse/lipsync:
    inputs: [video, audio]

# The training route, when a subject's own LoRA is the goal.
training:
  replicate/fast-flux-trainer:
    inputs: [input_images, trigger_word, lora_type, training_steps, seed]
    note: "Current subject/style trainer. The immutable production version, 1000 steps, subject type and seed are owned by lora/training_standards.yml; use 12-18 captioned private images around 1024px."
  replicate/train-rvc-model:
    inputs: [dataset_zip, model_name]
    note: "Voice model training, the audio counterpart of a face LoRA."
  black-forest-labs/flux-dev:
    inputs: [prompt, aspect_ratio, guidance, num_inference_steps, seed]
    note: "The base a face LoRA is trained against."
  replicate/fast-flux-kontext-trainer:
    inputs: [input_images, kontext_prompt_instruction, training_steps, seed, hf_repo_id, hf_token]
    note: "Trains a Kontext edit LoRA from paired images (x_start.jpg/x_end.jpg, optional x.txt captions); kontext_prompt_instruction is the trigger when captions are absent, training_steps defaults to 1000. The destination model is set on the training call, not in inputs."
