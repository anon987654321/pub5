# Long development chains.
#
# Every step is a different Replicate model and each one feeds the next, so the
# order is the craft decision: repair before sharpening (sharpening a broken
# frame sharpens the breakage), sharpen before film emulation (grain should sit
# on real detail, not on upscaled mush), and grade last, locally, where a pass
# costs nothing and can be stacked.
#
# The frame is always handed to whichever image input the model declares
# (`image`, `input_image`, `start_image`, `first_frame_image`), so a step only
# names the inputs it actually decides.
#
# There is no video chain yet: the catalogue has no video-to-video stage, so
# motion is one image-to-video call followed by the local video grade.

stills:
  # restore-image takes no prompt: it repairs what it is given.
  - model: flux-kontext-apps/restore-image
    inputs:
      safety_tolerance: 2
      output_format: png
  # creativity stays negative so the upscaler invents nothing: it is the one
  # stage that could quietly redraw a face.
  - model: philz1337x/clarity-pro-upscaler
    inputs:
      scale_factor: 2
      creativity: -2
      output_format: png
  # analog-film defaults to a square frame, which would crop a portrait.
  - model: levelsio/analog-film
    inputs:
      prompt: "ANLG 35mm colour negative emulation, gentle halation, fine grain, honest skin"
      prompt_strength: 0.3
      aspect_ratio: "3:4"
      output_format: png

# Delivers the frame exactly as generated. Every step in `stills` is a generative
# model: repair redraws, the face-aware upscaler invents detail at 2x, and
# analog-film re-renders at 30% strength. Stacked on a fresh FLUX frame they are
# what makes a still read as a digital image wearing a grain filter. With native
# the film look comes from the local house grade alone, at delivery size, where
# grain sits on the detail the model actually drew.
native:
  # Declared, not merely empty: a bare empty list is refused as a broken file.
  steps: []
