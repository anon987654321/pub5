# STUDIO/lora/thresholds.yml
#
# The envelope a render has to clear to be "at least as photographic as a real
# photograph of the subject". Floors are the reference minimum and ceilings the
# reference maximum: the question is "am I worse than any real photograph of
# her", not "am I better than the average one". Regenerate against a better
# reference set with:
#
#   ruby STUDIO/lora/judge.rb --calibrate <reference dir>
#
# These values are the ones the recovered pub4 run produced from seven reference
# frames. The full 108-frame set the values were drawn from lives in private
# storage, not in this public repository, so the numbers travel with their
# provenance and the tool that recomputes them rather than with the faces.
thresholds:
  texture: 0.012552          # floor: below is waxy, over-smoothed skin
  tonal_range: 0.091482      # floor: below is flat and veiled, no real blacks
  clipping: 0.000000         # ceiling: above is blown highlights
  specular_spread: 0.195470  # ceiling: above is a plastic sheen on the skin
