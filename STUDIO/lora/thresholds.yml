# STUDIO/lora/thresholds.yml
#
# The committed fallback envelope retains the historical seven-frame
# measurements below. The old specular ceiling was directionally wrong: the
# metric measures variation among bright pixels, and low values indicate
# clustered highlights. Its neutral 0.0 floor does not gate until recalibrated.
#
# Calibrate from a private directory containing at least five regular image files:
#   ruby STUDIO/lora/judge.rb --calibrate PRIVATE_REFERENCE_DIR
#
# The command prints aggregate YAML only. For a private mode-0600 file:
#   ruby STUDIO/lora/judge.rb --calibrate PRIVATE_REFERENCE_DIR --output "$HOME/.local/share/studio/thresholds.yml"
# Use that file with STUDIO_LORA_THRESHOLDS. Paths, filenames and image hashes
# are deliberately absent from the calibration document.
#
# Texture, tonal-range and clipping retain the recovered pub4 seven-frame
# envelope. The full 108-frame source set lives in private storage, not in this
# public repository.
thresholds:
  texture: 0.012552          # floor: below is waxy, over-smoothed skin
  tonal_range: 0.091482      # floor: below is flat and veiled, no real blacks
  clipping: 0.000000         # ceiling: above is blown highlights
  specular_spread: 0.000000  # neutral floor until correctly directed calibration
