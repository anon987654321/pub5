    rationale: "Selected for measured fidelity to the Law, one authoritative instrument, and explicit evidence boundaries."
  LINT_ASSET_URL:
    alternatives:
      - "Port the asset resolver across app, shared, public and Brgen engine roots."
      - "Parse ERB and CSS ASTs and resolve every asset helper to a concrete build artefact."
      - "Rely on Rails asset precompilation as the sole detector for missing pipeline assets."
