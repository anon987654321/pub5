# Work only the operator can finish, and what proves it finished.
#
# Each entry is a seam: the code or the test exists, and what is missing is a thing no agent in a checkout
# can supply (a console on vm23, a registrar login, a physical device, a paid provider call, a real browser,
# ears, a person's photographs, a credential, a decision of rights). An entry closes when its evidence
# exists and is recorded in the commit that deletes the entry; nothing here is a changelog and nothing
# here is a to-do for an agent. `bin/operator status` prints this file.
#
# Implementation and proof work stays in convergence.yml and data/gaps.yml; UX and
# RAILS refinement stay with their own ledgers. This file holds only evidence that
# requires the operator or an external environment (device, credential, remote host,
# browser, ears, provider, source rights or a human decision). status --agent is a
# read-only projection; no second queue is created here.
#
# needs: console (vm23), registrar, device, provider (paid), browser, ears, material (photos, data),
#        credential, rights (a decision about publication), idle-host.
schema: 1
seams:
  # MASTER
  - id: android_consent_ux
    tree: MASTER
    needs: device
    evidence: >-
      Owner/nearby-person separation, pair/release/re-pair, per-scope purpose and expiry, revocation and memory
      export verified on a real Android/Termux device, with the device and Termux versions.
  - id: android_termux_install
    tree: MASTER
    needs: device
    evidence: >-
      Fresh native install and update from the maintained Termux source, plus the opt-in --proot path:
      Debian guest creation and reuse, checkout bind, packaged Ruby 3.2+ selection, locked bundle install/check
      and normal CLI boot, with real command output. Then verify native Termux:API, native gem install,
      offline and local-model fallback, microphone permission and Norwegian and English recognition. Record
      Android and Termux versions; run the mobile doctor only in native Termux, never inside the Debian guest.
  - id: selfie_route_live
    tree: MASTER
    needs: provider
    evidence: >-
      The "generate me a selfie" route through an already configured provider, with the cost preflight, the
      actual response and the saved output and receipt. INCONCLUSIVE until then; no other image service is
      substituted.
  - id: browser_vision_end_to_end
    tree: MASTER
    needs: browser
    evidence: >-
      A real page screenshot passed to vision analysis whose description cites source evidence, with browser
      interaction kept behind its own permission boundary.
  - id: face_in_a_real_browser
    tree: MASTER
    needs: browser
    evidence: >-
      Default 3D, explicit ASCII, WebGL-off fallback, reduced motion, console errors and frame budget at desktop
      and mobile widths, saved screenshots and the Node suites' exit codes (face_stipple.test.mjs,
      face_boot.test.mjs).
  - id: voice_by_ear
    tree: MASTER
    needs: ears
    evidence: >-
      Playback on the Mac and on OpenBSD with no partial, silent or duplicate speech and no second speech path;
      natural TTS judged against the measured prosody work; recorded by the operator.
  - id: worktree_delivery_against_github
    tree: MASTER
    needs: credential
    evidence: >-
      Worktree delivery against a real GitHub staging repository and token, with failure cleanup and accurate
      delivery reporting, leaving the operator checkout untouched.
  - id: github_token_rotation
    tree: MASTER
    needs: credential
    evidence: >-
      Revoke the GitHub token previously used for repository operations. If continued automation needs a
      replacement, create one with the minimum repository scope and a short expiry. Prove the old token is
      rejected and the replacement works only from the approved credential store. No token value may enter
      the repository, chat, command output, receipts, logs or screenshots.
  # OPENBSD
  - id: shell_init_credential_rotation
    tree: OPENBSD
    needs: credential
    evidence: >-
      Live provider values moved into the owner-only host file, interactive provider startup verified, every
      reachable branch and tag searched for historical copies, and any credential that was ever committed
      rotated.
  # MASTER
  - id: release_acceptance_on_an_idle_host
    tree: MASTER
    needs: idle-host
    evidence: >-
      bin/operator check, MASTER rake test, RAILS/test/run_all.rb, each app's bin/ci, OPENBSD check
      --profile=full, OPENBSD/test/run_all.rb and the STUDIO suites run on an idle machine with HEAD and real
      exit codes recorded. The 2026-10-20 runs were on a machine at load 40 to 160 and timed out.
  - id: external_assessment_on_authorised_targets
    tree: MASTER
    needs: credential
    evidence: >-
      ExternalAudit against a permitted public test site, VulCheck on a test host and Nmap against one
      explicitly authorised lab target; unavailable results explicit, nothing installed or updated.
  - id: nmap_licence_boundary
    tree: MASTER
    needs: rights
    evidence: >-
      Qualified counsel confirms the Nmap OEM/commercial-embedding boundary, or a separately licensed scanner is
      chosen, before any paid Nmap-backed hosted workflow is offered. The adapter keeps calling an independently
      installed executable until then.
  - id: assessment_business_hypothesis
    tree: MASTER
    needs: material
    evidence: >-
      Ten buyer interviews and three paid pilots, with confirmed-finding and false-positive rates, time to first
      useful finding, time to verified remediation, delivery cost, willingness to pay and repeat purchase
      recorded.
  # RAILS
  - id: brgen_first_screen_in_chrome
    tree: RAILS
    needs: browser
    evidence: >-
      Front page and messenger at phone, tablet and desktop widths in Norwegian and English on two registered
      city hosts, with screenshots, rendered geometry, 44px hit areas, focus order and reduced motion.
      First-screen design changes are rendered values and the operator's.
  - id: tenant_isolation_live
    tree: RAILS
    needs: browser
    evidence: >-
      Feeds, conversations, inbox search, attachments, notifications, Turbo streams and jobs shown not to leak
      between cities, with unknown and malformed Host headers refused.
  - id: messenger_journey_in_a_browser
    tree: RAILS
    needs: browser
    evidence: >-
      Room switching, direct open, streaming send and receive, the unread divider, tail following, keyboard
      search and recovery after a dropped stream, in the one-pane and four-pane layouts.
  - id: payments_in_provider_staging
    tree: RAILS
    needs: provider
    evidence: >-
      Dintero, Stripe Connect and Vipps webhooks (signatures, duplicates, out-of-order delivery), idempotent
      paid states, integer minor units, refunds and failures proved in provider staging.
  - id: pwa_on_real_devices
    tree: RAILS
    needs: device
    evidence: >-
      Install, service-worker upgrade and rollback, stale-cache recovery, offline shell and media upload on real
      Android and iOS, with the Workbox output rebuilt from source.
  - id: city_registry_matches_dns_and_tls
    tree: RAILS
    needs: registrar
    evidence: >-
      Each registered city host shown to resolve and hold a valid certificate before a registry entry or footer
      link claims it.
  - id: journeys_in_all_three_apps
    tree: RAILS
    needs: browser
    evidence: >-
      Authentication, upload, search, error and mobile-navigation journeys rechecked in Brgen, Amber and
      bsdports separately.
  - id: amber_dashboard_geometry
    tree: RAILS
    needs: browser
    evidence: >-
      Authenticated Amber dashboard in Chrome at phone, tablet and desktop widths; saved screenshots and
      measured .dash-stats container width prove the card-column floor and four-column desktop layout before
      the grid is changed.
  # OPENBSD
  - id: unregistered_domains
    tree: OPENBSD
    needs: registrar
    evidence: >-
      brmingham.uk, glasgw.uk, lverpool.uk, mnchester.uk and dnver.us either registered or removed with their
      zones and ACME entries, each decision in OPENBSD/data/domain_released.yml, and the domain watcher re-run.
  - id: watched_all_target_deploy
    tree: OPENBSD
    needs: console
    evidence: >-
      zsh OPENBSD/bin/vps-deploy all ends with all ok and four ok stamps, with target commits, ~/vps-deploy.log,
      vps-state, relayd, app ports and services recorded.
  - id: deploy_failure_trap_window
    tree: OPENBSD
    needs: console
    evidence: >-
      A controlled failure on a throwaway ref exercises the isolated release directory, staged artifact,
      resource guard, atomic live switch and rollback to the prior known-good release. Capture the failed
      stamp, failing stage, service state, lock/flag cleanup, final log entry and recovery receipt; do not
      rehearse against live user data.
  - id: second_offhost_backup_and_key_recovery
    tree: OPENBSD
    needs: console
    evidence: >-
      A second off-host copy of the backups, a tested recovery path for DNSSEC and DKIM keys, /etc/*.env, SSH
      host keys and the ACME account key, and dr-pull --drill matching pull and blob counts.
  - id: dnssec_ds_at_registrars
    tree: OPENBSD
    needs: registrar
    evidence: >-
      Current DS records from doas ruby OPENBSD/bin/ds-records published at each registrar, dig +short DS
      answering, and domain_watch --tls reporting ds=1.
  - id: monitoring_and_crontab_on_vm23
    tree: OPENBSD
    needs: console
    evidence: >-
      Read and review every diff before installing pub5-alert, uptime-check.sh, relayd-watchdog, cron and
      newsyslog changes. Capture current RAM, swap, service RSS, job processes, load and health first;
      the 2026-11-04 1 GB/near-exhausted-swap note is historical, not a current measurement. Record post-change
      resource and alert behavior, with amber.brgen.no retired only after its replacement is proved.
  - id: two_consecutive_deploys
    tree: OPENBSD
    needs: console
    evidence: >-
      Build a reproducible OpenBSD/amd64 release artifact on the supported Mac build host, verify its
      manifest and hashes, then unpack it on vm23 without compiling dependencies during deployment.
      Prove two vps-deploy all runs in one approved window with vps-state --json, deploy-diff and rcctl ls
      captured before, between and after, matching apart from stamp times.
  - id: syspatch_in_a_console_window
    tree: OPENBSD
    needs: console
    evidence: >-
      The 69 base patches applied per OPENBSD/RUNBOOK.md Updates with the documented rollback, then syspatch -c
      empty, domain_watch --tls healthy and vps-state all ok.
  - id: full_check_after_deploy
    tree: OPENBSD
    needs: console
    evidence: >-
      ruby OPENBSD/bin/check --profile=full after a watched deploy, with no skipped check counted as a pass.
  - id: privilege_migration_on_vm23
    tree: OPENBSD
    needs: console
    evidence: >-
      vps_install_all.sh's direct rcctl fallback and the console and recovery paths reviewed, the focused and
      full OpenBSD contracts and smoke tests run on a real checkout, and an authenticated recovery path proved
      before /etc/doas.conf is narrowed.
  - id: manual_pages_on_openbsd
    tree: OPENBSD
    needs: console
    evidence: >-
      ruby -Itest test/test_manual_pages.rb from MASTER with mandoc present and no skipped lint, and MANPATH
      lookup of all five pages.
  - id: prompt_parity_on_a_live_openbsd_shell
    tree: OPENBSD
    needs: console
    evidence: >-
      The shared prompt grammar read identically on the Mac shell, the live OpenBSD shell, the MASTER CLI and
      the web face, without giving the browser shell or filesystem authority.
  # MASTER / repository and operator-owned archives
  - id: repository_visibility_and_history_containment
    tree: STUDIO
    needs: rights
    evidence: >-
      The operator decides whether the public repository visibility is intentional. If a visibility
      change or history rewrite is approved, use an administrator-authorised GitHub operation,
      coordinate mirrors, branches, tags, forks and clones, preserve a complete recovery bundle, then
      rescan every reachable ref for photographs, captions, descriptors, datasets, model weights and
      credentials. Current-tree absence is not proof of history containment; no private media is
      deleted from local storage as part of this audit.
  - id: runtime_wishlist_reconciliation
    tree: MASTER
    needs: material
    evidence: >-
      Export the ignored local MASTER/.master/fix_wishlist.json from the operator checkout and reconcile
      each still-valid row against convergence, gaps, UX and operator-seam IDs. Preserve provenance and
      rejection reasons; do not copy a generated list into a second tracked backlog.
  - id: account_wide_transcript_coverage
    tree: MASTER
    needs: material
    evidence: >-
      Only after the operator supplies an official ChatGPT export, reconcile source conversation IDs
      and timestamps, deduplicate repeated handoffs, and record the exact archive coverage. Do not claim
      complete account-wide coverage from a partial export or conversation snippets.
  # STUDIO
  - id: human_accessibility_participant_review
    tree: RAILS
    needs: rights
    evidence: >-
      Recruit real consenting participants only after the operator's privacy and research review. Record
      the task script, assistive technology and device, anonymised outcomes, withdrawal path and exact
      screen-reader/keyboard evidence. Agents may prepare the protocol and analyse supplied results but
      cannot impersonate a participant or manufacture human-study evidence.
  - id: maplibre_runtime_and_vendor_decision
    tree: RAILS
    needs: rights
    evidence: >-
      Prove whether Brgen Maps intentionally remains on the list fallback. Do not load MapLibre from a CDN.
      Any future WebGL map must have an approved, pinned, licensed local bundle, a source/security review,
      CSP and size budgets, a graceful non-WebGL fallback and current browser evidence before release.
  - id: rails_stale_capture_source_reconciliation
    tree: RAILS
    needs: browser
    evidence: >-
      Inventory committed desktop/mobile, route and micro-refinement screenshots against the exact current
      source revision. Recapture only after a real browser render; record route, host, viewport, source SHA
      and capture timestamp. Preserve contradictory historical captures as evidence rather than replacing
      or deleting them.
  - id: seo_canonical_host_browser_crawl
    tree: RAILS
    needs: browser
    evidence: >-
      Crawl canonical public hosts and representative city/vertical hosts in an actual browser and HTTP
      client. Record canonical tags, robots, sitemap, redirects, hreflang, structured data, indexable
      pagination and alias-host behavior. Include DNS/TLS identity and distinguish a crawl failure from
      an empty index; do not report search-engine indexing without independent evidence.
  - id: claude_code_hook_session_acceptance
    tree: MASTER
    needs: console
    evidence: >-
      On the operator's macOS checkout, launch a genuine Claude Code session through the existing .claude
      symlink, prove project hooks load and run on an approved harmless change, capture hook output and
      session identity, then verify no credential or private prompt content entered the repository.
  - id: wenche_subject_consent
    tree: STUDIO
    needs: rights
    evidence: >-
      Before any source recovery, dataset preparation, model training, rendering or promotion, obtain
      the subject's written, dated approval for likeness generation and provider processing, with
      separate explicit model-training and model-retention choices. Record provenance and rights for
      each source set separately (including private archive frames and website photographs); verify
      the subject is an adult and the intended use is within scope. Consent to one stage is not consent
      to another. Keep the scaffold, paid training, outputs and publication blocked until the exact
      permissions and source rights are reviewed. Preserve every original and existing render.
  - id: lora_source_refresh_and_paid_training
    tree: STUDIO
    needs: provider
    evidence: >-
      For each explicitly authorised subject, the native source-refresh request reaches the canonical
      tool, source provenance and rights are reviewed, datasets are privately archived, captions and
      preflight pass, then a separate paid-training confirmation records Replicate IDs, immutable
      versions, costs and private weight locations. Never infer consent from an existing model.
  - id: private_media_and_history
    tree: STUDIO
    needs: rights
    evidence: >-
      A subject-by-subject rights, retention and publication decision for private source photographs,
      captions, descriptors, derived datasets, renders and weights. Inventory current and historical
      pub4/pub5 refs, mirrors, branches, tags, forks and known clones without deleting or overwriting any
      original. Only after written approval: coordinate a backed-up history rewrite with clone owners,
      rotate any exposed credential, and independently rescan every affected ref. No deletion by size alone.
  - id: person_renders_and_duet_video
    tree: STUDIO
    needs: material
    evidence: >-
      Use only rights-cleared reference photographs and subject-specific identity checks. A Veo/Kling/
      Seedance/Wan comparison records cost per second and provider provenance. Each person separately
      reviews and accepts their likeness; duet use requires both subjects' explicit approval. A look
      bible and any publication remain operator-owned decisions.
  - id: dilla_by_ear
    tree: STUDIO
    needs: ears
    evidence: >-
      Chord spellings in dilla.json checked against records, groove offsets verified by ear, the
      named-progression and live-mode output heard, the 92 BPM dark-minor brief rendered and judged, and /play
      level checked on the host without clipping.
  - id: reference_workflow_with_a_real_link
    tree: STUDIO
    needs: ears
    evidence: >-
      A real YouTube audio link and a local file analysed (tempo, bars, tonal summary, audio only), a
      reference-driven render generated and listened to, Slum Village's Fantastic Vol. 2 as the groove
      benchmark.
  - id: lora_route_end_to_end
    tree: STUDIO
    needs: provider
    evidence: >-
      The "make a video with the lora of me" route through its real intent and provider path, run once under
      TurnRouterTest and once live.
  - id: paid_media_cost_proof
    tree: STUDIO
    needs: provider
    evidence: >-
      One Veo 3.1 Fast clip under an enforced cap of about 5 dollars, real-person-photo acceptance confirmed,
      the actual bill compared with the estimate, and Kling kept as fallback.
  # RAILS
  - id: visual_identity_acceptance
    tree: RAILS
    needs: browser
    evidence: >-
      Before and after Chrome screenshots at narrow and wide widths, the terminal face and prompt, and
      representative media renders for the signal-and-stillness rollout, with contrast, motion and performance
      evidence reviewed by the operator.
  # MASTER
  - id: remote_branch_aliases
    tree: MASTER
    needs: credential
    evidence: >-
      The nine remote master/fix-pid* aliases deleted from an authorized checkout after git fetch --prune and
      git worktree list show them orphaned. Local worktrees were removed on 2026-10-20.
  - id: assistant_calendar_or_mail_live
    tree: MASTER
    needs: credential
    evidence: >-
      One read-only calendar or mail workflow, not Google Calendar, run end to end against the operator's own
      account with a subject-bound grant, current data and its failure states shown.
  - id: messaging_channel_choice
    tree: MASTER
    needs: rights
    evidence: >-
      The operator names one external messaging channel (not Telegram) and the account it speaks as; the
      channel is then built through the shared session with identity isolation and delivery receipts.
  - id: session_browser_post_policy
    tree: MASTER
    needs: rights
    evidence: >-
      The operator edits plugins.session_browser in laws.yml to allow POST to an approved host
      (allowed_network_methods [GET, HEAD, POST], post_scope approved_host_only, host_approval
      once_per_site_per_task, visible_login_post_submission allowed), as decided 2026-11-01.
  - id: biz_template_preserve_first
    tree: BIZ
    needs: material
    evidence: >-
      Operator explicitly decides whether the bob/bob2 correspondence templates remain preserved as
      historical source or receive a new versioned retrofit. Compare current HTML/PDF hashes before
      any change; retain the originals and their PDFs. No in-place overwrite, migration or re-render
      until the operator selects the treatment and approves the resulting before/after.
  - id: radio_tunnel_rendered_review
    tree: RAILS
    needs: browser
    evidence: >-
      Capture the current Radio playlist home in Chrome at phone, tablet and desktop widths. Review
      first-play/tap-to-start, no-track, library-open, track label, reduced-motion and keyboard/focus
      states against current source. Compare the captures with the retained November 5/6 references;
      save new before/after evidence without replacing historical screenshots.
  - id: radio_whyp_tracks_imported
    tree: RAILS
    needs: console
    evidence: >-
      On vm23, with yt-dlp 2026.08.19 or later and ffmpeg: RAILS_ENV=production bin/rails
      radio:import_whyp_tracks, and its output showing 12 tracks seeded into Radio.
  - id: paid_plans_live
    tree: RAILS
    needs: credential
    evidence: >-
      Stripe Prices and STRIPE_PRICE_* set for brgen, amber and the master law API, a webhook endpoint per
      app with STRIPE_WEBHOOK_SECRET, and started_on set for each bet in __shared/config/portfolio.yml.
  - id: checkout_steps_design
    tree: RAILS
    needs: material
    evidence: The operator's recovered checkout-steps design, committed beside the marketplace cart.
  - id: search_focus_shadow
    tree: RAILS
    needs: rights
    evidence: >-
      The operator says whether the yep search shell keeps the pen's focus shadow, a named exception to the
      flat rule in __shared/README.md and design_contract_test.
  - id: advice_quality_human_review
    tree: MASTER
    needs: ears
    evidence: >-
      The operator's own reading of MASTER's answers to realistic personal-assistance scenarios, recorded
      apart from the model-backed evaluation in the cognition/evaluation owner records.
  - id: oauth_callbacks_live
    tree: RAILS
    needs: credential
    evidence: >-
      Real Google, Facebook, Vipps and BankID callbacks in brgen and amber, including BankID without email
      and legacy placeholder recovery, with the provider responses recorded.
  - id: amber_outfits_on_the_real_catalogue
    tree: RAILS
    needs: material
    evidence: >-
      Outfit combination and garment scoring over amber's real catalogue and media: diversity, garment
      identity and colour fidelity, provider limits, and any purchase or affiliate path.
  # OPENBSD
  - id: openbsd_native_suite
    tree: OPENBSD
    needs: console
    evidence: >-
      OPENBSD's tests run on OpenBSD itself for ksh and zsh, package signatures, service paths, permissions,
      pledge and privilege separation, with the host and release named.
  - id: bsdports_lifecycle_on_openbsd
    tree: RAILS
    needs: console
    evidence: >-
      A real bsdports package-index refresh and port install on a supported OpenBSD host: signed manifests,
      pinned HTTPS, CVE edges, disk-space fallback and rollback.
  - id: deepseek_findings_export
    tree: MASTER
    needs: material
    evidence: >-
      The DeepSeek handoff or chat export the backlog cited, saved under ~/Downloads, so each finding can be
      classified against current source. No file in the tree or Downloads holds it; git keeps only the commits
      that applied some of it (proof guards kept, MASTER/web and lib/master layouts since removed).
  - id: outbound_http_host_egress
    tree: OPENBSD
    needs: console
    evidence: >-
      On vm23, prove the host egress policy independently blocks loopback, RFC1918, link-local,
      metadata-service and redirect-to-private destinations while allowing explicitly approved provider
      endpoints. Record host identity, PF ruleset digest, command output and a negative/positive probe
      pair. Source-level SSRF tests are not a substitute for this host proof.
  - id: csp_enforced_on_vm23
    tree: OPENBSD
    needs: console
    evidence: >-
      PUB5_CSP_ENFORCE set in the live /etc/master.env and each app's env on vm23, and a response header showing
      Content-Security-Policy (not -Report-Only) with frame-ancestors, from a real request. The sample ships it
      commented out, so every app's policy only reports.
