authorization: >
  Operator request to land the polishing register and make MASTER able to
  identify and implement similar polishing opportunities as part of /fix.
method: >
  Extend the nearest existing owners. Discovery is Operator::PolishLens
  (lib/operator, the law_audit/law_reach family), read-only by default.
  Implementation is a bounded, operator-gated --apply (polish_apply.rb) for
  the strictly mechanical reversible subset, suitable as an argv-allowlisted
  /fix implementer: dry-run by default, refuses sacred paths (fail closed)
  and rendered values, consults antigen memory, emits a receipt per edit.
  Full intake scheduling reuses TaskSteward and the existing /fix pipeline;
  no second queue and no new backlog file. Rendered, taste, listening and
  live-host decisions remain operator-owned under RENDERED_VALUES.
