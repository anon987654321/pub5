# TTS policy — faithful speech is the default; expressive synthesis is opt-in.
#
# `default_mode` selects completed-utterance synthesis for CLI Playback on macOS.
# `fast_mode` is a separate latency policy: it keeps web speech progressive
# and avoids cold-starting Edge when no socket is available. Classic CLI speech
# allows one bounded one-shot recovery after an actual socket synthesis failure.
# Set MASTER_TTS_MODE=transcendent on macOS to opt into multi-engine synthesis.
# OpenBSD retains its explicit host-specific policy in Speech.synthesis_mode.
#
transcendent:
  enabled: true
  fast_mode: true
  default_mode: classic
  personality: warm_supportive
  warmth: 0.82
  depth: 0.68
  # Prefer expressive local engines when they are actually installed. Engines.attempt?
  # remains the availability check; missing MLX/Chatterbox falls through without delay.
  # glm_tts is the hosted lane: a network round-trip per utterance, so it sits
  # behind the local engines (the same reason Kokoro was demoted from the lead).
  engine_chain: mlx, chatterbox, glm_tts, edge_melodic, edge, say
  emotion_enabled: true
  # Deterministic, capped Chatterbox Turbo events. No random speech effects.
  paralinguistic_tags: true
  melodic_enabled: true
  melodic_threshold: 0.40
  # On macOS, expressive performance is opt-in for completed CLI utterances.
  # Direct Edge speech is the default because it preserves the supplied words
  # most faithfully. Select MASTER_TTS_MODE=transcendent for multi-engine
  # performance, emotion and melodic phrasing.
  phrase_rhythm_enabled: true
  phrase_language_switching: true
  mlx_model: mlx-community/chatterbox-fp16
  mlx_voice: default
  mlx_speed: 1.0
  exaggeration: 0.45
  cfg_weight: 0.42
  chatterbox_device: mps
  # A 8–15 second clean reference clip may be supplied by the operator for a
  # consistent local Chatterbox identity. Empty means no clip is assumed.
  reference_clip: ""
  replicate_model: jaaari/kokoro-82m
  replicate_voice: af_bella
  replicate_speed: 1.05
  # glm_tts rides the operator's z-ai SDK account through bin/zai-tts — the
  # same credential boundary as bin/zai-chat (`.z-ai-config`, never a file in
  # this tree). Set MASTER_TTS_NO_GLM=1 or remove it from engine_chain to
  # disable. Plain text only: no SSML, requests capped at 1024 characters and
  # chunked by Engines. glm_voice_map routes a resolved Policy voice alias to
  # an SDK voice id; GLM serves no Norwegian voice, so pernille stays unmapped
  # and the engine fails closed — voice.yml language_voices keeps Norwegian on
  # Pernille. glm_speed is the base speed; the Edge-style rate string scales
  # it, clamped to the API's 0.5-2.0 range.
  glm_voice_map:
    christopher: jam
  glm_speed: 1.0
