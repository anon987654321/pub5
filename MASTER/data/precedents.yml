  laws:
  - PRESERVE_FIRST
  question: A finding asks for a minimal comment fix; the repair loop wants the full
    mechanical repair in the same landing
  ruling: 'PRESERVE_FIRST prevails over DO_THE_WORK_NOW for this collision: A comment-only
    fix carries no behavior; the mechanical repair waits for its own landing with
    its own receipt'
  rationale: recorded from the operator's ruling on case case-20261117-005104; the
