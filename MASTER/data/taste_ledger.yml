# taste_ledger.yml - the operator's judgment, accumulating.
#
# Each row is a structured, versioned taste decision the tree can cite:
# accepted or rejected, in one domain, at one revision, with the provenance
# of where the decision was already recorded. Seeded from decisions the tree
# itself carries; the operator's future render rulings append here via
# `bin/master taste record`. Never a substitute for the operator's ruling:
# the ledger stops re-asking and warns on conflict, it does not invent.
schema: 1
decisions:
  - id: type-terminal-ascii-20261106
    at: "2026-11-06"
    revision: "superseded by type-terminal-nerd-mono-20261121"
    decision: superseded
    domain: type
    subject: "Terminal text retains an ASCII-safe plain-text form for pipes and terminals without patched fonts"
    rationale: "The portable text constraint remains; it never prohibited ANSI presentation or a monospaced type system."
  - id: type-terminal-nerd-mono-20261121
    at: "2026-11-21"
    revision: "MASTER/lib/voice/renderer/prompt_components.rb and MASTER/web/styles/face/30_conversation.css"
    decision: accepted
    domain: type
    subject: "MASTER CLI and web share a Nerd Font Mono-first stack, semantic prompt colours and syntax roles"
    rationale: "Interactive colour is presentation only; plain output remains readable without ANSI or Nerd Font glyph support. No third-party font request is introduced."
  - id: palette-paper-token-2026
