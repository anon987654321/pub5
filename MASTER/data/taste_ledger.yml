    revision: "recorded in MASTER/checks/data/law_fixtures.yml PAPER_NOT_PURE_WHITE"
    decision: accepted
    domain: palette
    subject: "Paper surfaces use the --paper token; raw #FFFFFF backgrounds are rejected by the rendered laws"
    rationale: "The fixture pair records it as law: bad background: #FFFFFF; good background: var(--paper)."
  - id: palette-signal-not-warning-orange
