schema: 1
name: "Papua New Guinea mask reference collection"
selection: "round_robin_per_new_chat"
rendering:
  base: "MASTER original monochrome particle portrait"
  profile_notice: >
    The five face profiles are restrained geometric studies informed by the
    cited objects. They are not replicas, ceremonial reconstructions, sacred
    characters, or depictions of the source masks. The one-pixel carrier field,
    particle count, and void composition remain MASTER's own design.
  image_policy: >
    Show only the linked public-domain or CC0 museum/reference photograph.
    Preserve the source image unchanged and retain its credit and object link.
  cultural_policy: >
    Museum copyright status does not equal cultural permission. Do not infer
    ritual meaning, reproduce restricted designs, or use the photographs as
    training material. Where a museum record describes ceremonial or spirit
    associations, show only the credited documentary reference and keep the
    generated geometry abstract.
