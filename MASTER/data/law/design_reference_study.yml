# External design-reference study for MASTER's visual reasoning.
# These are reference lenses, not copied branding, CSS, typography, or assets.
# The product's own design language, rendered evidence, and operator-owned values win.

antigravity:
  product_form: agent_first
  useful_patterns:
    - task_level_progress
    - artifacts_as_reviewable_work
    - browser_in_loop_verification
    - persistent_workspace_context
    - progressive_disclosure
    - plan_before_build
    - precise_feedback_on_artifacts
  apply_when:
    - the user creates or reviews work
    - an app has multiple object states
    - a long task needs resumable evidence
  avoid:
    - copying google branding
    - turning every page into an IDE
    - adding panels without a demonstrated information need

x:
  product_form: content_first_social_stream
  useful_patterns:
    - persistent_primary_navigation
    - obvious_current_location
    - central_live_content_stream
    - composer_near_the_content
    - inline_actions
    - contextual_secondary_rail_on_wide_views
    - dense_information_without_visual_noise
  apply_when:
    - a surface is social or community driven
    - the task is scan_choose_open
    - recency and activity are primary signals
  avoid:
    - importing x-specific branding
    - assuming every surface needs a right rail
    - making controls compete with content

hey:
  product_form: opinionated_workflow_mailbox
  useful_patterns:
    - meaningful_information_states
    - clear_piles_or_sections
    - explicit_reply_later_state
    - explicit_set_aside_state
    - calm_typographic_hierarchy
    - predictable_retrieval
    - action_bar_close_to_the_object
  apply_when:
    - a surface manages queues or saved work
    - users need defer_or_resume behavior
    - information should leave the primary stream without disappearing
  avoid:
    - arbitrary piles
    - novelty for its own sake
    - hiding important actions behind decorative interaction

bol:
  product_form: commerce_catalogue
  useful_patterns:
    - search_led_discovery
    - category_breadcrumb_wayfinding
    - context_specific_filter_facets
    - explicit_result_sorting
    - comparison_rich_product_results
    - clear_price_availability_and_purchase_context
    - restrained_promotional_labels
    - related_product_discovery_without_chrome_overload
    - mobile_and_desktop_parity
    - customer_specific_help_for_discovery_and_comparison
  apply_when:
    - a surface sells or compares physical goods
    - users need to narrow a large catalogue
    - price availability trust and action must scan together
  avoid:
    - copying bol branding or proprietary assets
    - treating promotion as more important than product relevance
    - adding filters without category-specific evidence

figma:
  product_form: variable_driven_design_library
  sources:
    variables_collections_modes: https://help.figma.com/hc/en-us/articles/14506821864087-Overview-of-variables-collections-and-modes
    variable_modes: https://help.figma.com/hc/en-us/articles/15343816063383-Modes-for-variables
    descriptions: https://help.figma.com/hc/en-us/articles/7938814091287-Add-descriptions-to-styles-components-and-variables
    code_connect: https://help.figma.com/hc/en-us/articles/23920389749655-Code-Connect
  useful_patterns:
    - typed_variables_for_reusable_values
    - collections_for_related_variables
    - semantic_modes_for_real_design_contexts
    - aliasing_for_token_dependency
    - component_properties_and_variants
    - variable_and_component_descriptions
    - code_connect_to_real_implementation_paths
  apply_when:
    - a published design library is being authored or maintained
    - designers and implementation agents need a shared component contract
  avoid:
    - treating the pub5 three-tier collection proposal as a Figma-mandated standard
    - creating a second token authority beside MASTER/data/tokens.yml
    - adding modes or component tokens without a real context or use
    - assuming Code Connect is required or that a mapping proves runtime behavior

stripe_semantic_mapping:
  authority: "Reference mapping only; local product identity and MASTER Laws win."
  roles:
    canvas: "surface/default"
    cool_surface: "surface/subtle"
    deep_ink: ["text/primary", "surface/inverse"]
    accent: ["action/primary", "text/brand"]
    muted_ink: ["text/secondary", "text/muted"]
    separators: ["border/default", "border/subtle"]
    spacing: ["stack/*", "inline/*", "inset/*", "gap/*"]
    radii: ["radius/control", "radius/container"]
  reject:
    - "Importing Stripe's exact palette, brand-purple, wordmark or proprietary artwork"
    - "Copying Söhne or another reference typeface as a pub5 requirement"
    - "Transferring gradient meshes, blue-tinted shadows or ornamental elevation"
    - "Replacing Brgen, Amber or bsdports' existing dialects with one Stripe-like theme"
  implementation: "Resolve each semantic role against MASTER/data/tokens.yml and the consuming app's declared dialect; no raw value is copied merely because a reference uses it."

shared_principles:
  - content_or_object_before_chrome
  - one_primary_action_per_surface
  - persistent_orientation
  - progressive_disclosure
  - explicit_state
  - visible_return_path
  - predictable_retrieval
  - responsive_recomposition
  - keyboard_and_touch_parity
  - measured_geometry_before_style_change
  - preserve_operator_owned_values
  - no_new_visual_primitive_without_evidence

family_shell:
  rail: persistent_orientation
  inbox_or_index: scan_and_choose
  primary: task_or_content
  artifact_or_context: optional_only_when_evidence_requires
  mobile: one_primary_column_with_drawer_or_sheet_states
  desktop: additional_context_may_be_side_by_side
  rule: shared_geometry_contract_does_not_imply_shared_visual_dialect

review_questions:
  - What is the user's object of attention?
  - Where is the next action without searching?
  - What state is this object in?
  - How does the user return?
  - What can leave the primary stream without becoming lost?
  - Which element deserves the strongest visual mass?
  - Which element is decorative noise?
  - Does the wide layout add information or only columns?
  - Does the mobile layout recompose or merely shrink?
  - Is the proposed change supported by rendered evidence?

vertical_anatomy:
  brgen_social:
    attention: person_place_activity
    structure: [orientation, feed, composer, context, return_path]
    reference_lenses: [x]
  messenger:
    attention: conversation
    structure: [rail, inbox, thread, composer, contextual_artifact]
    reference_lenses: [antigravity, x, hey]
    preservation: keep_declared_geometry_and_existing_messenger_snapshots
  marketplace:
    attention: item_price_trust
    structure: [orientation, discovery, filters, listings, item_detail, purchase_or_contact]
    reference_lenses: [bol, x, hey]
  dating:
    attention: person_choice
    structure: [orientation, person_focus, evidence, decision_actions, match_handoff]
    reference_lenses: [x, hey]
  takeaway:
    attention: food_availability_order
    structure: [restaurant_identity, menu_or_catalog, availability, cart, checkout_status]
    reference_lenses: [hey, x]
  radio:
    attention: sound_track_artist
    structure: [station_identity, now_playing, player, queue, discovery, visualizer]
    reference_lenses: [antigravity]
  tv:
    attention: video_story
    structure: [player_or_feed, title_context, engagement, next_item, sound]
    reference_lenses: [x, antigravity]
  maps:
    attention: place_relation
    structure: [search, map, result_list_or_sheet, place_detail, route_or_action]
    reference_lenses: [x, antigravity]
  amber:
    attention: garment_outfit
    structure: [wardrobe_orientation, visual_inventory, item_detail, outfit_composition, next_action]
    reference_lenses: [hey, antigravity]
  bsdports:
    attention: port_package
    structure: [search, identity, version, install_or_use, dependencies, documentation]
    reference_lenses: [antigravity]
  completion_rule:
    every_surface_must_answer:
      - what_am_i_looking_at
      - what_state_is_it_in
      - what_can_i_do_next
      - how_do_i_get_back
    responsive_rule:
      - mobile_recomposes
      - desktop_adds_information_not_chrome
      - touch_targets_remain_measured
    visual_rule:
      - render_first
      - source_second
      - protect_operator_owned_values
      - change_only_with_evidence

# Historical principles are lenses attached to existing Laws, not a second law
# catalogue or a universal numerical beauty metric.
creative_lenses:
  source: https://github.com/anon987654321/pub4/blob/ca92b7d2be36c5877d570fc5abbb60f5572d261a/MASTER/data/principle_map.yml
  centre:
    laws: [STRONG_CENTERS, VISUAL_HIERARCHY]
    design: "Name the object of attention; make related information reinforce it, not compete with it."
    music: "Identify foreground, motif and supporting voices."
    photography: "Choose the subject, visual centre and frame."
    cinema: "Direct attention through framing, blocking, sound and cuts."
    architecture: "Establish a legible centre and meaningful smaller places."
    writing: "Put the controlling idea before its evidence."
    software: "Name the owner of each concept and its public boundary."
  space:
    lineage: "Ma, kanso and shibui; Tadao Ando's architectural restraint."
    laws: [DENSITY_ma, DENSITY_kanso, NEGATIVE_SPACE_GROUPING]
    design: "Whitespace groups related things; remove empty wrappers and decorative divisions."
    music: "Silence, rests and selective subtraction make the remaining parts meaningful."
    photography: "Negative space supports subject separation."
    cinema: "Let an action, reaction or quiet shot breathe where the story needs it."
    architecture: "Void, light, prospect and refuge shape lived space."
    writing: "Paragraph breaks separate ideas; omit redundant exposition."
    software: "Remove duplication and needless indirection, not essential capabilities."
  development:
    lineage: "Jo-ha-kyu: beginning, development and acceleration; a lens, not a universal timeline."
    laws: [LEVELS_OF_SCALE, TRANSFORMATIONS, INTENTIONAL_TEMPORAL_FORM]
    design: "Reveal information and feedback at the pace of the task; no decorative motion."
    music: "Relate pulse, phrase and section; create contrast and return, not arbitrary jitter."
    photography: "Build depth and visual hierarchy; a series develops rather than repeats."
    cinema: "Use deliberate pacing, tension and release, and motivate transitions."
    architecture: "Connect human scale, rooms, circulation and the whole site."
    writing: "Build an argument in coherent stages."
    software: "Express work as meaningful stages with explicit state."
  material:
    laws: [ANALOG_WARMTH, DENSITY_wabi_sabi, DENSITY_form_follows_function]
    design: "Use native semantics and truthful material; do not imitate another brand."
    music: "Choose complementary timbres; use selective wear, not indiscriminate distortion."
    photography: "Preserve identity and optical detail; grain changes texture, not recovered detail."
    cinema: "Lighting, motion and film treatment must serve the scene."
    architecture: "Respond to climate, place, material and human needs: daylight, ventilation, passive solar design, durability and resource stewardship. Engineering safety requires separate evidence."
    writing: "Prefer concrete words, precise claims and honest uncertainty."
    software: "Prefer native capabilities and explicit invariants over ornamental abstractions."
  review:
    laws: [MASS_GENERATE_CURATE, OPERATOR_RENDERED]
    design: "Compare representative rendered states at phone and desktop widths; preserve approved identity."
    music: "Compare level-matched audio and arrangement evidence; listening remains human."
    photography: "Compare original and grade at full size; likeness and aesthetic review remain separate."
    cinema: "Inspect temporal continuity, edit rhythm, sound sync and operator intent."
    architecture: "Compare site, circulation, structure and environmental constraints; obtain qualified review."
    writing: "Read for meaning, economy and factual support; do not optimize a readability number alone."
    software: "Compare behaviour, dependencies, security and tests; fewer files is not proof of quality."

  scale:
    laws: [LEVELS_OF_SCALE]
    design: "Relate detail, component, page and product; preserve hierarchy across viewport sizes."
    music: "Relate individual attacks, measures, phrases and sections."
    photography: "Balance fine texture, subject and overall silhouette."
    cinema: "Relate shot scale, scene and narrative structure."
    architecture: "Relate construction detail, human body, room, building and site."
    writing: "Make sentence, paragraph and section serve the whole."
    software: "Keep method, module and system responsibilities legible."
  rhythm:
    laws: [INTENTIONAL_TEMPORAL_FORM, CONSISTENCY]
    design: "Use recurring alignment and spacing; vary them for meaningful emphasis."
    music: "Preserve groove anchors while allowing expressive timing."
    photography: "Use recurring shapes and intervals to guide the eye."
    cinema: "Let shot duration and movement follow the scene, not a fixed tempo."
    architecture: "Use recurring bays, openings and intervals with meaningful variation."
    writing: "Vary sentence length deliberately; read aloud when cadence matters."
    software: "Keep related interfaces and control flow predictable."
  contrast:
    laws: [VISUAL_HIERARCHY, INTENTIONAL_TEMPORAL_FORM]
    design: "Differentiate importance, state and action without relying on color alone."
    music: "Use contrasts in register, density and dynamics without masking the foreground."
    photography: "Use tonal separation and selective detail without losing important information."
    cinema: "Use light, sound and pacing contrasts to clarify dramatic intent."
    architecture: "Use light and shadow, enclosure and openness to support inhabitation."
    writing: "Distinguish claims, counterarguments and examples."
    software: "Make exceptional behavior visibly distinct from normal flow."
  coherence:
    laws: [CONSISTENCY, STRONG_CENTERS]
    design: "Make components reinforce a shared interaction language."
    music: "Relate motifs, harmony, timbre and groove to the intended whole."
    photography: "Align framing, lighting and grade with the subject."
    cinema: "Maintain motivated continuity across picture, sound and narrative."
    architecture: "Resolve circulation, structure and spatial relationships together."
    writing: "Keep terminology and argument consistent."
    software: "Align ownership, contracts and dependencies; avoid competing authorities."
  character:
    laws: [VISUAL_IDENTITY_SOURCE_OF_TRUTH, STRONG_CENTERS]
    design: "Protect distinctive approved identity instead of imposing generic templates."
    music: "Preserve the intended performer or production character."
    photography: "Preserve likeness and meaningful individual detail."
    cinema: "Preserve the work's visual and narrative voice."
    architecture: "Respond to local place, use and material traditions."
    writing: "Preserve the author's register and meaningful idiosyncrasies."
    software: "Respect established project conventions without preserving defects."
  adaptation:
    laws: [FORM_FOLLOWS_FUNCTION, CONVENTION_OVER_CONFIG]
    design: "Adapt to real devices, tasks and accessibility needs."
    music: "Adapt arrangement to the brief, available voices and listening context."
    photography: "Adapt exposure and treatment to actual light and subject."
    cinema: "Adapt coverage and pacing to performance and story."
    architecture: "Respond to site, climate and occupants; verify physical performance separately."
    writing: "Adapt vocabulary and structure to audience and purpose."
    software: "Prefer sensible defaults and native platform capabilities; verify fallbacks."
  economy:
    laws: [ECONOMY_OF_MECHANISM, FORM_FOLLOWS_FUNCTION]
    design: "Remove chrome that does not support orientation, action or identity."
    music: "Prefer fewer complementary voices over unnecessary layering."
    photography: "Remove distractions without erasing meaningful context."
    cinema: "Keep shots and effects that serve the scene."
    architecture: "Seek material and structural efficiency without compromising safety or use."
    writing: "Omit words that contribute neither meaning nor necessary nuance."
    software: "Remove redundant machinery while retaining behavior and safeguards."
