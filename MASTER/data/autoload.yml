# Paths under lib/ that Zeitwerk must not autoload, grouped by the reason.
#
# This was five ad-hoc lists inside lib/master.rb -- an array, a lone extra
# ignore, a glob with an inline exception, a second array, and a third array --
# with no reason recorded against any entry. Adding a file to a directory whose
# parts reopen one class broke boot with an error that did not explain itself.
#
# Every path here is a file Zeitwerk *cannot* load, not a file someone chose not
# to name properly: it reopens a constant defined elsewhere, declares a foreign
# namespace, or is required by hand for load order. `rake lint:autoload` proves
# that for each entry and fails on any that has become unnecessary -- so this
# list cannot quietly become a place to hide naming mistakes.
autoload:
  # Reopen a class or module that another file defines. The path implies a
  # constant the file does not define, which is exactly what Zeitwerk rejects.
  # Splitting a large class across files is the point; these are its parts.
  reopens_a_constant_defined_elsewhere:
    # Master::CLI::Session -- the REPL, split by concern. container.rb is NOT here:
    # it defines Master::CLI::Session::Container and autoloads normally.
    - cli/session/background_scan.rb
    - cli/session/bridge_run.rb
    - cli/session/command_ops.rb
    - cli/session/repl_io.rb
    - cli/session/result_display.rb
    - cli/session/signals.rb
    - cli/session/greeting.rb
    - cli/session/reminders.rb
    # Master::CLI::CommandRegistry -- one file per verb or pipeline stage.
    # command.rb defines its own constant and is left autoloadable.
    - cli/command_registry/documents.rb
    - cli/command_registry/help.rb
    - cli/command_registry/host.rb
    - cli/command_registry/model.rb
    - cli/command_registry/observe.rb
    - cli/command_registry/review.rb
    - cli/command_registry/laws.rb
    - cli/command_registry/status.rb
    - cli/command_registry/workspace.rb
    # Master::CLI::Pipeline::Pass -- pass_result.rb holds its Result value type.
    - cli/pipeline/pass_result.rb
    # Master::Builder module functions, split out of builder.rb.
    - builder/ai_boot.rb
    - builder/boot_phases.rb
    # Master::Fix::Kernel::LifecycleJournal -- the durable /fix run journal,
    # split by responsibility: plan and pass mutations, assessment and
    # architecture report persistence/verification, matrix and surface-evidence
    # validators, artifact and state safety, legacy migration. The defining
    # file is fix/kernel/lifecycle_journal.rb; these re-open its class.
    - fix/kernel/lifecycle_journal/runs.rb
    - fix/kernel/lifecycle_journal/reports.rb
    - fix/kernel/lifecycle_journal/architecture_reports.rb
    - fix/kernel/lifecycle_journal/report_matrix.rb
    - fix/kernel/lifecycle_journal/surface_evidence.rb
    - fix/kernel/lifecycle_journal/artifacts.rb
    - fix/kernel/lifecycle_journal/state_store.rb
    - fix/kernel/lifecycle_journal/legacy_state.rb
    # Master::Fix::Kernel -- the hash-chained /fix ledger, split out of
    # fix/kernel.rb: append_event with its TOCTOU-checked directory, path and
    # handle validation, the verified read path (read_log/read_log_io) behind
    # `bin/master replay`, and the verify_log! reader. The defining file keeps
    # the coordinator lifecycle: settings lock, construction, run, terminal
    # receipts and the replay CLI.
    - fix/kernel/ledger.rb
    # Master::Fix::SurfaceEvidence -- read-only surface sensors, split by
    # concern: surface receipt builders, browser receipts, test/deployment
    # receipts, inventory and manifest, runtime probes, and the command runner.
    - fix/surface_evidence/receipts.rb
    - fix/surface_evidence/visual_receipts.rb
    - fix/surface_evidence/execution_receipts.rb
    - fix/surface_evidence/inventory.rb
    - fix/surface_evidence/runtime_probes.rb
    - fix/surface_evidence/command_execution.rb
    # Master::Fix::FourStreamAssessment -- terminal renderings (summary, report,
    # evidence_report) split out of fix/four_stream_assessment.rb.
    - fix/four_stream_assessment/reporting.rb
    # Master::Fix::Transaction -- the /fix pass transaction, split by concern.
    # The defining file is fix/transaction.rb; validation.rb holds the durable
    # manifest, the pending-marker audit and the contracts guarding both,
    # observation.rb the write path's snapshots and enlistment, delivery_door.rb
    # what Delivery reads. These re-open its class.
    - fix/transaction/validation.rb
    - fix/transaction/observation.rb
    - fix/transaction/delivery_door.rb
    # Master::Fix::Wishlist -- the durable next-work ledger, split by
    # responsibility: fix/wishlist/claims.rb carries the row state machine
    # (claimable, claim, attempt, delivery, verification, reflection intake)
    # and fix/wishlist/rendering.rb the model-facing prompt/parse/normalize
    # side plus pending-queue reporting. The defining file is fix/wishlist.rb.
    - fix/wishlist/claims.rb
    - fix/wishlist/rendering.rb
    # Master::Fix::UserSimulation -- the candidate simulator beside BestOfN,
    # split by responsibility: scenarios.rb the interaction-campaign oracle
    # (surface mapping, scenario context, campaign validation), execution.rb
    # the focused-test runner and the reversible candidate trial. The defining
    # file is fix/best_of_n.rb; these re-open its class.
    - fix/user_simulation/scenarios.rb
    - fix/user_simulation/execution.rb
    # Master::Fix::Mission -- the durable objective, split by responsibility:
    # schema.rb the record's shape, version migrations and disk round trip,
    # lock.rb the inter-process mission lock, run_state.rb the
    # start/queue/resume state machine, lease.rb lease custody and liveness,
    # state.rb the attempt's progress surface, proof.rb the durable proof
    # receipts, repository.rb the repository custody receipts. The defining
    # file is fix/mission.rb; these re-open its class.
    - fix/mission/schema.rb
    - fix/mission/lock.rb
    - fix/mission/run_state.rb
    - fix/mission/lease.rb
    - fix/mission/state.rb
    - fix/mission/proof.rb
    - fix/mission/repository.rb
    # Master::Fix::RestructureSweep -- the tree-level restructure sweep, split
    # by concern: candidates.rb ranks structural findings into the read-only
    # candidate map and resolves sweep targets, verdicts.rb carries the
    # proposal prompt, decommission audit/blocking, hostile verdict, commit
    # message and report. The defining file is fix/restructure_sweep.rb; these
    # re-open its class.
    - fix/restructure_sweep/candidates.rb
    - fix/restructure_sweep/verdicts.rb
    # Master::Fix::RestructureSweep::Context -- the evidence the model reads,
    # split by concern: surfaces.rb the repository-surface duplication
    # findings, references.rb the reverse-reference sections. The defining
    # file is fix/restructure_sweep/context.rb; these re-open its class.
    - fix/restructure_sweep/context/surfaces.rb
    - fix/restructure_sweep/context/references.rb
    # Master::Fix::Scan::FileProcessor -- the scan's per-file processor, split
    # by responsibility: semantic_tier.rb the model tier's schedule within a
    # pass (off, defer, budget, replay) and the outage evidence it records,
    # progress.rb the per-law progress monitor and its CHECK_PROGRESS_FILE /
    # console heartbeat. The defining file is fix/scan/file_processor.rb;
    # these re-open its class.
    - fix/scan/file_processor/progress.rb
    - fix/scan/file_processor/semantic_tier.rb
    # Master::Review::Agent -- the review agent, split by concern:
    # conversation.rb the chat door with its dispatch, finalization and
    # evidence preflight, research.rb the guarded operator research call. The
    # defining file is review/agent.rb; these re-open its class.
    - review/agent/conversation.rb
    - review/agent/research.rb

  # Declare a constant outside Master::, so the path cannot imply the name.
  defines_a_foreign_namespace:
    # RubyLLM::Providers::Bedrock is intentionally not shadowed. MASTER does
    # not enable a Bedrock transport on OpenBSD, and the old compatibility file
    # was removed as an incompatible provider shadow.
    - io/ruby_llm_patch.rb
    # Operator:: -- shared with RAILS and OPENBSD, its own tool, not Master::Operator.
    - operator

  # Loaded by hand because order matters or the entrypoint is a plain require.
  required_manually:
    # boot/paths, boot/data_loading, boot/runtime and boot/master_boot are required by
    # name after loader.setup in lib/master.rb, and the order is load-bearing.
    - boot
    # time.rb declares Master::Time and is required by path. Managed, the
    # directory is the namespace Master::Master:
    # a require of "lib/master" defines it, and from then on `Master.` inside
    # any module nested in Master resolves to that empty module.
    - master
    # The directory; llm_dispatcher.rb itself autoloads as LLMDispatcher.
    - review/llm_dispatcher
    # Master::CLI::Routing::RoutePolicy, required by model_router.rb; the policy is a
    # sibling of ModelRouter, not a constant inside it.
    - cli/routing/model_router/route_policy.rb
    # Master::Fix::FixLoop::LawOrder, required by path from visual_groups.rb and the
    # Kernel convergence adapter before FixLoop itself is loaded.
    - fix/fix_loop/order.rb
