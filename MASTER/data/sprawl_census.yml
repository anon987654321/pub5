# Every tracked path costs maintenance: source, test, asset, fixture,
# documentation and configuration alike. The ceiling exists so a commit that
# buys structure has to say what it bought. Read `tracked_files` and
# `tracked_directories` as one priced fact — they answer "how much structure
# does this checkout carry?", not two independent quality signals.
#
# Set deliberately on 2026-11-07, never inferred from whatever the tree
# happened to hold. The pub4 -> pub5 migration arrived at 6,738 tracked files
# against a ceiling of 6,664, so this ratchet was born red and stayed red
# through 365 further additions. The additions since the migration, read one
# class at a time:
#
# 306  MASTER/checks/data/route_screenshots/<app>/<route>__<width>__<state>.png
#      plus the three <app>.golden.yml manifests. One approved baseline per
#      route, width and state, compared by pixel. Three apps share the layout,
#      so a route renders at three widths, and the manifests already name 600
#      rows; approval is human-gated, so the PNGs arrive slower than the rows.
#      This is the per-app baseline the screenshot check exists to hold, not a
#      shadow copy: the pixel comparison is the whole point.
#  18  BIZ/<plan>/{html,pdf}. Each published plan carries the pair the tree
#      promises (plus the svg mark where one exists); the html is the
#      source, the pdf its printed counterpart.
#  41  code and tests: 11 MASTER lib and tool entry points, 7 MASTER tests,
#      9 RAILS, 5 STUDIO, and 6 BIZ build/check instruments under BIZ/tools
#      (one tree with the plan folders since 2026-11-08).
#
# lone_dirs is the ceiling that still does real work. It counts a directory
# holding one file and no subdirectories, so it says "this namespace was
# bought for one occupant". 37 are recorded; the overwhelming majority are
# Rails-convention single-file test directories (test/services/x_test.rb,
# test/i18n/, test/stylesheets/), fixture trees mirroring a real repository
# layout (bsdports/.../gettext/Makefile), and deployment paths OpenBSD fixes
# (etc/ssh/sshd_config). That is the framework's shape, not our sprawl.
#
# stutter is a genuine quality flag and stays at 0. It found
# STUDIO/dilla/dilla.rb: a `#!/usr/bin/env ruby` entry point recorded without
# the executable bit, so the census could not tell it from a module file that
# says its own name twice. The fix was the mode, not the ceiling.
#
# The mrdamascy production host bought two files on 2026-11-11: falcon.rb,
# the Falcon service config (one worker, port 47314), and preload.rb, which
# boots Rails in the host process; the duplicate agent wish list left the same
# day. tracked_files re-set to the checkout as it stands.
# The vendorables ruling executed on 2026-11-08: the onnxruntime WASM, the
# smart-turn model, the face mask and the three web/images JPGs left git
# (eight files, ~23.6 MiB, three directories — one of them lone — per
# TREE_CONTRACTS.md). tracked_files was re-set to the checkout the cut and
# the rebased upstream docs additions produced; the other fields keep their
# set values until re-read by the same instrument that set them.
#
# 2026-11-12: re-set to the checkout as cloned at e5d9d83. The +72 files and
# +9 directories were bought upstream before the clone; no path in this
# checkout could commit anything until the census matched what HEAD itself
# contains. No path added by this session.
#
# 2026-11-13: re-set to 7287 because the 2026-11-12 re-set undercounted the
# tree it was written against: 44742be and HEAD alike hold 7287 tracked paths
# (`git ls-tree -r` and `git ls-files` agree), so the recorded 7283 priced a
# checkout four files smaller than the one carrying it and even a commit that
# adds nothing could not pass the gate. No path added by this session; the
# count is corrected, not raised above what HEAD already contains.
# 2026-11-13 (2): upstream commits between the re-set above and this one
# (read-only tool/model/MCP inventory, agent_work bootstrap artifacts among
# them) bought ten paths into two new directories; ls-files and ls-tree agree
# on 7297 files and the growth instrument reads 889 directories. No path
# added by this session; the count follows what HEAD already contains.
# 2026-11-13 (3): the sandbox bootstrap was not repository tooling. Remove its
# nine temporary files and the obsolete PROGRESS ledger. The resulting Git
# tree contains 7561 regular tracked files and 894 tracked directories. The
# intervening additions were 209 curated RAILS visual-review captures, 54
# MASTER code/test/skeleton files and 8 STUDIO LoRA/runtime files. Keep the
# lone_dirs ceiling at 37: the agent skeleton's two single-file eval/test
# namespaces are visible growth, not a reason to silently raise the allowance.
# 2026-11-13 (4): the consent prelude and carousel controller add two source
# files inside existing support directories; no new directory is introduced.
# 2026-11-13 (5): re-set to the checkout as it stands. HEAD holds 7,915 tracked
# paths and the instrument reads 7,912 regular files and 979 directories, so the
# recorded 7,563/894 priced a tree 349 files and 85 directories smaller than the
# one carrying it and no path could commit. The growth is upstream content bought
# before this clone: the OPENBSD mirror reorganization (+189), RAILS/mytoonz
# (+89) and STUDIO/lora (+50). No path added by this session. lone_dirs stays at
# 37 by policy below; stutter was a real repair (STUDIO/dilla/dilla.rb regained
# its execute bit), not a ceiling change.
# 2026-11-14 (6): re-set to the checkout as it stands. HEAD holds 7,935 tracked
# paths and the instrument read 7,932 regular files and 981 directories against
# the recorded 7,912/979, so no path could commit: 20 files and 2 directories
# are upstream content bought before this clone by the MASTER face-expression
# series landed on main (9c38f65df through b4d7d3c3). This session's split of
# brgen's 639-line _brgen_dating.scss (over the 300-line lint gate) adds three
# sheets inside the existing stylesheets directory, no new directory; the
# instrument now reads 7,935. lone_dirs rides the face work, 42 from 37;
# stutter and vague_names stay at 0.
# 2026-11-16 (7): re-set to the checkout as it stands. The instrument reads
# 7,944 regular files and 982 directories against the recorded 7,935/981, so no
# path could commit. The nine files added since the last set (0755994, which
# held 7,938) landed upstream on main: ARCHITECTURE.md, bin/bootstrap,
# BIZ/ragnhild/ragnhild_legater.pdf, three RAILS tests and known_failures.yml,
# the messenger attachment test, and STUDIO/vendor/tone (LICENSE.md and
# Tone.min.js) - one new directory. No path added by this session; the count is
# corrected to what HEAD already carries, not raised above it.
lone_dirs: 42
stutter: 0
vague_names: 0
tracked_files: 8006
tracked_directories: 982
corpus: 4127

