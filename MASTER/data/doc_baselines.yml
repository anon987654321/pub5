  RAILS/mrdamascy/docs/fix-ledger.md:
  - value: 44px
    why: Dated repair ledger. The entry records that touch targets were NOT_RUN because
      they need a booted app and Chromium, so it reports an absence of measurement.
  - value: 24px
    why: Dated repair ledger describing a .tab-icon rebuilt as a 24px flex box; it
      records a change that happened, not a scale to follow.
  RAILS/mrdamascy/APP_SPEC.md:
  - value: 10px
    why: 'Declared, not prescribed. The value is inside this app''s own fenced :root
      block (--shadow): the app owns its shadow and radius scale locally instead of
      reading MASTER''s luxury group. The detector resolves only against MASTER/data/tokens.yml,
      so an app-local declaration can never trace; promoting this scale into tokens.yml
      is an open design decision.'
  - value: 14px
    why: Same app-local :root block (--radius-sm). Section 1 now cites --radius by
      name, but a custom property declared inside the document is invisible to a detector
      that resolves only against MASTER/data/tokens.yml.
  - value: 20px
    why: App-local --radius, declared at line 23 and cited by name at line 30. Priced
      here because tokens.yml has no 20px radius step; whether it should grow one
      is a design decision, not a documentation repair.
