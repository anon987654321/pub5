---
doc_numbers:
  BIZ/research/bringhurst-strunk-research.md:
  - value: 3rem
    why: Typography research quoting the canonical measure formula
      (max-width:min(66ch, 100% − 3rem)) as scholarship about why the tokens
      exist; the page prescribes no live dimension of its own.
  RAILS/mrdamascy/APP_SPEC.md:
  - value: 10px
    why: 'Declared, not prescribed. The value is inside this app''s own fenced :root
      block (--shadow): the app owns its shadow and radius scale locally instead of
      reading MASTER''s luxury group. The detector resolves only against MASTER/data/tokens.yml,
      so an app-local declaration can never trace; promoting this scale into tokens.yml
      is an open design decision.'
  - value: 14px
    why: Same app-local :root block (--radius-sm). Section 1 now cites --radius by
      name, but a custom property declared inside the document is invisible to a detector
      that resolves only against MASTER/data/tokens.yml.
  - value: 20px
    why: App-local --radius, declared at line 23 and cited by name at line 30. Priced
      here because tokens.yml has no 20px radius step; whether it should grow one
      is a design decision, not a documentation repair.
doc_paths:
  OPENBSD/RUNBOOK.md:
  - path: db/seeds/launch.rb
    why: Prescriptive, not stale. The line asks for a launch seed to be written that
      week; the file is meant not to exist yet. It comes out of this list the day
      someone writes it.
  MASTER/data/law/TREE_CONTRACTS.md:
  - path: RAILS/shared
    why: Names the path that must not be used; the engine directory is RAILS/__shared.
      The mention is the guard, not a citation.
  MASTER/AGENTS.md:
  - path: master_web_assets_check.rb
    why: Lives on vm23 under /etc/rc.d/master; OPENBSD/dev/operator_stage_2.zsh is
      the tracked caller. The prose teaches the check, the box owns the script.
  - path: public/three.module.js
    why: Deleted 2026-07-28; the section is the register that records the deletion,
      so it must be able to name the path.
