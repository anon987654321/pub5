RATCHET_AUDIT_BLIND:
  root: visible_state
  statement: "Laws audited blind."
  severity: error
  resolution: never
  value: 0
  may_only: fall

RATCHET_AUDIT_SATURATED:
  root: visible_state
  statement: "Laws audited saturated."
  severity: error
  resolution: never
  value: 0
  may_only: fall

RATCHET_HYGIENE_ID_CASE_COLLISIONS:
