META_SCHEMA:
  root: visible_state
  statement: "The schema version of this file."
  severity: info
  resolution: never
  value: 8

META_VERSION:
  root: visible_state
  statement: "The version of this file."
  severity: info
  resolution: never
  value: "8.0.0-first"

META_AUTHOR:
  root: visible_state
  statement: "The author of record, in whom authority vests."
  severity: info
  resolution: never
  value: operator

META_LANGUAGE:
  root: visible_state
  statement: "The language of record."
  severity: info
  resolution: never
  value: english

META_DIALECT:
  root: visible_state
  statement: "The dialect of the operator's secondary language."
  severity: info
  resolution: never
  value: american

SEVERITY_VOCABULARY:
  root: visible_state
  statement: "Every severity is one of these five. warn is a typo, not a synonym."
  severity: error
  resolution: never
  values: [info, warning, error, critical, veto]

ROOTS_VOCABULARY:
  root: visible_state
  statement: "The thirteen roots a universal law names."
  severity: info
  resolution: never
  values: [one_source, no_surplus, one_responsibility, least_surprise,
           visible_state, bounded_load, stable_contract, proportion,
           least_authority, stewardship, reach, abstraction, proximity]

EVIDENCE_SCORING:
  root: visible_state
  statement: >
    Test pass, scan clean, and code review each contribute; the
    threshold is all three. No margin, no partial credit.
  severity: error
  resolution: never
  weights: { test_pass: 35, scan_clean: 25, code_review: 20 }
  pass_threshold: 80
  require_all_kinds: true

STYLE_REGISTRY:
  parent: OPERATOR_RENDERED
  statement: "Each named style resolves to one immutable versioned entry per modality; tools consume the registry instead of maintaining parallel house looks."
  severity: error
  resolution: review

STYLE_SCOPE:
  parent: OPERATOR_RENDERED
  statement: "Reference-derived styles transfer only explicitly declared attribute classes, each with its own source fingerprint and strength."
  severity: error
  resolution: review

STYLE_LINEAGE:
  parent: OPERATOR_RENDERED
  statement: "Style manifests separate inputs used from measured output influence; lineage alone never proves influence, and null influence requires a reason."
  severity: error
  resolution: review

STYLE_VERSIONING:
  parent: OPERATOR_RENDERED
  statement: "Released style versions are write-once; changes mint a higher version with owner, rationale and predecessor while prior versions remain resolvable."
  severity: error
  resolution: review

STYLE_TEMPORAL_CONSTANCY:
  parent: OPERATOR_RENDERED
  statement: "A render uses one style instance throughout unless a schedule hash is declared in both the registry and render manifest."
  severity: error
  resolution: review

STYLE_REFUSAL:
  parent: OPERATOR_RENDERED
  statement: "Negative-list constraints are evaluated before rendering; refusal reports the matched constraint and never masquerades as a generation failure."
  severity: error
  resolution: review

STYLE_ARBITRATION:
  parent: OPERATOR_RENDERED
  statement: "Reviewers adjudicate declared contracts and evidence, not taste; aesthetic decisions remain with the operator under RENDERED_VALUES."
  severity: error
  resolution: review

VISUAL_IDENTITY_TOKENS_ONLY:
  parent: OPERATOR_RENDERED
  statement: "Ad-organ CSS resolves colour, typography and spacing through the canonical visual token contract; hardcoded presentation values fail the audit."
  severity: error
  resolution: review
  contract: "MASTER/data/tokens.yml#tokens.ad_visual_contract"
  detector: "Master::Visual::AdAudit.identity_tokens"

VISUAL_CONTRAST_WCAG_AA:
  parent: OPERATOR_RENDERED
  statement: "Every audited ad text/background pair meets WCAG AA contrast thresholds in the token contract and in rendered evidence."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.contrast"

VISUAL_DISCLOSURE_PROMINENCE:
  parent: OPERATOR_RENDERED
  statement: "Native and affiliate creatives identify their commercial nature near the content with readable, contrasting disclosure."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.disclosure"

VISUAL_ALT_TEXT_PRESENT:
  parent: OPERATOR_RENDERED
  statement: "Every image in an ad creative has non-empty alternative text unless it is explicitly decorative."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.alt_text"

VISUAL_SAFE_ZONE_RESPECTED:
  parent: OPERATOR_RENDERED
  statement: "Rendered headline, logo and call-to-action bounds remain inside the placement safe zone."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.safe_zone"

VISUAL_RENDER_INTEGRITY:
  parent: OPERATOR_RENDERED
  statement: "A creative passes only with rendered evidence proving assets loaded, transfer size within budget and layout shift within budget."
  severity: error
  resolution: review
  detector: "Master::Visual::AdAudit.render_integrity"

VISUAL_LAYOUT_REFINEMENT_EVIDENCE:
  parent: OPERATOR_RENDERED
  statement: "A rendered-layout refinement proceeds from a before/after screenshot pair compared against the owning Laws, cites the Law each edit repairs, edits shared tokens before page CSS, and ships only with that measured pair."
  severity: error
  resolution: review
  detector: "Master::Visual::LayoutRefinement.evidence"

# The virtual photographer (Johann 2026-11-07, from the harvested Grok
# critique): a selfie run is a capture system, not a filter stack.
SELFIE_DEPARTMENT_RECIPE:
  parent: OPERATOR_RENDERED
  statement: >
    Every generated portrait carries one coherent recipe that the camera
    department, cinematography, art direction, film laboratory, optics,
    colourist, VFX and quality control agree on: framing, perspective,
    focus, light setup, negative and print, halation and diffusion, grade
    and finishing named per shot and never interchangeable sliders. A
    collection is ten distinct photographic treatments, not ten backdrops
    off one instruction.
  severity: warning
  resolution: review

SELFIE_SHOT_PERSPECTIVE:
  parent: SELFIE_DEPARTMENT_RECIPE
  statement: >
    The lens and the finish belong to the shot: no universal 35mm prime
    rides in every photograph and no universal --heavy --count 1 postpro
    call finishes them - the recipe names the perspective and the exact
    preset, and a random take exists only as deliberate exploration.
  severity: warning
  resolution: review

SELFIE_ONE_DEVELOPMENT:
  parent: SELFIE_DEPARTMENT_RECIPE
  statement: >
    Generate the capture and develop and print it exactly once: the
    generator's image stays clean of film artefacts, postpro applies one
    authoritative deterministic pass (grain, halation, bloom, flare in the
    right domain and only once), the pipeline keeps scene-referred data
    from display encoding, and the intermediate stages are preserved so
    the grade stays reversible.
  severity: warning
  resolution: review

SELFIE_CONTACT_REVIEW:
  parent: SELFIE_DEPARTMENT_RECIPE
  statement: >
    Quality control judges photographs, not pixels: composition, identity,
    optics, realism, light and set coherence are measured, metrics rank and
    reject, and the contact sheet ends with the operator - no portrait is
    finished on a metric's word alone.
  severity: warning
  resolution: review

