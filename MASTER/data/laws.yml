# ---

LINT_SEVERITY_IN_VOCABULARY:
  root: visible_state
  statement: "Every severity is one of info, warning, error, critical, veto."
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_vocabulary!)

LINT_AUTOFIX_HAS_PROOF:
  root: visible_state
  statement: "resolution automatic names a proof fixture that fails before and passes after."
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_resolutions!)

LINT_MEASUREMENT_DOES_NOT_MUTATE:
  root: visible_state
  statement: "calibration measurement_only forbids resolution automatic on the same law."
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_resolutions!)

LINT_NO_EXCLUDE:
  root: visible_state
  statement: >
    A law does not carry exclude, path, or path_pattern. A file's kind
    is a fact; the finding is made; the review resolution carries the
    reason and the expiry.
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_relationships!)

LINT_NO_SCOPE:
  root: visible_state
  statement: >
    A law does not carry applies_to or domain. A universal law does not
    say where it applies; if a file contains the pattern, the law
    catches it. If it does not, there is no finding.
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_relationships!)

LINT_BOTH_MODALITIES:
  root: visible_state
  statement: >
    Every law names a mechanical and a semantic detector. A detector
    declared human is a gap, counted by the duality ratchet.
  severity: error
  resolution: never
  enforcement: Master::LawParity (lib/fix/law_parity.rb) + validate_invariant_modalities!

LINT_EVERY_LAW_HAS_ROOT_OR_NODE:
  root: visible_state
  statement: "Every top-level law names either a soul node or a root; every child inherits from its parent."
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_relationships!)

LINT_IDS_UNIQUE:
  root: visible_state
  statement: "Every law id is unique across the file."
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_ids!)

LINT_EVERY_FINDING_EMITTED:
  root: visible_state
  statement: >
    Soul.emit is called for every finding; a finding not emitted is a
    finding under APPLICATION_IS_UNIFORM_unrecorded_finding.
  severity: error
  resolution: never
  enforcement: declared

LINT_SOUL_PRINT_MATCHES_SOURCE:
  root: visible_state
  statement: "data/soul.yml body_sha256 equals Soul.print body_sha256 for the loaded soul.rb."
  severity: error
  resolution: never
  enforcement: Master::ConfigurationGuard#validate_soul (lib/configuration_guard.rb)

LINT_FAMOUS_NAMES_PRESERVED:
  root: visible_state
  statement: >
    A law whose canonical name is well established (DRY, KISS, SOLID,
    POLA, YAGNI, Law of Demeter, Strunk & White, Bringhurst, Rails
    Doctrine, CQS, SRP, OCP, LSP, ISP, DIP) keeps that name as its id.
    A rename of a famous law is a rename, not a clarification.
  severity: error
  resolution: never
  enforcement: Master::FlatLawCatalogue.validate! (lib/flat_law_catalogue.rb#validate_famous_names!)

