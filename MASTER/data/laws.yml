# Derived law coverage and meaning map. The executable Law definitions remain in MASTER/law/.
law_map:
  schema: 1
  # Reverse of the integrity check: registered scan laws that no law claims.
  # 2026-08-07: closed 8 gaps (circuit_breaker, least_privilege, secure_by_default,
  # composition_over_inheritance, boy_scout_rule, durability, user_control, sovereignty)
  # by linking existing kernel/unit laws.
  #
  # Most rows marked `status: gap` are conduct: how to work, not a shape a line of
  # code can have, which law/practice.rb carries because no detector exists for
  # it. Their law_ids stay empty. Filling them by matching names against
  # Law.define points a row at a neighbour that shares a word, which is false
  # coverage; a gap closes when a real detector for that law exists.
  #
  # Two rows were repointed from a target whose requirement they did not state:
  # `complexity_budget` says "cyclomatic complexity under 10 per function" but
  # named SMALL_FUNCTIONS, which counts method lines; `no_god_files` says "split
  # monolithic files into focused modules" but named NO_GOD_CLASS, which counts a
  # class's public methods and code lines. CYCLOMATIC_COMPLEXITY and SMALL_FILES
  # are the Laws whose own `fix` carries those exact requirements, and NO_GOD_CLASS
  # keeps its three other rows. Trace debt fell 90 -> 87.
  # `law_trace_ceiling` ratchets DOWN only. `rake lint:law_trace` aborts while
  # registered Laws trace to no principle, and `RATCHET=1` records a new low.
  #
  # 2026-08-08: raised 77 -> 87 as a DECLARED GAP, not as coverage. The 87 are
  # lint-hygiene Laws -- trailing whitespace, final newline, tab and control
  # characters, line length, TODO/FIXME, `rescue Exception`, `Time.now`
  # timezone, `puts`/debug output, ERB escaping, wrapped linters (reek,
  # rubocop, ABC size) and Fowler smells (middle man, data class, boolean
  # trap, long parameter list). This map is a DESIGN-PRINCIPLE vocabulary:
  # its 291 rows are Wabi-sabi, Fitts, negative space, the design books. It
  # has no row about whitespace and should not grow one, because a hygiene
  # rule is not a design principle. Every previous attempt to place these 87
  # by name pointed them at a neighbour sharing a word, which is false
  # coverage; the two rows that DID name a measurable requirement were
  # already repointed above. The honest statement is that 87 Laws are
  # enforced but untraced to a principle, and this ceiling says so out loud
  # instead of hiding it under a stale 77 the repo never met.
  #
  # The debt may only fall from here: close a row when a real principle
  # exists, or keep the Law enforced and leave the number standing. Do not
  # fill these `law_ids` to make the count drop.
  #
  # 2026-11-13: raised 87 -> 88. TERMINAL_OUTPUT_TYPOGRAPHY (MASTER/law/typesetting.rb)
  # was registered without a map row: it holds operator-facing strings to an ASCII,
  # 72-character terminal measure, from Bringhurst's measure and the operator terminal
  # profile. The map's `typographic_marks` row is about MARKS (dashes, quotes) in copy,
  # not the measure of terminal output, so pointing this Law at it would be the same
  # false name-coverage this ceiling exists to avoid. PREDICATE_SIDE_EFFECTS was closed
  # to `command_query_separation` in the same change: its own source is command-query
  # separation and its requirement is that row's ("separate actions from queries").
  law_trace_ceiling: 88
  version: v110.0-restored
  source: merged master.yml fossil -> MASTER runtime law_map
