    dead_links: 0

visual_directives:
  # Rendered-conformance rules for VisualConformance. Each rule names the
  # project_context.yml directive it enforces, the surfaces it covers (an
  # app-id regexp), a probe that reads one value from a measured element, and
  # the checks that value must pass. Probes and checks are registered in
  # lib/fix/visual_conformance.rb; adding a directive means adding a rule here.
  rules:
  - id: swiss_sans_only
    directive: brgen_typography_swiss_only
    scope: '\A(brgen|__shared)'
    probe: font_family
    checks:
      forbid_generic: [serif]
      forbid_named:
      - georgia
      - times
      - times new roman
      - garamond
      - palatino
      - baskerville
      - cambria
      - playfair display
      - source serif pro
      - merriweather
      - lora
      - noto serif
      - didot
      - bodoni
      head_in:
      - helvetica neue pro
      - helvetica neue
      - helvetica
      - arial
      - sans-serif
      - system-ui
      - -apple-system
      - monospace
      - ui-monospace
      - sf mono
      - menlo
      - monaco
      - consolas
      - courier new
      - courier
      - liberation sans
      - arimo
      - sf pro
      - sf pro text
      - sf pro display
      - .sf ns
      - apple color emoji
      - segoe ui emoji
      - noto color emoji
      monospace_only_in: 'chat|terminal|irc|(^|[>.#\s])(pre|code|kbd|samp)([>.#\s\[]|$)'

visual_rubric:
  # reader: Master::Fix::VisualPass
  # Visual judgement is constrained by the house. These are observable dimensions,
  # not a generic beauty score.
  
  dimensions:
    hierarchy: "One clear primary action; visual emphasis follows the task."
    alignment: "Edges, baselines, controls, and repeated elements share the established grid."
    rhythm: "Spacing and typography use the existing token scales; no arbitrary one-off values."
    density: "Worst-case content remains calm, legible, and free of accidental crowding or overflow."
    states: "Empty, loading, validation, error, and success states explain what happened and what can happen next."
    motion: "Entry, exit, and feedback motion use existing duration/easing tokens and honor reduced motion."
    content: "Real Norwegian and worst-case strings remain legible; punctuation and dates follow locale conventions."
    affordance: "Interactive elements look and behave like the same interaction vocabulary elsewhere in the product."
    console: "For terminal startup, status, progress and operational events, follow OpenBSD dmesg: append-only factual lines, stable subsystem0: prefixes, plain meaning, no banners or decorative panels. Conversational replies may retain restrained Markdown."
  
  judgment:
    first_read: "Describe what the eye notices first and whether that matches the task."
    falsification: "State what observation could disprove the claimed visual defect."
    pairwise: "Prefer before/after or sibling-surface comparisons when deciding between two compliant alternatives."
    anti_sycophancy: "Name the five strongest observable weaknesses before proposing a refinement."
    console_first: "For MASTER CLI surfaces, OpenBSD dmesg is the primary visual reference; shell-prompt trends and decorative polish are subordinate."
  
  constraints:
    brand: "Use the house's own references, tokens, laws, and observed good surfaces; competitor screenshots are not style targets."
    terminal: "Operational CLI output follows Master::Trace::Dmesg: one factual event per line, stable unit0: grammar, useful scrollback, no decorative prompt segments or banners. Keep conversational replies readable and width-aware."
    edits: "Prefer existing primitives and token substitutions; never invent a new visual system inside a refinement."
    evidence: "A screenshot proves a rendered state; source proves implementation; neither alone proves intent."
    stopping: "When evidence is inconclusive, report INCONCLUSIVE rather than manufacture a taste verdict."

runtime_environment:
  ruby:
    compatibility_floor: "3.3"
    selection: "Use the compatible Ruby already installed and active on the host. Prefer the current interpreter; search other installed interpreters only when it is below the compatibility floor."
    version_policy: "No patch-level pin, no minor-version pin and no upper bound. Ruby 4.x and later are not rejected by policy."
    installation: "Do not silently install or download another Ruby merely because a newer version exists. Report a real compatibility failure with its evidence."
    lockfile: "Do not put a Ruby directive in the Gemfile just to record the local interpreter. Keep Gemfile.lock portable and do not require a host-specific RUBY VERSION entry."
