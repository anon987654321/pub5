# ==========================================================================
# 3. CONSTITUTIONAL SUPPORT
# ==========================================================================

SACRED_AUTHORSHIP:
  root: least_authority
  statement: "No autonomous write to a path declared sacred by the governing Soul manifest."
  severity: error
  resolution: never
  mechanical: Soul.refuse_write!
  semantic: Soul.load!

SACRED_AUTHORSHIP_autonomous_sacred_write:
  parent: SACRED_AUTHORSHIP
  statement: "An automated writer touching a path declared sacred by soul.yml."
  resolution: never

SACRED_AUTHORSHIP_soul_hash_mismatch:
  parent: SACRED_AUTHORSHIP
  statement: "A soul.yml whose body_sha256 does not match the loaded soul.rb."
  resolution: never

SACRED_AUTHORSHIP_soul_paths_are_soul_owned:
  parent: SACRED_AUTHORSHIP
  statement: "Protected paths are declared only by soul.yml#absolute.sacred_paths and cannot be shadowed by laws.yml, runtime metadata or a Ruby constant."
  resolution: never

# ---

SOUL_SUBORDINATE_TO_LAW:
  root: least_authority
  statement: "Soul owns system identity, preservation principles and source authority; laws.yml alone owns individual Law identities and requirement statements. The Soul manifest must not create or redefine those Law records."
  severity: error
  resolution: never
  mechanical: Master::ConfigurationGuard.validate_soul
  semantic: human

SOUL_SUBORDINATE_TO_LAW_no_parallel_precedence:
  parent: SOUL_SUBORDINATE_TO_LAW
  statement: "The Law catalogue, Ruby identity code or execution metadata declares a competing source-authority order instead of reading soul.yml#authority_order."
  resolution: never

SOUL_SUBORDINATE_TO_LAW_temperament_is_not_authority:
  parent: SOUL_SUBORDINATE_TO_LAW
  statement: "A persona, voice or delivery preference overrides Soul identity, preservation principles, source authority or an individual Law requirement."
  resolution: never

SOUL_SUBORDINATE_TO_LAW_no_shadow_vocabulary:
  parent: SOUL_SUBORDINATE_TO_LAW
  statement: "Soul duplicates a per-Law severity, priority, root or enforcement vocabulary owned by laws.yml."
  resolution: review

# ---

DUAL_MODALITY:
  root: visible_state
  statement: >
    Every law is enforced in both modalities. A law only mechanically
    enforced has a semantic gap; only semantically enforced has a
    mechanical gap. Both are measured; neither is zero; neither grows.
  severity: warning
  resolution: review
  mechanical: Master::Lint#both_modalities
  semantic: human

DUAL_MODALITY_mechanical_gap:
  parent: DUAL_MODALITY
  statement: "A law whose mechanical detector is human."
  resolution: never

DUAL_MODALITY_semantic_gap:
  parent: DUAL_MODALITY
  statement: "A law whose semantic test is human."
  resolution: never

# ---

FINDING_HYGIENE:
  root: visible_state
  statement: >
    A finding is a hypothesis until evidence confirms it. A finding that
    could not measure its subject has not passed; it is inconclusive. An
    inconclusive finding never clears a ratchet.
  severity: error
  resolution: never
  mechanical: Master::Lint#finding_shape
  semantic: Master::Review#finding_evidence

FINDING_HYGIENE_unsourced_finding:
  parent: FINDING_HYGIENE
  statement: "A finding with no evidence of its class."
  resolution: never

FINDING_HYGIENE_inconclusive_as_pass:
  parent: FINDING_HYGIENE
  statement: "A finding recorded as pass on inconclusive evidence."
  resolution: never

BAYMARD_RESEARCH_BOUNDARY:
  parent: FINDING_HYGIENE
  statement: >
    Public usability research, including Baymard's ecommerce research, informs
    independently worded and context-specific assessments. It is evidence, not
    constitutional authority: it does not override operator-owned product
    identity, the needs of the actual audience, or observed behaviour. It never
    implies affiliation or certification and does not reproduce proprietary
    guideline text, screenshots or benchmark material.
  severity: error
  resolution: never
  mechanical: Master::Review::BaymardLaw.validate_profile!
  semantic: operator_context_and_observed_user_needs
  source: https://baymard.com/research/methodology

BAYMARD_CART_ABANDONMENT_CONTEXT:
  parent: BAYMARD_RESEARCH_BOUNDARY
  statement: >
    Cart abandonment is an outcome, not a diagnosis. Distinguish browsing and
    unready intent from avoidable friction; never treat an aggregate abandonment
    rate alone as proof of a design defect or as permission to coerce a purchase.
  severity: warning
  resolution: review
  source: https://baymard.com/lists/cart-abandonment-rate

BAYMARD_CHECKOUT_COST_TRANSPARENCY:
  parent: BAYMARD_RESEARCH_BOUNDARY
  statement: >
    Show the current order total and explain delivery charges, fees and taxes
    before commitment wherever the service can calculate them. Label estimates
    as estimates; do not reveal avoidable charges only at the final step.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

BAYMARD_INLINE_VALIDATION_RECOVERY:
  parent: BAYMARD_RESEARCH_BOUNDARY
  statement: >
    Form validation supports recovery: do not report an error before a user has
    had a reasonable chance to enter a value, identify the specific problem,
    clear or update feedback when corrected, and preserve unrelated valid input.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/inline-form-validation

BAYMARD_USER_AGENCY_OVER_CONVERSION:
  parent: BAYMARD_RESEARCH_BOUNDARY
  statement: >
    A conversion gain is not acceptable when achieved through concealed costs,
    deceptive urgency, unnecessary forced account creation, preselected extras,
    obstructed refusal or cancellation, or misleading consent. Preserve a clear
    and usable path to decline, revise or leave.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/current-state-of-checkout-ux

# Research-informed commerce requirements. The task profile measures journeys;
# these rows own the normative requirements and remain subordinate to the local
# product, its actual capabilities and observed user needs.
BAYMARD_GUEST_CHECKOUT_IS_PRIMARY:
  parent: BAYMARD_USER_AGENCY_OVER_CONVERSION
  statement: >
    Where guest purchase is supported, make guest checkout the clear primary
    path. Sign-in and account creation may remain available, but must not obscure,
    delay or coerce the guest path.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

BAYMARD_CHECKOUT_FIELDS_EARN_THEIR_PLACE:
  parent: BAYMARD_USER_AGENCY_OVER_CONVERSION
  statement: >
    Ask only for information needed to complete the actual legal, fulfilment,
    payment or safety task. State why sensitive or unexpected information is
    needed; mark required and optional fields; progressively disclose optional
    address, company and tax details; preserve browser autofill and sensible
    autocomplete. Do not split one piece of information without a real regional
    or provider requirement. Field count is measured evidence, not a universal
    numeric ceiling.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

BAYMARD_CHECKOUT_ORIENTATION_AND_SUMMARY:
  parent: CURRENT_LOCATION_MARKED
  statement: >
    A checkout makes the current step, remaining work and next action explicit.
    The order summary and current total remain easy to inspect; returning to edit
    an earlier choice preserves entered data and does not silently restart the
    task. Mobile may collapse the summary only when it remains immediately
    discoverable and operable.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

BAYMARD_FULFILMENT_CHOICES_ARE_TRANSPARENT:
  parent: BAYMARD_CHECKOUT_COST_TRANSPARENCY
  statement: >
    Show every applicable fulfilment method in a comparable form, including
    delivery or pickup, known cost, date or range, availability and genuine
    cut-off conditions. Use delivery-date language when a date is known. Never
    invent availability, countdowns, costs or delivery promises.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

BAYMARD_PAYMENT_OPTIONS_ARE_TRUTHFUL:
  parent: BAYMARD_USER_AGENCY_OVER_CONVERSION
  statement: >
    Show only payment methods the service actually supports in the current
    context. Explain material conditions before commitment, use appropriate
    field formats and preserve recovery when payment details fail. Trust,
    security and express-payment claims must describe verified capabilities,
    not decorative reassurance or unavailable methods.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

BAYMARD_ADAPTIVE_VALIDATION_MESSAGES:
  parent: BAYMARD_INLINE_VALIDATION_RECOVERY
  statement: >
    A field error names the specific failed condition and the action that will
    resolve it, rather than asking the user to diagnose a generic invalid value.
    Distinguish missing, incomplete, malformed, out-of-range and contextually
    rejected values where those states differ. After a reasonable entry attempt,
    show feedback close to the field; once shown, update or clear it as the user
    corrects the value. For multiple errors, provide an accessible summary linked
    to the affected fields as well as inline guidance. Use neutral, non-blaming
    language and never rely on colour alone.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/inline-form-validation

BAYMARD_MOBILE_CHECKOUT_KEYBOARD_RESILIENCE:
  parent: REACH
  statement: >
    A mobile checkout remains oriented and completable at narrow viewports with
    the software keyboard open. Use suitable input types, input modes,
    autocomplete tokens and correction settings. Prefer persistent labels above
    fields when side-by-side labels reduce usable input width or hide context;
    keep field help adjacent and never rely on a disappearing inline label or
    placeholder alone. A side label is acceptable only when it leaves sufficient
    input width and full field context visible with the keyboard open. Use a
    single primary content column; keep the guest path,
    order summary and primary action reachable without keyboard or sticky-chrome
    obstruction. Prove this with a real keyboard-open browser/device check, not
    source CSS alone.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/mobile-checkout

BAYMARD_ORDER_CONFIRMATION_IS_ACTIONABLE:
  parent: BAYMARD_USER_AGENCY_OVER_CONVERSION
  statement: >
    After an order attempt, report its actual state and provide the information
    needed for the next step: order reference where one exists, items and total,
    fulfilment choice and known timing, and a clear support or return path.
    Distinguish accepted, pending and completed payment or fulfilment. Offer
    account creation after the order only as an optional, clearly explained
    choice; never gate the confirmation or order status behind registration.
  severity: error
  resolution: review
  source: https://baymard.com/research-articles/ecommerce-checkout-usability-report-and-benchmark

# Figma is a design-library projection of the canonical token and Law systems.
# These requirements govern a pub5 library if one is created; they are not claims
# that Figma mandates this particular three-tier architecture.
DESIGN_TOKEN_ARCHITECTURE_IS_SINGULAR:
  parent: SINGULARITY
  statement: >
    MASTER/data/tokens.yml remains the sole design-token authoring authority.
    A Figma library mirrors it; it does not create a competing palette or token
    source. Organize variables into 01-Primitives for raw values, 02-Semantic
    for role and intent, optional 03-Component for justified component aliases,
    04-Motion for used timing and easing, and optional 05-Elevation only where
    the product's surface Laws permit real elevation. If both themes are
    supported, Light and Dark belong on 02-Semantic, not on raw primitives.
    Use lower-case slash-hierarchies for semantic names such as surface/default,
    text/primary, action/primary, border/default, status/success, gap/md,
    stack/md, inset/md and radius/control. Do not create empty collections,
    parallel type/spacing scales or duplicate existing token families.
  severity: error
  resolution: review

DESIGN_COMPONENTS_CONSUME_SEMANTIC_TOKENS:
  parent: DESIGN_TOKEN_ARCHITECTURE_IS_SINGULAR
  statement: >
    Reusable components bind to semantic roles, not raw primitive values.
    Component-specific variables exist only for a demonstrated component
    contract and alias the corresponding semantic variable, for example
    button/primary/background -> action/primary and button/primary/text ->
    action/on-primary. Primitive values remain internal foundations, not the
    default component API; components do not carry loose duplicate hex, spacing
    or radius literals.
  severity: error
  resolution: review

DESIGN_MODES_REPRESENT_REAL_SEMANTIC_CONTEXTS:
  parent: DESIGN_TOKEN_ARCHITECTURE_IS_SINGULAR
  statement: >
    Light and Dark, and any additional brand, density, language or platform
    modes, represent real semantic contexts on the semantic collection.
    Primitive collections have no modes by default. Do not add modes merely to
    flatten distinct product identities: Brgen, Amber, bsdports and other
    products retain their operator-owned visual dialects.
  severity: warning
  resolution: review

DESIGN_COMPONENTS_USE_LAYOUT_AND_DECLARED_STATES:
  parent: PROXIMITY
  statement: >
    Reusable interface components use Auto Layout and variants or component
    properties for genuine differences in state and content. Each applicable
    interactive component documents and represents default, hover, focus,
    pressed, disabled and loading states; omit states that the interaction
    cannot have. A freeform illustration may remain freeform when layout
    constraints do not apply.
  severity: warning
  resolution: review

DESIGN_VARIABLES_AND_COMPONENTS_ARE_DESCRIBED:
  parent: TRUTHFUL_STATUS
  statement: >
    Every published design variable, reusable component and meaningful
    component property has a description of its intent, valid use and
    limitations. A name alone is not a sufficient usage contract for a human
    or an agent.
  severity: warning
  resolution: review

DESIGN_LIBRARY_HAS_STABLE_INFORMATION_ARCHITECTURE:
  parent: PROXIMITY
  statement: >
    A published design library is navigable in a stable sequence: Cover and
    Principles; Foundations - Primitives; Foundations - Semantic; Components;
    Patterns; Icons; Motion; Guidelines and Governance; Changelog. Component
    families are grouped by task, and each component records anatomy, variants,
    applicable states, usage and accessibility. Use slash grouping for
    semantic variable names. Publish only after descriptions, aliases,
    component states and library content have been checked. Do not create a
    page or component family without content that earns it.
  severity: warning
  resolution: review

DESIGN_CODE_CONNECT_MAPS_REAL_IMPLEMENTATIONS:
  parent: TRUTHFUL_STATUS
  statement: >
    When Figma Code Connect is used, each mapping points to a real published
    design component and its current implementation path and API. Stale,
    missing or inferred mappings remain unverified until checked against the
    repository; Code Connect is optional and never a substitute for source
    review or rendered proof.
  severity: warning
  resolution: review
  source: https://help.figma.com/hc/en-us/articles/23920389749655-Code-Connect

DESIGN_REFERENCE_MAPPINGS_PRESERVE_PRODUCT_IDENTITY:
  parent: EXTERNAL_RESEARCH_IS_EVIDENCE_NOT_AUTHORITY
  statement: >
    External design systems such as Stripe may inform semantic role mapping,
    not transfer their brand identity. Map reference concepts to local roles
    such as surface, text, action, border, status, spacing and radius only when
    the existing token source supports them. Do not import their exact palette,
    wordmark, typeface, gradient, shadow treatment or radii into a product
    without explicit operator ownership and local visual-law review.
  severity: error
  resolution: review

# ---

ATTESTATION_IS_NOT_FINDING:
  root: visible_state
  statement: >
    An attestation is a first-person declaration whose evidence is the
    operator's signature, not runtime measurement. The loader records
    it, the trace cites it, the review does not overturn it. Presenting
    an attestation as a finding is a false claim about state; it is a
    violation of truthful_status. Presenting a finding as an
    attestation is the same violation from the other side.
  severity: error
  resolution: never
  mechanical: Master::Law::Attestation#class
  semantic: Master::Law::Attestation#evidence_class

ATTESTATION_IS_NOT_FINDING_as_finding:
  parent: ATTESTATION_IS_NOT_FINDING
  statement: "An attestation presented as a finding."
  resolution: never

ATTESTATION_IS_NOT_FINDING_as_attestation:
  parent: ATTESTATION_IS_NOT_FINDING
  statement: "A finding presented as an attestation."
  resolution: never

# ==========================================================================
# 4. THE NAMED PRINCIPLES
# ==========================================================================

KISS:
  root: no_surplus
  statement: >
    Keep It Simple, Stupid. The simplest solution that works. Every
    layer of indirection, every abstraction, every configuration option
    must earn its existence by removing more than it adds.
  severity: warning
  resolution: review
  mechanical: composite (BOUNDED_LOAD, DENSITY, YAGNI)
  semantic: human
  lineage: "Kelly Johnson, Lockheed Skunk Works"

YAGNI:
  root: no_surplus
  statement: >
    You Aren't Gonna Need It. Build only what the current requirement
    demands. An unused feature is not an investment; it is code that
    will drift, mislead a reader, and cost more to remove than it saved
    to write.
  severity: warning
  resolution: review
  mechanical: composite (DENSITY_dead_code, SPECULATIVE_GENERALITY)
  semantic: human
  lineage: "Ron Jeffries, Extreme Programming"

SPARE_COMMENTS:
  root: no_surplus
  statement: >
    Code a reader must decode is not finished: rename and reshape until the
    code says what it does. A comment is the last resort - one present-tense
    line stating a reason the reader cannot derive. Any comment narrating
    what the code used to be, or where it came from, goes in the git commit
    message instead, and a rationale that must outlive the code goes in
    README.md prose.
  severity: warning
  resolution: review
  mechanical: composite (NO_CHANGELOG_COMMENT, WHY_NOT_WHAT, DENSITY_comments_as_deodorant)
  semantic: human

POLA:
  root: least_surprise
  statement: >
    Principle of Least Astonishment. A system behaves the way a person
    who has not read the source will expect. If a necessary feature
    astonishes, redesign the feature rather than document the surprise.
  severity: warning
  resolution: review
  mechanical: composite (POLA_mental_models, POLA_intuitive_navigation, POLA_bem_in_views, POLA_meaningless_name)
  semantic: human
  lineage: "IEEE Standard 610.12; colloquially 'Principle of Least Surprise'"

POLA_mental_models:
  parent: POLA
  statement: "The system behaves in a way the operator did not expect, and does not name which will change."
  resolution: review

POLA_intuitive_navigation:
  parent: POLA
  statement: "A reader cannot predict where the next thing lives."
  resolution: review

POLA_bem_in_views:
  parent: POLA
  statement: "A view class that does not follow block-element-modifier."
  resolution: review

POLA_meaningless_name:
  parent: POLA
  statement: "A name that does not state the present meaning of the thing."
  resolution: review

# ---

SOLID:
  root: one_responsibility
  statement: >
    Five object-oriented design principles. Each exists because a
    class designed without it becomes brittle under the next change.
  severity: error
  resolution: review
  mechanical: composite (SRP, OCP, LSP, ISP, DIP)
  semantic: human
  lineage: "Robert C. Martin"

SRP:
  parent: SOLID
  statement: >
    Single Responsibility Principle. A class has one reason to change.
    A class with two reasons to change is changed for one and broken
    for the other.
  severity: warning
  resolution: review
  mechanical: Master::Law::Structural#responsibility
  semantic: human

SRP_no_god_class:
  parent: SRP
  statement: "A class with one name and ten responsibilities."
  resolution: review

SRP_feature_envy:
  parent: SRP
  statement: "A method that reaches into another object's data more than its own."
  resolution: review

OCP:
  parent: SOLID
  statement: >
    Open/Closed Principle. A unit is open for extension and closed for
    modification. A new requirement changes behaviour by adding a
    variant, not by editing a decision the unit already made.
  severity: warning
  resolution: review
  mechanical: Master::Law::Structural#open_closed
  semantic: human

LSP:
  parent: SOLID
  statement: >
    Liskov Substitution Principle. A subtype is substitutable for its
    base type without altering correctness. A subclass that narrows
    preconditions or widens postconditions is not a subtype; it is an
    impostor.
  severity: error
  resolution: review
  mechanical: Master::Law::Structural#liskov
  semantic: human

ISP:
  parent: SOLID
  statement: >
    Interface Segregation Principle. A client depends only on the
    methods it uses. An interface that forces a client to depend on
    methods it never calls has bound the client to changes it does not
    care about.
  severity: warning
  resolution: review
  mechanical: Master::Law::Structural#interface_segregation
  semantic: human

DIP:
  parent: SOLID
  statement: >
    Dependency Inversion Principle. Depend on abstractions, not on
    concretions. The high-level policy of the system does not know the
    low-level mechanism that carries it out.
  severity: error
  resolution: review
  mechanical: Master::Law::Structural#dependency_inversion
  semantic: human

# ---

CQS:
  root: one_responsibility
  statement: >
    Command-Query Separation. A method either answers a question or
    changes a thing, not both. A method that does both cannot be called
    without a side effect, which means it cannot be called safely from
    anywhere that needs only the answer.
  severity: warning
  resolution: review
  mechanical: Master::Law::Structural#cqs
  calibration: measurement_only
  semantic: human
  lineage: "Bertrand Meyer"

# ---

LAW_OF_DEMETER:
  root: stable_contract
  statement: >
    Only talk to your immediate friends. A method calls methods on
    itself, its parameters, objects it creates, and its own components.
    A method that reaches through a chain of strangers has bound itself
    to the shape of an object it does not own.
  severity: warning
  resolution: review
  mechanical: Master::Law::Structural#law_of_demeter
  semantic: human
  lineage: "Lieberherr & Holland, 1987"

LAW_OF_DEMETER_train_wreck:
  parent: LAW_OF_DEMETER
  statement: "A chain of accessors that traverses more than one intermediary."
  resolution: review

# ---

STRUNK_WHITE:
  parent: DENSITY
  statement: >
    The Elements of Style. Prose is a machine for transmitting thought
    from one mind to another; every word the reader must read and does
    not need is a cost the writer imposed on the reader.
  severity: warning
  resolution: review
  mechanical: Master::Law::Prose#all
  semantic: human
  lineage: "Strunk & White, The Elements of Style"

STRUNK_WHITE_omit_needless_words:
  parent: STRUNK_WHITE
  statement: "A qualifier that does not change the meaning."
  resolution: review
  english_leeches: [very, rather, really, quite, pretty, somewhat, just, basically, simply]
  english_keep:
    - 'rather than'
    - 'just (?:as|because|before|after|when)'
    - '(?:not|never)\\s+(?:just|simply|only)'
    - 'just\\s+(?:\\w+ed|found|said|ran|saw|built)'
    - '(?:the|this|that|its) very'
  english_absent_on_purpose:
    actually: "Contrastive use is this repo's recurring subject; 85 hits, all that use."
    literally: "Same reason. 4 hits, all that use."
  norwegian_leeches: [veldig, svært, ganske, nokså, temmelig, virkelig, simpelthen]
  norwegian_keep: ['heller enn', 'ikke bare']
  norwegian_absent_on_purpose:
    bare: >
      Reads as English just but the restrictive sense is the only one
      present: all eleven hits were "du kan bare slette", "bare
      medlemmer poster", "Dating er bare for voksne". Bokmål has no
      other word for that "only"; deleting it inverts the sentence.

STRUNK_WHITE_active_voice:
  parent: STRUNK_WHITE
  statement: "The actor is not the subject of the sentence."
  resolution: review
  passive:
    auxiliary: '(?:was|were|been)'
    participle: '(?:\\w+ly\\s+)?\\w+ed'
    agent: 'by'

STRUNK_WHITE_positive_form:
  parent: STRUNK_WHITE
  statement: "A negation where an affirmation states the same thing more directly."
  resolution: review

STRUNK_WHITE_definite_specific_concrete:
  parent: STRUNK_WHITE
  statement: "An abstraction where a definite, specific, concrete word is available."
  resolution: review

STRUNK_WHITE_parallel_structure:
  parent: STRUNK_WHITE
  statement: "Coordinated elements that do not share grammatical form."
  resolution: review

STRUNK_WHITE_one_topic_paragraph:
  parent: STRUNK_WHITE
  statement: "A paragraph with more than one idea."
  resolution: review

STRUNK_WHITE_keep_related_together:
  parent: STRUNK_WHITE
  statement: "Words that modify each other separated by intervening matter."
  resolution: review

CHROME_COPY_CALM:
  parent: STRUNK_WHITE
  statement: "Interface copy states facts without exclamation marks."
  severity: warning
  resolution: review

ACTION_LABEL_BRIEF:
  parent: STRUNK_WHITE
  statement: "A button or action label is at most three words and leads with the verb."
  severity: info
  resolution: review

# ---

BRINGHURST:
  parent: PROPORTION
  statement: >
    The Elements of Typographic Style. Typography exists to honour
    content. The page is a machine for reading, and its measure,
    rhythm, scale, and alignment are the mechanism.
  severity: info
  resolution: review
  mechanical: Master::Law::Typography#all
  semantic: human
  lineage: "Robert Bringhurst, The Elements of Typographic Style"

BRINGHURST_measure:
  parent: BRINGHURST
  statement: "Prose measured outside 45-75 characters; 66 where one number must serve. Terminal prose wraps at 72."
  resolution: review

BRINGHURST_rhythm:
  parent: BRINGHURST
  statement: "Rhythm not held; blank lines padding rather than separating."
  resolution: review

BRINGHURST_line_breaks:
  parent: BRINGHURST
  statement: "Line break at a non-word boundary; a ragged edge treated as a saw."
  resolution: review

BRINGHURST_scale:
  parent: BRINGHURST
  statement: "More than two weights on a terminal; emphasis louder than structure."
  resolution: review

BRINGHURST_alignment:
  parent: BRINGHURST
  statement: "Prose justified or space-padded into a fake table."
  resolution: review

QUOTES_BY_LOCALE:
  parent: BRINGHURST
  statement: "Quotation marks and apostrophes in web copy are the locale's typographic marks, never straight quotes."
  severity: warning
  resolution: review

PARENTHETICAL_DASH:
  parent: BRINGHURST
  statement: >
    A dash that sets off a phrase in web copy is a spaced en dash; a hyphen
    or a double hyphen is never a dash.
  severity: warning
  resolution: review

TRUE_SYMBOLS:
  parent: BRINGHURST
  statement: "A dimension, a negative number, a copyright or a trademark in web copy uses its true symbol."
  severity: info
  resolution: review

SINGLE_SENTENCE_SPACE:
  parent: BRINGHURST
  statement: "Sentences in copy are separated by one word space."
  severity: info
  resolution: review

NUMBER_UNIT_UNBROKEN:
  parent: BRINGHURST
  statement: "A number and its unit, or the groups of one number, are one unbreakable word."
  severity: warning
  resolution: review
NUMBER_GROUPED_IN_THOUSANDS:
  parent: BRINGHURST
  statement: "A number of five or more digits groups its digits three by three from the right with an unbreakable space."
  severity: info
  resolution: review

NO_SPACED_EM_DASH:
  parent: BRINGHURST
  statement: "Norwegian copy never sets an em dash; an aside is a spaced en dash."
  severity: warning
  resolution: review

ELLIPSIS_SPACE_BEFORE:
  parent: BRINGHURST
  statement: "An ellipsis in copy breathes: a space before the three dots."
  severity: info
  resolution: review


PARAGRAPH_SEPARATION_ONE_DEVICE:
  parent: BRINGHURST
  statement: >
    Paragraphs are separated by an indent or by space, never both, and the
    first paragraph is never indented.
  severity: warning
  resolution: review

PRINT_PAGE_CANON:
  parent: BRINGHURST
  statement: "A printed BIZ page sets its margins in classical proportion, inner smallest and foot largest."
  severity: warning
  resolution: review

BUSPLAN_PAIR_FOLDER:
  parent: BRINGHURST
  statement: >
    A business plan folder carries only what the reader receives: the
    html, its svg mark, the pdf and the png of the front page, in one
    folder named after the pair. Nothing else - not source, not tooling -
    sits in the published folder.
  severity: warning
  resolution: review

BUSPLAN_SOURCE_OF_RECORD:
  parent: BRINGHURST
  statement: >
    A business plan's editable source lives outside the published plan
    tree entirely; the published pair is regenerated from it and the
    source is never what the reader is handed.
  severity: warning
  resolution: review

BUSPLAN_AUDIT_COVERAGE:
  parent: BRINGHURST
  statement: >
    A published business plan records its laws audit; every law receives
    an explicit verdict, and an out-of-scope law still names its scope.
  severity: warning
  resolution: review

BUSPLAN_NO_WORKING_TREES:
  parent: BUSPLAN_PAIR_FOLDER
  statement: >
    A business plan tree carries only the plan folders: no scripts
    folder, no research folder, no index or report documents beside
    them. Conclusions land in the plan, the build and the laws, and the
    notes and ad-hoc scripts behind them are deleted from the published
    tree once their work is done; the anlage that regenerates the pair
    lives in the tools tree, outside the published one.
  severity: warning
  resolution: review

BUSPLAN_TEMPLATE_BOB2:
  parent: BUSPLAN_PAIR_FOLDER
  statement: >
    Every business plan is rendered from the bob2 starter template: its
    token vocabulary, body in Source Serif 4 and headings in EB Garamond,
    the plan's own mark kept as artwork, and the one hefte print contract
    of 156 by 234 millimetres with the cover as the first page and the
    folio in the foot. A plan pair in another skin is not a finished plan.
  severity: warning
  resolution: review

BUSPLAN_PRINT_PAIR:
  parent: BUSPLAN_SOURCE_OF_RECORD
  statement: >
    A business plan's pdf is printed from its built html by the anlage's
    printer, and the print is verified - page size, folio, margins - on
    every run; a pdf produced by any other path is the wrong edition and
    reads as suspect until reprinted.
  severity: warning
  resolution: review


EMPHASIS_ONE_DEVICE:
  parent: BRINGHURST
  statement: >
    Emphasis uses one device at a time; bold and italic are never combined,
    and underline is reserved for links.
  severity: warning
  resolution: review

TYPE_SIZE_ECONOMY:
  parent: BRINGHURST
  statement: >
    A rendered screen sets its text in at most four sizes and two weights,
    all taken from the shared type tokens.
  severity: warning
  resolution: review

SIZE_COMPENSATED_SPACING:
  parent: BRINGHURST
  statement: "Leading and tracking tighten as type grows and open as it shrinks."
  severity: warning
  resolution: review

NO_FAUX_TYPE:
  parent: BRINGHURST
  statement: >
    Every weight, style and caps variant a page asks for exists in the face
    that paints it; the browser never synthesizes or stretches letters.
  severity: warning
  resolution: review

CAPS_RUN_SHORT:
  parent: BRINGHURST
  statement: "All-caps text is shorter than one line and, at display size, is tracked."
  severity: warning
  resolution: review

TYPEFACE_PER_ROLE:
  parent: BRINGHURST
  statement: "One sans family sets UI and text; monospace is only for chat, terminal and code; BIZ may use serifs."
  severity: warning
  resolution: review

TABULAR_NUMERALS:
  parent: BRINGHURST
  statement: "Counts, prices, times and table columns use tabular figures."
  severity: warning
  resolution: review

TERMINAL_OUTPUT_TYPOGRAPHY:
  parent: BRINGHURST
  statement: "Terminal output is ASCII, concise and measured; long status copy is split at meaningful boundaries."
  severity: warning
  resolution: review

HEADING_WRAP_BALANCE:
  parent: BRINGHURST
  statement: "A heading never ends on one stray word; it wraps balanced."
  severity: warning
  resolution: review

HANGING_PUNCTUATION:
  parent: BRINGHURST
  statement: >
    The punctuation of full quotes, bullets and marginal marks hangs into
    the margin, so the visible text edge stays true. (Bringhurst: hanging
    punctuation preserves the optical margin.)
  severity: info
  resolution: review
  lineage: "Robert Bringhurst, The Elements of Typographic Style, ch. 18"

WIDOW_ORPHAN_BLOCKED:
  parent: BRINGHURST
  statement: >
    A column never ends with the last line of a paragraph alone or begins
    with the first line of a paragraph stranded; the break is fixed at the
    block, not left to the fragment.
  severity: warning
  resolution: review
  lineage: "Robert Bringhurst, The Elements of Typographic Style, ch. 6"

BASELINE_SPACE_MULTIPLES:
  parent: BRINGHURST
  statement: >
    The vertical space a page grants its headings, blocks and margins steps
    in whole multiples of the body's base leading; spacing that ignores the
    leading shatters the text block's rhythm.
  severity: warning
  resolution: review
  lineage: "Robert Bringhurst, The Elements of Typographic Style, ch. 7"

MEASURE_STANDING_COLUMN:
  parent: BRINGHURST
  statement: >
    A column built for continuous reading stands taller than it is wide;
    a squat wide block is a display panel, not a text column.
  severity: info
  resolution: review
  lineage: "Robert Bringhurst, The Elements of Typographic Style, ch. 8"

PRINT_FOLIO_PRESENCE:
  parent: BRINGHURST
  statement: >
    A printed document of more than one page numbers every page in the
    same place and voice; an unnumbered folio is a lost page.
  severity: warning
  resolution: review
  lineage: "Robert Bringhurst, The Elements of Typographic Style, ch. 2"

LETTERSPACE_CAPS_ONLY:
  parent: BRINGHURST
  statement: >
    Tracking out is a treatment of capitals at display size; lowercase
    prose is never letterspaced, and small text is never tracked open.
  severity: warning
  resolution: review
  lineage: "Hoefler & Co. typographic guidance (typography.com)"

TYPEFACE_PAIR_CONTRAST:
  parent: BRINGHURST
  statement: >
    Two typefaces that meet on one page differ in weight, width, x-height
    or voice; near-identical pairs read as mistakes, not as pairing.
  severity: warning
  resolution: review
  lineage: "Hoefler & Co. typographic guidance (typography.com)"

# ---

RAILS_DOCTRINE:
  root: stewardship
  statement: >
    The Rails Doctrine. A framework's posture toward its programmer is
    a design decision, and Rails chose: optimize for programmer
    happiness, trust convention over configuration, and treat the
    whole stack as one integrated system rather than a bag of parts. Common
    workflows have sensible, context-aware defaults: the operator should not
    have to memorize flags or environment variables to get expected behaviour.
  severity: info
  resolution: review
  mechanical: Master::Law::Rails#doctrine
  semantic: human
  lineage: "David Heinemeier Hansson, The Rails Doctrine"

RAILS_DOCTRINE_optimize_for_programmer_happiness:
  parent: RAILS_DOCTRINE
  statement: "A design choice that makes the programmer less happy for the machine's benefit, without measured justification."
  resolution: review

RAILS_DOCTRINE_convention_over_configuration:
  parent: RAILS_DOCTRINE
  statement: >
    A configuration, flag, environment variable or repeated choice where a
    convention the reader already knows would provide the expected common
    behaviour. Keep configuration for meaningful alternatives, not ceremony.
  resolution: review

RAILS_DOCTRINE_sensible_defaults:
  parent: RAILS_DOCTRINE
  statement: >
    An ordinary workflow that requires the operator to memorize an option,
    repeat a choice or perform setup when a safe, unsurprising default can be
    inferred from reliable context. The common path works without instruction;
    overrides remain available for genuinely different modes, never to widen
    authority or permissions.
  resolution: review

RAILS_DOCTRINE_omakase:
  parent: RAILS_DOCTRINE
  statement: "A choice assembled from parts when the chef's menu is one decision the operator can change wholesale."
  resolution: review

RAILS_DOCTRINE_no_one_paradigm:
  parent: RAILS_DOCTRINE
  statement: "A paradigm enforced where the problem does not demand it."
  resolution: review

RAILS_DOCTRINE_beautiful_code:
  parent: RAILS_DOCTRINE
  statement: "Code that works but cannot be read."
  resolution: review

RAILS_DOCTRINE_sharp_knives:
  parent: RAILS_DOCTRINE
  statement: "A blunt tool where a sharp one with a clear edge would serve the expert better."
  resolution: review

RAILS_DOCTRINE_integrated_systems:
  parent: RAILS_DOCTRINE
  statement: "A system split into parts that must be developed, deployed, and reasoned about separately without a measured reason."
  resolution: review

RAILS_DOCTRINE_progress_over_stability:
  parent: RAILS_DOCTRINE
  statement: "A stability held at the cost of a progress the operator has not chosen."
  resolution: review

RAILS_DOCTRINE_whole_parachute:
  parent: RAILS_DOCTRINE
  statement: "A layer adopted partially, so the reader must hold both the framework's shape and the shape it was meant to replace."
  resolution: review

# ==========================================================================
# 5. THE REMAINING UNIVERSAL LAWS
# ==========================================================================

BOUNDED_LOAD:
  root: bounded_load
  statement: >
    Never exceed what the reader can hold at once. Capacity is a
    property of people, not of the design.
  severity: warning
  resolution: review
  mechanical: Master::Law::Structural#bounds
  semantic: human

BOUNDED_LOAD_small_functions:
  parent: BOUNDED_LOAD
  statement: "A method requiring a notebook."
  resolution: review

BOUNDED_LOAD_small_files:
  parent: BOUNDED_LOAD
  statement: "A file with more than one concept."
  resolution: review

BOUNDED_LOAD_nesting_depth:
  parent: BOUNDED_LOAD
  statement: "Nesting deeper than the reader can follow."
  resolution: review

BOUNDED_LOAD_few_arguments:
  parent: BOUNDED_LOAD
  statement: "A method with more than three arguments."
  resolution: review

BOUNDED_LOAD_choice_overload:
  parent: BOUNDED_LOAD
  statement: "More choices than the reader can decide between."
  resolution: review
  lineage: "Hick's law; Miller's law"

BOUNDED_LOAD_abc_size:
  parent: BOUNDED_LOAD
  statement: "A class whose burden exceeds the reader's reach."
  resolution: review

# ---

PROPORTION:
  root: proportion
  statement: >
    Relationships follow a declared scale, never an arbitrary value.
    A number with no derivation cannot be checked or changed as a set.
  severity: warning
  resolution: review
  mechanical: Master::Law::Surface#proportion
  semantic: human

PROPORTION_eight_px_rhythm:
  parent: PROPORTION
  statement: "Vertical spacing not on the 8px base."
  resolution: review

PROPORTION_contrast:
  parent: PROPORTION
  statement: "Hierarchy that requires squinting."
  resolution: review

DIALECT_CONTRAST_PARITY:
  parent: PROPORTION_contrast
  statement: "Each colour role keeps the same contrast in a dialect's light and dark modes."
  severity: warning
  resolution: review

MUTED_INK_FROM_GROUND:
  parent: PROPORTION_contrast
  statement: "Secondary text on a coloured ground is a tint of that ground or of the ink, never a neutral grey."
  severity: warning
  resolution: review

PROPORTION_hardcoded_absolute_path:
  parent: PROPORTION
  statement: "A machine-specific path in code."
  resolution: review

ONE_PRIMARY_ACTION:
  parent: PROPORTION
  statement: "A view has exactly one primary action, and the eye finds it first."
  severity: warning
  resolution: review

ALIGNMENT_NEAR_MISS:
  parent: PROPORTION
  statement: "Elements that look aligned are aligned to the pixel, and a narrow screen uses at most three left edges."
  severity: error
  resolution: review

# ---

REACH:
  root: reach
  statement: >
    Whoever arrives can operate it - by keyboard, by screen reader, by
    voice, with a colour deficiency, on a phone at arm's length, in the
    environment the code runs in.
  severity: error
  resolution: review
  mechanical: Master::Law::Reach#all
  semantic: human

REACH_aria_labels:
  parent: REACH
  statement: "An interactive element with no accessible name."
  resolution: review

REACH_img_alt:
  parent: REACH
  statement: "An image with no alt text, not marked decorative."
  resolution: review

REACH_form_label:
  parent: REACH
  statement: "A form input with no label."
  resolution: review

REACH_focus_visible:
  parent: REACH
  statement: "A focusable element with no visible focus state."
  resolution: review

REACH_skip_to_main:
  parent: REACH
  statement: "A layout that traps the keyboard before the main content."
  resolution: review

REACH_html_lang:
  parent: REACH
  statement: "An HTML document with no language declared."
  resolution: review

REACH_touch_target_min:
  parent: REACH
  statement: "A target too small to hit."
  resolution: review

REACH_reduced_motion:
  parent: REACH
  statement: "An animation with no reduced-motion equivalent."
  resolution: review

REACH_direct_manipulation:
  parent: REACH
  statement: "A gesture that moves a proxy instead of the thing under the input."
  resolution: review

REACH_gesture_ownership:
  parent: REACH
  statement: "A direct gesture that does not declare its relationship to scrolling."
  resolution: review

REACH_non_native_tool:
  parent: REACH
  statement: "A zsh script reaching for a GNU text tool not on the host."
  resolution: review

GESTURE_HAS_TAP_EQUIVALENT:
  parent: REACH
  statement: "Every swipe, drag or path gesture has a single-tap control that does the same thing."
  severity: warning
  resolution: review

AUTO_MOTION_PAUSABLE:
  parent: REACH
  statement: "Content that moves, advances or updates by itself for more than five seconds has a pause control."
  severity: warning
  resolution: review

ORIENTATION_UNLOCKED:
  parent: REACH
  statement: "No app locks the screen's orientation unless the task needs it."
  severity: warning
  resolution: review

FIELD_PURPOSE_DECLARED:
  parent: REACH
  statement: "A field that asks for personal data declares its purpose, so the device can fill it."
  severity: warning
  resolution: review

AUTH_ALLOWS_PASTE:
  parent: REACH
  statement: "Signing in never blocks paste, password managers or one-time-code autofill, and never asks for a puzzle."
  severity: error
  resolution: review

LABEL_IN_NAME:
  parent: REACH
  statement: "A control's accessible name contains its visible text."
  severity: warning
  resolution: review

ICON_CARRIES_WORD:
  parent: REACH
  statement: "An icon-only control is limited to the few icons everyone reads; every other icon carries a word."
  severity: warning
  resolution: review

FOCUS_NOT_OBSCURED:
  parent: REACH
  statement: "A focused control is never hidden behind sticky or fixed chrome."
  severity: error
  resolution: review

PRIMARY_ACTION_IN_THUMB_REACH:
  parent: REACH
  statement: "On a phone, a page's primary action sits where one thumb reaches it."
  severity: warning
  resolution: review

COLOR_NOT_SOLE_SIGNAL:
  parent: REACH
  statement: "State is never carried by colour alone."
  severity: error
  resolution: review

LINK_DISTINGUISHABLE:
  parent: REACH
  statement: >
    A link inside running text is underlined, or differs from the text around
    it by 3:1 and gains a non-colour cue on hover and focus.
  severity: error
  resolution: review

NON_TEXT_CONTRAST:
  parent: REACH
  statement: >
    The boundary of a control, an icon that acts, and a focus indicator each
    reach 3:1 against what is around them.
  severity: error
  resolution: review

TEXT_SPACING_RESILIENCE:
  parent: REACH
  statement: >
    Text survives the reader's own spacing: nothing clips or overlaps when
    line, paragraph, letter and word spacing are raised.
  severity: error
  resolution: review

FLASH_THRESHOLD:
  parent: REACH
  statement: "Nothing on screen flashes more than three times in any second."
  severity: error
  resolution: review

PERSUASION_truth_bearing:
  parent: REACH
  statement: >-
    Any scarcity, urgency, social proof, reference price or default shown to a
    user is computed from a source of truth in the database and remains true at
    render time. A persuasive element that requires a fact to be false, hidden,
    or louder than the fact it decorates fails this Law.
  resolution: review

# ---

STEWARDSHIP:
  root: stewardship
  statement: >
    A change leaves what it touched better, and answers to what was
    already there. Nobody arrives at an empty site.
  severity: warning
  resolution: review
  mechanical: Master::Law::Stewardship#all
  semantic: human

STEWARDSHIP_chestertons_fence:
  parent: STEWARDSHIP
  statement: "A fence removed without naming what it kept out."
  resolution: review

STEWARDSHIP_mono_no_aware:
  parent: STEWARDSHIP
  statement: "A system that pretends nothing is temporary."
  resolution: review

PRESERVE_FIRST:
  parent: STEWARDSHIP
  statement: "Preserve working code and behaviour before improving it; never break what exists to build what does not yet exist."
  resolution: review

STEWARDSHIP_utilitas:
  parent: STEWARDSHIP
  statement: "A thing with no purpose a person can name."
  resolution: review

STEWARDSHIP_firmitas:
  parent: STEWARDSHIP
  statement: "A structure that does not visibly stand."
  resolution: review

STEWARDSHIP_venustas:
  parent: STEWARDSHIP
  statement: "Beauty added rather than what remains when the thing is fully itself."
  resolution: review

# ==========================================================================
# 6. THE TRANSFORMATIONS
# ==========================================================================

DECOUPLE:
  root: abstraction
  statement: "Remove unnecessary dependencies after flattening exposes them."
  severity: error
  resolution: review
  after: [FLATTEN, LINEARITY]

DEFRAG:
  root: proximity
  statement: "Bring one concept back together when it is scattered without cause."
  severity: error
  resolution: review
  after: [DENSITY_dead_code]

FLATTEN:
  root: no_surplus
  statement: "Remove needless wrappers, delegation layers, and empty directories."
  severity: warning
  resolution: review

HOIST:
  root: one_source
  statement: "Lift a shared value to its owner before merging its consumers."
  severity: warning
  resolution: review

MERGE:
  root: one_source
  statement: "Join equivalent units only after checking their reason to change."
  severity: warning
  resolution: review
  after: [HOIST]

RELOCATE:
  root: proximity
  statement: "Put a thing beside the concept that owns it."
  severity: warning
  resolution: review

REMOVE:
  root: no_surplus
  statement: "Delete only proven dead, redundant, historical, or transitional material."
  severity: warning
  resolution: review

RENAME:
  root: least_surprise
  statement: "Name present meaning. Rename when the existing name misleads."
  severity: warning
  resolution: review

REORDER:
  root: one_responsibility
  statement: "Put primary facts before secondary detail and exceptions."
  severity: info
  resolution: review

REFLOW:
  root: proportion
  statement: "Change line boundaries to follow structure, after structural edits."
  severity: info
  resolution: review

SIMPLIFY:
  root: no_surplus
  statement: "Pull out incidental complexity after structural changes."
  severity: warning
  resolution: review

SPLIT:
  root: one_responsibility
  statement: "Separate unlike concerns before consolidating equivalent units."
  severity: warning
  resolution: review

RECOMMEND:
  root: visible_state
  statement: "When evidence is insufficient for a safe automatic change, recommend the smallest useful change instead of guessing."
  severity: info
  resolution: never

# ==========================================================================
# 7. DATA: KINDS, RATCHETS, LINTS, AND THE FILE'S OWN METADATA
# ==========================================================================

KIND_PRODUCTION:
  root: visible_state
  statement: "A production file. A review on a finding is permanent until the operator re-reviews."
  severity: info
  resolution: never
  default_resolution: review
  expiry: never

KIND_FIXTURE:
  root: visible_state
  statement: "A fixture. A review on a finding expires in 90 days and returns if not re-accepted."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 90d

KIND_ERROR_PAGE:
  root: visible_state
  statement: "A static error page. A review on a finding expires in one year."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 1y

KIND_MAILER:
  root: visible_state
  statement: "A mailer template. A review on a finding expires in one year."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 1y

KIND_GENERATOR:
  root: visible_state
  statement: "A code generator. A review on a finding expires in one year."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 1y

KIND_MIGRATION:
  root: visible_state
  statement: "A database migration. A review on a finding expires in one year."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 1y

KIND_BASE_MAINTENANCE:
  root: visible_state
  statement: "A script sourced into the base system's maintenance. A review expires in one year."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 1y

KIND_EXEMPLAR:
  root: visible_state
  statement: "An exemplar file written to be caught by a detector. A review expires in 90 days."
  severity: info
  resolution: never
  default_resolution: review
  expiry: 90d

KIND_UNREGISTERED:
  root: visible_state
  statement: "A file whose kind is not in this registry. A finding under TRUTHFUL_STATUS_dishonest_kind."
  severity: error
  resolution: review

