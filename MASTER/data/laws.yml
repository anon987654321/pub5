self_test:
  ROBUSTNESS: scan lib/ for bare_rescue + missing timeouts
  SINGULARITY: laws.yml and deploy entries unique by id; data registries have their own lint
  LINEARITY: no nesting_depth > 4 in lib/
  PROXIMITY: test files within 1 directory of source
  ABSTRACTION: no class > god_class threshold in lib/
  DENSITY: no method > long_method threshold in lib/
  KERNEL_ADHERENCE: infra_helpers.rb wiring layer present; law adherence >= 35%
  LAW_MAP: every law id named by data/laws.yml#law_map resolves to a registered
      Law, and every covered Law names at least one. The reverse direction -
      every registered Law traced by some law - is `rake lint:law_trace`,
      a ratcheting ceiling, because it has never been zero.
  LAW_INTEGRITY: executable law lifecycle, proof metadata, universal-Law scope,
      and the derived law index remain internally consistent.
  fail_action: publish self_violation event; refuse autoloop fixes that don't restore
    the law

veto_pattern_config:
  secrets:
    detect: sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|-----BEGIN.*KEY-----
    apply: move_to_env
    violates_law: ROBUSTNESS
  sql_injection:
    # Lexical detection must target interpolated SQL string arguments, not parameterized calls or log text.
    # Heredoc-built SQL spans lines and remains an AST-level detection gap.
    detect: (?:execute|query)\w*\s*\(\s*(["'])(?:(?!\1).)*#\{
    apply: parameterize
    violates_law: ROBUSTNESS
  unfinished:
    # Only explicit TODO/FIXME markers in comments or a standalone ellipsis body count as unfinished.
    # Ordinary ellipses, ranges, "pending" states, and a bare TODO.md filename are not violations.
    detect: "#[^\\n]*\\b(TODO|FIXME)\\b(?!\\.md)|^\\s*\\.\\.\\.\\s*$"
    # This is the only veto whose subject is comment text; the other patterns inspect code.
    reads_comments: true
    apply: complete_or_track
    violates_law: ROBUSTNESS
  unsafe_calls:
    # Reject interpolation that reaches shell command text; argument-array calls and Shellwords.escape are safe forms.
    # This lexical pattern is not a substitute for AST analysis of multiline command construction.
    detect: (?:system|exec)\s*\(\s*(["'])(?:(?!\1).)*#\{|%x[\{(\[<][^)}\]>]*#\{|(?<!`)`(?!`)(?![^`\n]*Shellwords\.escape)(?=[^`\n]*#\{)[^`\n]*\s[^`\n]*`|Open3\.\w+\s*\(\s*(["'])(?:(?!\2).)*\s(?:(?!\2).)*#\{
    apply: add_safe_nav
    violates_law: ROBUSTNESS

anti_patterns:
  forbidden:
  - pattern: eval\(.*user.*\)
    reason: arbitrary_code_execution
  - pattern: rm -rf /
    reason: data_loss
  - pattern: while true.*no sleep
    reason: resource_exhaustion
  - pattern: system\(.*\$\{
    reason: command_injection
  - pattern: Marshal\.load
    reason: deserialization_rce
  - pattern: open\(.*\$\{
    reason: shell_through_open
  discouraged:
  - pattern: god_object
    reason: violates_solid_srp
  - pattern: premature_optimization
    reason: violates_yagni

architecture:
  # Phoenix preserves these boundaries while allowing their implementations to be
  # regenerated. This is architecture, not a second command or dependency registry.
  provenance_required: [goal, constraints, alternatives, evidence, decision]
  boundaries:
    master:
      path: MASTER
      entry: MASTER/bin/master
      owner: master
      depends_on: []
      check: MASTER/bin/check
    rails:
      path: RAILS
      entry: MASTER/bin/operator triangle
      owner: rails
      depends_on:
        - master
      check: MASTER/checks/runner.rb --all
    openbsd:
      path: OPENBSD
      entry: OPENBSD/mirror/bin/vps-deploy
      host: www.openbsd.amsterdam
      ssh_alias: vm23
      deploy_root: /home/dev/pub5
      deploys: [MASTER, RAILS]
      owner: openbsd
      depends_on:
        - master
        - rails
      check: OPENBSD/mirror/bin/check
    studio:
      path: STUDIO
      # b5acc93bc flattened the photograph tree; the public entry it preserved
      # is the photograph loader, guarded by STUDIO/test/idea_picture_test.rb.
      entry: STUDIO/lora/photograph.rb
      owner: studio
      depends_on: []
      check: cd STUDIO && ruby -Itest test/idea_picture_test.rb

# The deploy gate in lib/cli/pipeline.rb adds these for each kind of evidence a
# deploy carries. It read this section before it existed, so every deploy
# scored 0 and was refused with a number that measured nothing. A clean scan
# alone is 25; a deploy needs passing tests and a review on top to reach 80.
evidence_scoring:
  weights:
    test_pass: 35
    scan_clean: 25
    code_review: 20
  pass_threshold: 80

law_deps:

  # LawOrder consumes this dependency graph. Priors are optional during cold start,
  # and topological ordering ignores ids absent from the live Law catalogue.

  # Structural operations: flatten nesting before decoupling (flattening
  # exposes the hidden coupling that DECOUPLE then targets).
  DECOUPLE:
    after: [FLATTEN, LINEARITY]

  # Hoist constants before merge — merged code references the hoisted constant.
  MERGE:
    after: [HOIST_CONSTANTS, HOIST]

  # Kill dead code before defrag — defragging dead code wastes effort.
  DEFRAG:
    after: [DEAD_CODE, SPECULATIVE_GENERALITY]

  # Fix small-files violations before feature_envy — moving a method to
  # its right class only makes sense when both files are well-sized.
  FEATURE_ENVY:
    after: [SMALL_FILES, SMALL_FUNCTIONS]

  # Remove data clumps before primitive obsession — bundling into objects
  # subsumes the primitive check.
  PRIMITIVE_OBSESSION:
    after: [DATA_CLUMPS]

  # Fix switch statements (type dispatch) after removing middle men —
  # middle men often hide the type dispatch.
  SWITCH_STATEMENTS:
    after: [MIDDLE_MAN]

  # Comment drift after all structural changes — restructured code needs
  # comment review, not before.
  COMMENTS_AS_DEODORANT:
    after: [DEFRAG, MERGE, FLATTEN, EXTRACT]

  # Strunk Laws after all structural operations — prose quality is a
  # final-pass concern.
  OMIT_NEEDLESS:
    after: [DEFRAG, REFLOW]
  ACTIVE_VOICE:
    after: [OMIT_NEEDLESS]
  PARALLEL_STRUCTURE:
    after: [ACTIVE_VOICE]

  # Reflow after all density changes.
  REFLOW:
    after: [MERGE, FLATTEN, DEFRAG]

  # Bayesian/RL priors updated last — they need the post-fix violation
  # counts from all other Laws.
  PATTERN_EXTRACTION:
    after: [DEFRAG, MERGE, DECOUPLE, FLATTEN]

  # Scanner Law ordering — structural before style, security before polish.
  bare_rescue:
    after: [fail_visibly]
  silent_rescue:
    after: [bare_rescue]
  god_class:
    after: [small_functions, nesting_depth]
  long_method:
    after: [nesting_depth]
  n_plus_one:
    after: [find_each]
  yaml_declarative:
    after: [semantic]
  veto_patterns:
    after: [yaml_declarative]
  semantic:
    after: [rubocop, reek]
  adversarial:
    after: [semantic, comment_drift]
  comment_drift:
    after: [ast_omission]
  ast_omission:
    after: [co_change_coupling]
  co_change_coupling:
    after: [interconnect]
  interconnect:
    after: [rule_coverage]
  DRY:
    after: [MERGE, DEFRAG]
  KISS:
    after: [FLATTEN, long_method]
  SRP:
    after: [FEATURE_ENVY, god_class]
  CQS:
    after: [SRP]

  # SOLID literal proxies (OPEN_CLOSED/LISKOV/INTERFACE_SEGREGATION/
  # DEPENDENCY_INVERSION): all judge class/method boundaries, so they must
  # not run before SRP settles what "one class" even means here.
  OPEN_CLOSED:
    after: [SRP]
  LISKOV:
    after: [SRP, god_class]
  INTERFACE_SEGREGATION:
    after: [SRP]
  DEPENDENCY_INVERSION:
    after: [FEATURE_ENVY, SRP]
  html_lang:
    after: [meta_charset]
  no_inline_styles:
    after: [magic_color]

