  resolution: never

ROBUSTNESS_proactive_defect_audit:
  parent: ROBUSTNESS
  statement: "An audit stops at the reported incident or changed lines without examining the complete high-risk boundary for the same defect class."
  resolution: review

ROBUSTNESS_exemption_without_expiry:
  parent: ROBUSTNESS
  statement: "A review resolution accepted with no expiry."
  resolution: never

ROBUSTNESS_expired_exemption:
  parent: ROBUSTNESS
  statement: "A review resolution past its expiry still in force."
