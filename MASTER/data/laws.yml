SINGULARITY:
  node: singularity
  statement: "Every fact has one definition. Copies drift silently."
  severity: error
  resolution: review
  mechanical: Master::Law::Universal#singularity
  semantic: human
  enforcement: declared
  coverage_mode: semantic

DRY:
  parent: SINGULARITY
  statement: >
    Don't Repeat Yourself. Every piece of knowledge has one
    authoritative representation in the system. Repetition of a
    decision is duplication; repetition of a shape with three different
    reasons to change is not.
  resolution: review
  rule_of_three: >
    Three or more sites encoding one decision, co-changing for the same
    reason, consolidate at the owner. Fewer than three, keep the
    duplication; a wrong abstraction costs more than a repeated line.
    Three or more lookalike sites serving divergent clients, keep them
    distinct.
  lineage: "Hunt & Thomas, The Pragmatic Programmer"

SINGULARITY_one_true_mark:
  parent: SINGULARITY
  statement: "Two marks for one meaning."
  resolution: automatic
  proof: MASTER/test/test_cosmetic_laws.rb#test_en_dash_range_flags_hyphen_range_in_prose

SINGULARITY_configuration_shape:
  parent: SINGULARITY
  statement: "A config that reads as a program."
  resolution: review

SINGULARITY_LAW_POLICY_HAS_ONE_OWNER:
  parent: SINGULARITY
  statement: "Per-Law severity, mode, lifecycle, autofix and reach metadata has one owner in laws.yml#law_catalogue; runtime configuration must not duplicate that policy."
  resolution: never


SINGULARITY_NORMATIVE_GUIDANCE_HAS_ONE_LAW_IDENTITY:
  parent: SINGULARITY
  statement: >
    Every normative requirement has one canonical Law identity and statement in
    laws.yml, regardless of whether its source calls it a rule, principle,
    convention, standard, guideline, heuristic, doctrine, philosophy, best
    practice or normative pattern. A named pattern, smell, anti-pattern, example,
    detector, audit profile or acceptance inventory is not a second Law
    registry: it remains an instrument or evidence and references the Law IDs
    whose requirements it measures. If it expresses a requirement, that
    requirement belongs here once; descriptive signals keep their own data owner.
  severity: error
  resolution: never

SINGULARITY_magic_color:
  parent: SINGULARITY
  statement: "A raw colour literal outside the token source."
  resolution: review
  calibration: measurement_only

