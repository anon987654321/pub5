        # site may frame it; every other page keeps the app-wide frame_ancestors :self.
        content_security_policy(only: :embed) { |policy| policy.frame_ancestors "*" }
      
        def index
          tracks = local_discovery_tracks
          @featured_track = tracks.first
          @tracks = tracks.drop(1)
          @playlists = Playlist::Playlist.city_trending(Current.city_record).includes(:user).limit(8)
        end
      
        def show
          return if redirect_id_to_slug(@playlist)
      
          @tracks = playlist_tracks
          @dilla_sketches = @playlist.dilla_sketches.recent.includes(:user)
          @track_comments = waveform_comments_for(@tracks.map(&:track))
          active = @tracks.first&.track
          @comments = active ? (@track_comments[active.id] || []) : []
        end
      
        # Creator analytics are intentionally aggregate-only. They show counts for
        # tracks in this playlist, never listener identities or private listening
        # histories. Listen rows already exist as the source of truth.
        def analytics
          return if redirect_id_to_slug(@playlist)
      
          @analytics_entries = playlist_tracks.to_a
          track_ids = @analytics_entries.map(&:playlist_track_id)
          listens = Playlist::Listen.where(playlist_track_id: track_ids)
          @listen_total = listens.count
          @listen_recent = listens.where(created_at: 7.days.ago..).count
          @listen_counts = listens.group(:playlist_track_id).count
          @analytics_entries.sort_by! { |entry| -@listen_counts.fetch(entry.playlist_track_id, 0) }
        end
      
        def embed
          @tracks = playlist_tracks
          @embed_options = {
            color: embed_color,
            show_artwork: params[:show_artwork] != "0",
            compact: params[:compact] == "1",
            hide_branding: params[:hide_branding] == "1"
          }
          response.headers.delete("X-Frame-Options")
          render layout: false
        end
      
        def new
          @playlist = Playlist::Playlist.new
        end
      
        def create
          @playlist = Current.user.playlist_playlists.build(playlist_params)
          @playlist.save ?
            redirect_to(playlist_path(@playlist), notice: t("flash.playlist.playlist_created")) :
            render(:new, status: :unprocessable_entity)
