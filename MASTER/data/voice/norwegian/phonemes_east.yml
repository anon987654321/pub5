# Urban East Norwegian / Standard Østnorsk segmental inventory - evaluation reference.
id: east
description: Urban East Norwegian / Standard Østnorsk segmental inventory
r_variant: alveolar          # tap or trill
retroflexes: true

vowels:
  monophthongs:
    - iː
    - ɪ
    - yː
    - ʏ
    - ʉː
    - ʉ
    - uː
    - ʊ
    - eː
    - ɛ
    - øː
    - œ
    - oː
    - ɔ
    - æː
    - æ
    - ɑː
    - ɑ
    - ə
  diphthongs:
    - æɪ
    - æʉ
    - øʏ
    - ɑɪ
    - ɔʏ
    - ʉɪ

consonants:
  shared: [p, b, t, d, k, ɡ, m, n, ŋ, f, s, h, ʋ, j, l]
  east_only: [ʈ, ɖ, ɳ, ɭ, ʂ, ɽ, ɾ]
  notes:
    - Retroflexes arise from r + coronal clusters.
    - Primary r is alveolar tap or trill.
