retroflexes: false

vowels:
  monophthongs:
    - iː
    - ɪ
    - yː
    - ʏ
    - ʉː
    - ʉ
    - uː
    - ʊ
    - eː
    - ɛ
    - øː
    - œ
    - oː
    - ɔ
    - æː
    - æ
    - ɑː
    - ɑ
    - ə
  diphthongs:
    - æɪ
    - æʉ
    - øʏ
    - ɑɪ
    - ɔʏ
    - ʉɪ

consonants:
  shared: [p, b, t, d, k, ɡ, m, n, ŋ, f, s, h, ʋ, j, l]
