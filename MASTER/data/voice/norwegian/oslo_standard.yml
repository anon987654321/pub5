# Oslo / Eastern low-tone accent - evaluation targets only.
#
# Companion profile to bergen.yml: the reference a Bergen realisation must
# differ from. Data for Voice::Benchmark's tonem lane, never a synthesis
# path. See README.md in this directory for provenance.
id: oslo_standard
name: "Oslo / Eastern low-tone"
language: nb
role: evaluation_only
description: >
  Standard Eastern Norwegian (Oslo area) low-tone accent. Tonem 1 starts
  low or rises on the stressed syllable - not the western early-high peak -
  and tonem 2 is the high-start fall. Alveolar r with retroflex
  assimilation.
evaluation:
  tonem1_words:
    - solen
    - boken
    - døren
    - armen
    - bilen
    - huset
    - sengen
  tonem_minimal_pairs:
    - ["bønder", "bønner"]
    - ["loven", "låven"]
    - ["huset", "å huse"]
  f0_targets:
    # tonem 1: the peak must not be the western early high one; a low or
    # rising / level onset is what the eastern realisation looks like.
    tonem1_peak: low_or_rising
    tonem1_direction: rising_or_level
  phonemes: data/voice/norwegian/phonemes_east.yml
