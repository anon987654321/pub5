# Bergen / Vestland high-tone accent - evaluation targets only.
#
# This profile is data for Voice::Benchmark's tonem lane, never a synthesis
# path: no engine keys, no voice selection. Voice choice stays in
# data/voice.yml (Norwegian is spoken by Pernille until a real engine passes
# the benchmark gates). See README.md in this directory for provenance.
id: bergen
name: "Bergen / Vestland high-tone"
language: nb
role: evaluation_only
description: >
  Bergen and broader Vestland high-tone accent. Tonem 1 carries an early
  high peak on the stressed syllable and falls through the word; tonem 2
  peaks later with a different alignment. Uvular skarre-r, no retroflex
  series, two-gender morphology (boken, solen, jenten).
evaluation:
  tonem1_words:
    - solen
    - boken
    - døren
    - armen
    - bilen
    - huset
    - sengen
  tonem_minimal_pairs:
    - ["bønder", "bønner"]
    - ["loven", "låven"]
    - ["huset", "å huse"]
  f0_targets:
    # tonem 1: the peak lands early in the voiced span and falls.
    tonem1_peak: early
    tonem1_direction: falling
    avoid: eastern_low_start
  phonemes: data/voice/norwegian/phonemes_bergen.yml
  lexicon_reference: data/voice/norwegian/bergen_lexicon.tsv
prosody_notes: >
  The eastern low-tone start is the anti-target: a tonem-1 word realised
  with a low or rising onset reads as Eastern, not Bergen. Clusters stay
  r + t/d/n/l/s; retroflex realisations (ʈ ɖ ɳ ɭ ʂ ɽ) are segmental
  failures of the same accent test.
