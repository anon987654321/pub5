# Surfaces probed by GeometryProbe (rendered measurement, not source grep).
#
# brgen's vertical subdomains are derived from BrgenVerticalSurfaces so the
# host list has exactly one definition. Everything else is declared here.
#
# `host:` is optional — omit it and the surface is probed over loopback.
# Only brgen needs a real Host: its vertical routing is driven by subdomain.
#
# viewports: named [width, height]. `snapshot: true` opts a surface into the
# committed structural baseline (checks/data/layout_snapshots/); `pixel_snapshot:
# true` separately opts a deliberately small set of key surfaces into approved
# PNG comparisons (checks/data/visual_baselines/).

viewports:
  mobile: [390, 844]
  compact: [1024, 768]
  desktop: [1440, 900]

# Distinct routes are still probed independently. When two aliased routes render
# the same structure, they share one canonical baseline instead of shadow copies.
snapshot_aliases:
  "bsdports/ports_index/mobile": "bsdports/home/mobile"
  "bsdports/ports_index/desktop": "bsdports/home/desktop"
  "brgen/conversations/desktop": "brgen/messenger/desktop"

# Width sweep for the reflow check — WCAG 1.4.10 floor through desktop.
# The screenshot sweep (MASTER/lib/fix/screenshot_sweep.rb) captures every page at
# each of these widths, the set the rendered-layout backlog item names.
sweep_widths: [320, 360, 375, 390, 430, 480, 640, 768, 1024, 1280]

reflow_widths: [320, 360, 375, 390, 414, 430, 480, 540, 600, 640, 680, 768, 834, 900, 1024, 1180, 1279, 1280, 1281, 1440, 1600]

include_brgen_verticals: true
brgen_vertical_viewports: [mobile, desktop]

surfaces:
