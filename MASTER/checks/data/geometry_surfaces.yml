    label: chat
    path: /
    viewports: [mobile, desktop]
    snapshot: false
    pixel_snapshot: true
  - app: amber
    label: home
    path: /
    viewports: [mobile, compact, desktop]
    snapshot: true
    pixel_snapshot: true
  - app: amber
    label: wardrobe
    path: /items
    viewports: [mobile, desktop]
    snapshot: true
    pixel_snapshot: true
  - app: amber
    label: upload
    path: /items/new
    viewports: [mobile]
  - app: amber
    label: sign_in
    path: /session/new
    viewports: [mobile, desktop]
    snapshot: true
  - app: amber
    label: feed
    path: /posts/feed
    viewports: [mobile, desktop]
  - app: amber
    label: outfits
    path: /outfits
    viewports: [mobile, desktop]
  - app: amber
    label: demo
    path: /demo
    viewports: [mobile]
  # brgen secondary guest paths live in BrgenVerticalSurfaces (include_brgen_verticals)

  - app: bsdports
    label: home
    path: /
    viewports: [mobile, compact, desktop]
    snapshot: true
  - app: bsdports
    label: ports_index
    path: /ports
    viewports: [mobile, desktop]
    snapshot: true
    pixel_snapshot: true
  - app: bsdports
    label: search_results
    path: /ports?q=git
    viewports: [desktop]
  - app: bsdports
    label: empty_results
    path: /ports?q=zzz-no-such-port
    viewports: [desktop]
    snapshot: true
  # The legal profile's only surface: GeometryType maps privacy to worn_type
  # legal, and no other entry reaches that profile. The page's running text
  # carries lists, which is what the hanging-marker probe needs to read.
  - app: bsdports
    label: privacy
    path: /privacy
    viewports: [mobile, desktop]

