# Content that changes between two captures of an unchanged page: a clock, a
# relative time, a counter that animates up from zero, a money amount. The
# visual_contract check hides these (visibility, so the box keeps its size)
# before each screenshot, so its pixel diff reports layout rather than the
# minute; geometry still measures them.
volatile_selectors:
  - "time"
  - "[data-relative-time]"
  - "[data-controller~=animated-number]"
  - "[data-money]"
  - ".deal-card-price"
  - ".post-meta"
  # amber's anonymous sessions mint a fresh guest identity and a fresh 2FA
  # secret per request: the identity paragraph, the identity prefilled into
  # the email input, and the setup page's QR block are volatile by the same
  # rule as the clocks above (measured 2026-11-06, three probes).
  - "[title^=\"guest_\"]"
  - "input[value^=\"guest_\"]"
  - ".auth-form-qr"
  # The radio vertical's canvas tunnel visualiser paints through its own
  # requestAnimationFrame loop, which no CSS freeze stops: measured
  # 2026-11-06, two same-session captures of /playlists differed across the
  # whole page (0.17 of the pixels) on the nearly invisible spinning texture.
  - "#radio-canvas"
  # Master's face is a stack of particle canvases fed by rAF's own timestamps,
  # which no stylesheet freeze and no honest clock pin can stop: measured
  # 2026-11-07, two runs drifted 1-8 percent of pixels. Pinning the clock DID
  # go green, but falsely - frame zero of the cloud is a black field, and black
  # agrees with black (the head had never painted). The face's own checks own
  # its motion; the golden corpus photographs the page around it. Hidden here
  # with the same box-keeping visibility rule as the clocks above, per canvas
  # actually observed in the served page (probed 2026-11-07, guest, 390px):
  # #cognition-ecology (agent spirits, recreated by cognition_ecology.js),
  # #face (the head; the 2D runtime repurposes it and leaves it zero-sized),
  # #master-gravity-field (gravity_field.js particles), the 2D ASCII-at-rest
  # and phosphor-trail layers of face_2d_fallback.js and face_phosphor_trail.js,
  # and canvas:not([id]) for the one canvas the face's boot stack creates that
  # never takes an id - direct child of body, persistent, painting.
  - "#face"
  - "#cognition-ecology"
  - "#master-gravity-field"
  - "#face-2d-fallback"
  - "#face-phosphor-trail"
  - "body > canvas:not([id])"

# Images the golden-screenshot settle step waits for as part of loading: an img
# matching the selector is settled when it is complete and its src equals the
# declared attribute's value. brgen's lazy-image controller starts every photo
# at a blurhash placeholder, which reads as complete the moment it decodes, and
# swaps the real URL in from data-lazy-image-src-value when its observer fires:
# a capture that checks img.complete alone shows placeholder instead of photo
# on a loaded box (measured 2026-11-06, dating /next 768 differed 0.4057 between
# a record and check walk). Only viewport-visible unsettled images are counted.
settle_images:
  - selector: "[data-lazy-image-src-value]"
    attribute: "data-lazy-image-src-value"

# Representative pages for the bounded width sweep. Keep a product's most
# geometry-sensitive surfaces in the sweep instead of relying on YAML row order.
reflow_priority:
  brgen: [messenger, core, markedsplass_marketplace_listings_index, takeaway_restaurants]
  amber: [home, wardrobe, outfits]
  bsdports: [home, ports_index, categories_index]

# State matrix (BackstopJS's scenario list, read by Deploy::StateMatrix): each
# component is captured in its declared states and at each width, one cropped
# shot per cell, tiled into one image per component. Cells run mobile first
# (every state at 390, then 360 and 320 and 768, then 200% zoom, en and dark)
# and stop at cells_per_component; the default cap includes all of those cells. A must_differ
# state that renders identically to default is a finding, as is a cell whose
# component overflows its box or the viewport.
state_matrix:
  cells_per_component: 15
  widths: [390, 360, 320, 768, 1024, 1440, 1920]
  zoom: { width: 1280, factor: 2 }
  states: [hover, focus-visible, active, disabled, loading, error, empty, long-text]
  must_differ: [focus-visible]
  locales: [nb, en]
  schemes: [light, dark]
  components:
    - { id: brgen/core/first_action, surface: brgen/core, selector: "main :is(button, a[href])" }
    - { id: amber/home/first_action, surface: amber/home, selector: "main :is(button, a[href])" }
    - { id: bsdports/home/search, surface: bsdports/home, selector: "input[type=search], input[name=q]" }
    - { id: brgen/marketplace/hero_action, surface: brgen/marketplace, selector: ".bol-market-hero .bol-primary" }
    - { id: brgen/marketplace/filter_toggle, surface: brgen/markedsplass_marketplace_listings_index, selector: "summary.listing-filters-toggle" }
    - { id: brgen/messenger/search, surface: brgen/conversations_search, selector: ".messenger-compose-form input[type=search]" }
    - { id: brgen/messenger/channel_link, surface: brgen/messenger, selector: ".messenger-rail-room" }
    - { id: brgen/takeaway/restaurant_card, surface: brgen/takeaway_restaurants, selector: ".deal-card.restaurant .deal-card-hit" }
    - { id: brgen/takeaway/menu_action, surface: brgen/takeaway_restaurant, selector: ".listing-buy-bar-actions .button-primary" }
    - { id: brgen/takeaway/menu_quantity, surface: brgen/takeaway_restaurant, selector: "input.qty-field" }
    - { id: amber/wardrobe/add_item, surface: amber/wardrobe, selector: ".wardrobe-action-group a.button-primary" }
    - { id: amber/outfits/occasion, surface: amber/outfits, selector: "input[name=occasion]" }
    - { id: bsdports/ports_index/search, surface: bsdports/ports_index, selector: "input[type=search], input[name=q]" }

# Written by /fix's visual lane when a rendered group is cleared and approved
# (Deploy::RegressionGuards): a later soft finding of the same kind, on the same
# selector or stylesheet, on one of these surfaces reports hard as [guarded].
# Keep this key last; rows are appended.
regression_guards:
