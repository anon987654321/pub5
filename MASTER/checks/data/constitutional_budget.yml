# Per-target ceilings for the constitutional scan, in the shape of
# MASTER/data/spine.yml: the number only ever ratchets down.
#
# A finding over a target's ceiling fails the check; lowering a number is a
# commit someone signs. Chasing zero is not the goal: these are design-craft
# rules over shipping Rails apps, and a ceiling buys what a warning cannot,
# a change that adds findings fails.
#
# Lower one with CHECK_SCAN_RATCHET=1 after a run that beats it
# (MASTER/checks/runner.rb constitutional_scan). The ratchet rewrites one
# `  name: N` line at a time, so these comments survive it.
schema: 1
targets:
  # The Rails targets count every registered law over each app, ABC_SIZE
  # included (ratchet threshold 40).
  brgen: 27
  amber: 28
  bsdports: 3
  __shared: 8

  # MASTER and OPENBSD are here too. MASTER is not a duplicate of `rake
  # selfcheck`: that runs error and critical over lib and law, this is the
  # whole registry over the whole tree. Every number in this file is the
  # AESTHETIC profile, the first `scan: done` line the check reads; re-basing
  # against the full profile is a separate decision. OPENBSD at 0 fails on the
  # first design finding anyone adds, which is the point.
  OPENBSD: 0
  MASTER: 15

# The constitution measures itself: laws.yml carries a line ceiling under the
# same only-ratchets-down contract the targets above charge the trees
# (convergence.yml workstream constitution_self_budget). The count is Ruby's
# File.foreach over the file, the same count MASTER/test/test_constitutional_budget.rb
# enforces: a line added without an equal removal fails the test, and the
# ceiling here moves down only, in the commit that removed the lines.
# laws.yml is a sacred path: the ceiling is read by everyone, written by the
# operator alone. The ceiling is re-measured on the tree it lands on: 4462 on
# the pre-port main, 4208 here, because the pub4→pub5 port slimmed the
# constitution before this row arrived.
constitution_lines:
  target: MASTER/data/laws.yml
  ceiling: 4208
