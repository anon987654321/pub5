# PipeWire Client Low-Latency Overrides for Master Audio Broadcast
stream.properties = {
    node.latency         = "64/48000"
    resample.quality     = 4
    channelmix.upmix     = false
    audio.format         = "S32LE"
    audio.rate           = 48000
    bluetooth.codec      = "ldac"
    bluetooth.hq-mode    = true
}

# Force aggressive quantum buffering limits for client streams
stream.rules = [
    {
        matches = [
            { application.name = "master_audio_node" },
            { media.class      = "Stream/Output/Audio" }
        ]
        actions = {
            update-props = {
                node.min-latency = "32/48000"
                node.max-latency = "128/48000"
                node.force-rate  = 48000
            }
        }
    }
]
